ill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.5684" x="26.8803" y="469.272">Developer / Reviewer</text></g><!--entity Operator--><g class="entity" data-qualified-name="Operator" data-source-line="12" id="ent0002"><ellipse cx="102.1692" cy="585.6269" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M102.1692,593.6269 L102.1692,620.6269 M89.1692,601.6269 L115.1692,601.6269 M102.1692,620.6269 L89.1692,635.6269 M102.1692,620.6269 L115.1692,635.6269" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.1777" x="49.5803" y="650.122">Customer Care</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.665" x="49.5803" y="666.4189">Operator</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="33" id="ent0016"><path d="M279.9203,118.7269 L279.9203,174.1253 L708.7128,174.1253 L708.7128,128.7269 L698.7128,118.7269 L279.9203,118.7269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M698.7128,118.7269 L698.7128,128.7269 L708.7128,128.7269 L698.7128,118.7269" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.8179" x="285.9203" y="135.7938">&#171;constraint&#187; System-wide defaults</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.2334" x="285.9203" y="150.9266">Demonstration data is synthetic by default [CON-DATA-001].</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.7925" x="285.9203" y="166.0594">Transmission to an external AI provider is opt-in [CON-AI-002].</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="39" id="