te remains</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.7329" x="579.4189" y="384.1138">unresolved by AMB-RAG-001; this view does not decide it.</text><rect fill="#F7F7F7" height="33.9688" rx="12.5" ry="12.5" style="stroke:#303030;stroke-width:0.5;" width="214.7246" x="338.6943" y="347.4961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.7246" x="348.6943" y="368.6348">Do not fabricate policy evidence</text><polygon fill="#F7F7F7" points="301.0264,398.1797,313.0264,410.1797,301.0264,422.1797,289.0264,410.1797,301.0264,398.1797" style="stroke:#303030;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#F7F7F7" height="33.9688" rx="12.5" ry="12.5" style="stroke:#303030;stroke-width:0.5;" width="237.6465" x="182.2031" y="442.1797"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.6465" x="192.2031" y="463.3184">Execute provider-neutral AI analysis</text><rect fill="#F7F7F7" height="47.9375" rx="12.5" ry="12.5" style="stroke:#303030;stroke-width:0.5;" width="242.5801" x="179.7363" y="496.1484"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.5801" x="189.7363" y="517.2871">Validate risk level, findings summary</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.2227" x="189.7363" y="531.2559">and recommendations</text><rect fill="#F7F7F7" height="33.9688" rx="12.5" ry="12.5" style="stroke:#303030;stroke-width:0.5;" width="212.3574" x="194.8477" y="612.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.3574" x="204.8477" y="633.627">Report analysis failure explicitly</text><path d="M472.4893,670.875 L472.4893,679.4414 L452.4893,683.4414 L472.4893,687.4414 L472.4893,696.0078 A0,0 0 0 0 472.4893,696.0078 L669.7256,696.0078 A0,0 