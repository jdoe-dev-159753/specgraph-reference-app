="spacing" textLength="238.7417" x="863.13" y="389.9538">Synthetic/JDBC persistence adapters</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.3091" x="863.13" y="405.0866">provide CustomerActivityPort here.</text></g><g class="entity" data-entity="GMN19" data-source-line="34" data-uid="ent0020" id="entity_GMN19"><path d="M692.98,500.9669 L692.98,601.7638 L1281.0225,601.7638 L1281.0225,510.9669 L1271.0225,500.9669 L692.98,500.9669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1271.0225,500.9669 L1271.0225,510.9669 L1281.0225,510.9669 L1271.0225,500.9669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="567.0425" x="698.98" y="518.0338">UML Package diagram: the four direct packages are the actual Spring Modulith module</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="557.5718" x="698.98" y="533.1666">bases. Adapter sub-packages remain inside their owning module. Detailed hexagonal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="559.165" x="698.98" y="548.2994">Adapter/Strategy/Facade roles are shown in the component/port views rather than by</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="534.041" x="698.98" y="563.4322">inventing package-per-layer namespaces that do not exist in the implementation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.9165" x="698.98" y="578.565">Architecture verification ratchets the exact module identifiers:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.6362" x="698.98" y="593.6978">identity, customer, risk, analysis.</text></g><!--link Identity to Risk--><!--link Risk to Customer--><!-