    elements: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R1
  FR-ACT-001:
    elements: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R1
  FR-ACT-002:
    elements: [CMP-UI-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001, CTR-CUSTOMER-SNAPSHOT-001]
    adrs: [ADR-001, ADR-003, ADR-007]
    first_acceptance_ring: R1
  FR-RISK-001:
    elements: [CMP-UI-001, MOD-RISK-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001, CTR-CUSTOMER-SNAPSHOT-001]
    adrs: [ADR-001, ADR-003, ADR-007]
    first_acceptance_ring: R1
  FR-AI-001:
    elements: [CMP-UI-001, ADP-ANALYSIS-HTTP-001, MOD-ANALYSIS-001, PRT-DETECTOR-001, ADP-DETECTOR-NOOP-001, PRT-POLICY-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, CTR-ANALYSIS-EVIDENCE-ENVELOPE-001, PRT-MODEL-001, ADP-MODEL-DET-001, ADP-MODEL-AI-001]
    adrs: [ADR-001, ADR-002, ADR-004]
    first_acceptance_ring: R3
  FR-AI-002:
    elements: [MOD-ANALYSIS-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, PRT-DETECTOR-001, CTR-RISK-SIGNAL-EVIDENCE-001, PRT-POLICY-001, CTR-POLICY-EVIDENCE-001, CTR-ANALYSIS-EVIDENCE-ENVELOPE-001, PRT-MODEL-001, CTR-ANALYSIS-MODEL-OUTPUT-001, CTR-ANALYSIS-RESULT-001, CTR-ANALYSIS-MODEL-PROVENANCE-001, ADP-MODEL-DET-001, ADP-MODEL-AI-001]
    adrs: [ADR-002]
    first_acceptance_ring: R3
  FR-AUTH-001:
