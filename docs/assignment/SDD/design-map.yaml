schema_version: 1
design_id: CAA-DESIGN-001
normative_requirements: ../SRS/requirements.yaml
current_design_document: SDD.md

adrs:
  ADR-001: ../ADR/ADR-001-modular-monolith-hexagonal.md
  ADR-002: ../ADR/ADR-002-provider-neutral-analysis.md
  ADR-003: ../ADR/ADR-003-postgresql-pgvector-persistence.md
  ADR-004: ../ADR/ADR-004-baseline-web-stack.md
  ADR-005: ../ADR/ADR-005-prebuilt-demo-container-packaging.md
  ADR-006: ../ADR/ADR-006-compose-oci-multi-platform-distribution.md
  ADR-007: ../ADR/ADR-007-spring-jdbc-relational-adapters.md

modules:
  MOD-IDENTITY-001:
    name: identity
    responsibility: authenticated operator context and access boundary
    package: dev.specgraph.reference.identity
    activation_ring: R4
    adrs: [ADR-001, ADR-004]
  MOD-RISK-001:
    name: risk
    responsibility: source-derived risk evidence contracts and later risk-signal interpretation
    package: dev.specgraph.reference.risk
    activation_ring: R1
    adrs: [ADR-001]
  MOD-CUSTOMER-001:
    name: customer
    responsibility: customer lookup and activity read use cases
    package: dev.specgraph.reference.customer
    depends_on: [MOD-RISK-001]
    activation_ring: R1
    adrs: [ADR-001]
  MOD-ANALYSIS-001:
    name: analysis
    responsibility: staged analysis orchestration, bounded model-context construction, detector evidence, policy grounding, model synthesis and analysis history
    package: dev.specgraph.reference.analysis
    depends_on: [MOD-CUSTOMER-001]
    activation_ring: R3
    adrs: [ADR-001, ADR-002]

contracts:
  CTR-CUSTOMER-SNAPSHOT-001:
    name: CustomerSnapshot
    owner: MOD-CUSTOMER-001
    contains: [customer_identity, activities, risk_evidence]
    uses_contracts_from: [MOD-RISK-001]
    invariants: [INV-DATA-001, INV-DATA-002, INV-RISK-001]
  CTR-CUSTOMER-REVIEW-QUERY-001:
    name: CustomerReviewQuery
    owner: MOD-CUSTOMER-001
    contains: [page, page_size, activity_type, status, created_from, created_to]
    bounds: [default_page_size_50, maximum_page_size_200]
  CTR-CUSTOMER-REVIEW-PAGE-001:
    name: CustomerReviewPage
    owner: MOD-CUSTOMER-001
    contains: [customer_identity, bounded_activities, page_scoped_risk_evidence, page, page_size, total_activities, total_risk_evidence, navigation]
    uses_contracts_from: [MOD-RISK-001]
  CTR-ANALYSIS-RESULT-001:
    name: AnalysisResult
    owner: MOD-ANALYSIS-001
    contains: [risk_level, findings_summary, recommendations]
    invariants: [INV-AI-001]
  CTR-ANALYSIS-PIPELINE-ARTIFACT-001:
    name: AnalysisPipelineArtifact
    owner: MOD-ANALYSIS-001
    java_shape: sealed_interface
    discriminant: concrete_record_type
    derived_kind_values: [DETECTOR_EVIDENCE, POLICY_RETRIEVAL_EVIDENCE, MODEL_BACKEND_PROVENANCE]
    common_projection: [kind, artifact_identity, metadata]
    sealed_permits: [CTR-RISK-SIGNAL-EVIDENCE-001, CTR-POLICY-EVIDENCE-001, CTR-ANALYSIS-MODEL-PROVENANCE-001]
    prohibited_shapes: [generic_nullable_payload_union, provider_or_library_dto]
    invariants: [INV-RISK-001, INV-RAG-001, INV-AI-001]
  CTR-POLICY-EVIDENCE-001:
    name: PolicyEvidence
    owner: MOD-ANALYSIS-001
    java_shape: record
    implements: CTR-ANALYSIS-PIPELINE-ARTIFACT-001
    artifact_kind: POLICY_RETRIEVAL_EVIDENCE
    contains: [source_identity, content, retrieval_metadata]
    invariants: [INV-RAG-001]
  CTR-RISK-SIGNAL-EVIDENCE-001:
    name: RiskSignalEvidence
    owner: MOD-ANALYSIS-001
    java_shape: record
    implements: CTR-ANALYSIS-PIPELINE-ARTIFACT-001
    artifact_kind: DETECTOR_EVIDENCE
    contains: [detector_identity, signal_identity, score, detector_provenance]
    invariants: [INV-RISK-001]
  CTR-ANALYSIS-EVIDENCE-ENVELOPE-001:
    name: AnalysisEvidenceEnvelope
    owner: MOD-ANALYSIS-001
    contains: [customer_identity, total_activity_count, total_source_risk_count, total_detector_evidence_count, total_policy_evidence_count, selected_activities, selected_source_risk_evidence, selected_detector_evidence, selected_policy_evidence]
    constructed_by: AnalysisContextBuilder immediately before PRT-MODEL-001
    default_bounds: [max_activities_25, max_source_risk_evidence_20, max_detector_evidence_8, max_policy_evidence_3]
    selection: [source_risk_by_recency_then_stable_identity, activities_include_selected_risk_backing_then_recent, detector_by_score_then_stable_identity, policy_preserves_retrieval_rank]
    semantics: complete Stage-1 and Stage-2 inputs become exact totals plus bounded Stage-3 details; operator page limits are independent
    type_safety: retains stage-specific typed collections rather than one generic artifact list
    invariants: [INV-RISK-001, INV-RAG-001, INV-AI-001]
  CTR-ANALYSIS-MODEL-PROVENANCE-001:
    name: AnalysisModelProvenance
    owner: MOD-ANALYSIS-001
    java_shape: record
    implements: CTR-ANALYSIS-PIPELINE-ARTIFACT-001
    artifact_kind: MODEL_BACKEND_PROVENANCE
    contains: [backend_identity, model_identity, metadata]
    invariants: [INV-AI-001]
  CTR-ANALYSIS-MODEL-OUTPUT-001:
    name: AnalysisModelOutput
    owner: MOD-ANALYSIS-001
    contains: [analysis_result, model_provenance]
    invariants: [INV-AI-001]
  CTR-ANALYSIS-BACKEND-ID-001:
    name: AnalysisBackendId
    owner: MOD-ANALYSIS-001
    java_shape: enum
    values: [DETERMINISTIC, OPENAI, LOCAL]
    authoritative_property: specgraph.analysis.backend
    environment_projection: SPECGRAPH_ANALYSIS_BACKEND
    default: DETERMINISTIC
    unsupported_behavior: fail_closed_at_startup
    deferred_implementation: LOCAL owned by issue 251
  CTR-OPERATOR-ID-001:
    name: OperatorId
    owner: MOD-IDENTITY-001
    contains: [operator_identity]
    invariants: [INV-HIST-001]
  CTR-OPERATOR-CONTEXT-001:
    name: OperatorContext
    owner: MOD-IDENTITY-001
    java_shape: sealed_interface
    discriminant: concrete_record_type
    sealed_permits: [Authenticated with CTR-OPERATOR-ID-001, Unauthenticated]
    prohibited_shapes: [nullable_operator_identity, Spring_Security_principal]
    activation_ring: R4
  CTR-ANALYSIS-HISTORY-CREATE-001:
    name: AnalysisHistoryCreateCommand
    owner: MOD-ANALYSIS-001
    contains: [customer_identity, operator_identity, generated_at, result, evidence_provenance, detector_provenance, model_provenance]
    invariants: [INV-HIST-001]
  CTR-ANALYSIS-HISTORY-ENTRY-001:
    name: AnalysisHistoryEntry
    owner: MOD-ANALYSIS-001
    contains: [analysis_identity, customer_identity, operator_identity, generated_at, result, evidence_provenance, detector_provenance, model_provenance]
    invariants: [INV-HIST-001]
  CTR-ANALYSIS-HISTORY-QUERY-001:
    name: AnalysisHistoryQuery
    owner: MOD-ANALYSIS-001
    contains: [page, page_size]
    bounds: [default_page_size_20, maximum_page_size_100]
  CTR-ANALYSIS-HISTORY-PAGE-001:
    name: AnalysisHistoryPage
    owner: MOD-ANALYSIS-001
    contains: [entries, page, page_size, total_entries, navigation]
    invariants: [INV-HIST-001]

ports:
  PRT-OPERATOR-CONTEXT-001:
    name: OperatorContextPort
    owner: MOD-IDENTITY-001
    direction: outbound_boundary
    returns: CTR-OPERATOR-CONTEXT-001
    authenticated_projection: CTR-OPERATOR-ID-001
    implementation_adapters: [ADP-OPCTX-DET-001, ADP-AUTH-SPRING-001]
    activation_ring: R3
    acceptance_ring: R4
    adrs: [ADR-001, ADR-004]
  PRT-ACTIVITY-001:
    name: CustomerActivityPort
    owner: MOD-CUSTOMER-001
    direction: outbound
    returns: CTR-CUSTOMER-SNAPSHOT-001
    implementation_adapters: [ADP-ACT-SYN-001, ADP-ACT-JPA-001]
    semantics: complete snapshot for analysis-compatible consumers; not the operator pagination boundary
    activation_ring: R0
    adrs: [ADR-001, ADR-003, ADR-007]
  PRT-CUSTOMER-REVIEW-QUERY-001:
    name: CustomerReviewQueryPort
    owner: MOD-CUSTOMER-001
    direction: outbound
    accepts: CTR-CUSTOMER-REVIEW-QUERY-001
    returns: CTR-CUSTOMER-REVIEW-PAGE-001
    implementation_adapters: [ADP-ACT-SYN-001, ADP-ACT-JPA-001]
    semantics: bounded operator-facing query applied before HTTP serialization
    activation_ring: R1
    adrs: [ADR-001, ADR-003, ADR-007]
  PRT-DETECTOR-001:
    name: RiskSignalDetectorPort
    owner: MOD-ANALYSIS-001
    direction: outbound
    accepts: CTR-CUSTOMER-SNAPSHOT-001
    returns: CTR-RISK-SIGNAL-EVIDENCE-001
    implementation_adapters: [ADP-DETECTOR-NOOP-001, ADP-DETECTOR-BAYES-001, ADP-DETECTOR-FUZZY-001]
    selection_authority: specgraph.analysis.detectors
    selection_ids: [NO_OP, BAYESIAN, FUZZY]
    resolver: RiskSignalDetectorFactory
    composite: CompositeRiskSignalDetector
    selection_semantics: bounded ordered list; one ID resolves a leaf, multiple concrete IDs resolve a Composite
    compatibility_profile_aliases: [bayesian-detector, fuzzy-detector]
    failure_semantics: explicit empty, duplicate, invalid/unregistered, NO_OP mixed with concrete, or child failure fails closed
    activation_ring: R4
    adrs: [ADR-001, ADR-002]
  PRT-MODEL-001:
    name: AnalysisModelPort
    owner: MOD-ANALYSIS-001
    direction: outbound
    accepts: CTR-ANALYSIS-EVIDENCE-ENVELOPE-001
    returns: CTR-ANALYSIS-MODEL-OUTPUT-001
    semantics: receives only bounded selected details with truthful complete-input totals; supplied details alone are citable
    activation_ring: R0
    adrs: [ADR-002]
  PRT-POLICY-001:
    name: PolicyKnowledgePort
    owner: MOD-ANALYSIS-001
    direction: outbound
    returns: CTR-POLICY-EVIDENCE-001
    activation_ring: R0
    implementation_adapters: [ADP-POL-STATIC-001, ADP-POL-PGV-001]
    adrs: [ADR-002, ADR-003]
  PRT-HISTORY-001:
    name: AnalysisHistoryPort
    owner: MOD-ANALYSIS-001
    direction: outbound
    accepts: CTR-ANALYSIS-HISTORY-CREATE-001
    returns: CTR-ANALYSIS-HISTORY-ENTRY-001
    paged_query: CTR-ANALYSIS-HISTORY-QUERY-001
    paged_result: CTR-ANALYSIS-HISTORY-PAGE-001
    implementation_adapters: [ADP-HIST-JPA-001]
    semantics: persistence and complete-list compatibility plus bounded operator page queries
    activation_ring: R0
    adrs: [ADR-001, ADR-003, ADR-007]

components:
  CMP-ANALYSIS-BACKEND-FACTORY-001:
    name: AnalysisBackendFactory
    owner: MOD-ANALYSIS-001
    pattern: Factory_registry
    selects_for: PRT-MODEL-001
    selector: CTR-ANALYSIS-BACKEND-ID-001
    construction: lazy_adapter_suppliers
    publishes: one selected primary AnalysisModelPort
    failure_semantics: unknown or unavailable selection fails closed during startup
    prohibited_coupling: provider conditionals in AnalysisService
    adrs: [ADR-001, ADR-002]

adapters:
  ADP-CUST-HTTP-001:
    name: CustomerReviewHttpAdapter
    kind: inbound
    owner: MOD-CUSTOMER-001
    package: dev.specgraph.reference.customer.web
    technology: Spring MVC
    activation_ring: R1
    connects_to: [MOD-CUSTOMER-001]
    adrs: [ADR-001, ADR-004]
  ADP-ANALYSIS-HTTP-001:
    name: AnalysisHttpAdapter
    kind: inbound
    owner: MOD-ANALYSIS-001
    package: dev.specgraph.reference.analysis.web
    technology: Spring MVC
    activation_ring: R3
    requires_operator_from: PRT-OPERATOR-CONTEXT-001
    connects_to: [MOD-ANALYSIS-001, MOD-IDENTITY-001]
    adrs: [ADR-001, ADR-004]
  ADP-SESSION-HTTP-001:
    name: OperatorSessionHttpAdapter
    kind: inbound
    owner: MOD-IDENTITY-001
    package: dev.specgraph.reference.identity.web
    technology: Spring MVC
    activation_ring: R4
    profiles: [r4, r4-auth]
    exposes: [typed session bootstrap, CSRF token view]
    connects_to: [PRT-OPERATOR-CONTEXT-001]
    adrs: [ADR-001, ADR-004]
  ADP-OPCTX-DET-001:
    name: DeterministicOperatorContextAdapter
    kind: outbound_boundary
    owner: MOD-IDENTITY-001
    implements: PRT-OPERATOR-CONTEXT-001
    activation_ring: R3
    profiles: [default_non_r4]
    operator_identity: r3-demo-operator
    responsibility: preserve deterministic R3 attribution without activating authentication
    adrs: [ADR-001, ADR-004]
  ADP-AUTH-SPRING-001:
    name: SpringSecurityOperatorContextAdapter
    kind: outbound_boundary
    owner: MOD-IDENTITY-001
    package: dev.specgraph.reference.identity.security
    technology: Spring Security
    implements: PRT-OPERATOR-CONTEXT-001
    activation_ring: R4
    profiles: [r4, r4-auth]
    adapter_local_types: [Authentication, SecurityContext]
    security_configuration: [HTTP session, BCrypt demo credentials, CSRF enabled, 401 REST entry point]
    demo_operators: [operator-alpha, operator-beta]
    connects_to: [MOD-IDENTITY-001, ADP-CUST-HTTP-001, ADP-ANALYSIS-HTTP-001]
    adrs: [ADR-001, ADR-004]
  ADP-ACT-SYN-001:
    name: SyntheticActivityAdapter
    kind: outbound
    owner: MOD-CUSTOMER-001
    implements: PRT-ACTIVITY-001
    activation_ring: R0
    adrs: [ADR-001]
  ADP-ACT-JPA-001:
    name: JpaCustomerActivityAdapter
    kind: outbound
    owner: MOD-CUSTOMER-001
    package: dev.specgraph.reference.customer.persistence
    technology: Jakarta Persistence with Hibernate ORM
    implements: [PRT-ACTIVITY-001, PRT-CUSTOMER-REVIEW-QUERY-001]
    implementation_status: selected target pending issue 164
    schema_authority: Flyway
    hibernate_schema_action: validate
    exact_decimal_mappings: ["DECIMAL(18,2) to BigDecimal", "DECIMAL(5,2) to BigDecimal"]
    adapter_local_types: [JPA entities, EntityManager, Hibernate types]
    query_semantics: complete snapshot uses consistent PostgreSQL transaction; operator page filters counts orders and paginates in the database
    activation_ring: R2
    adrs: [ADR-003, ADR-004, ADR-007]
  ADP-DETECTOR-NOOP-001:
    name: NoOpRiskSignalDetectorAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-DETECTOR-001
    activation_ring: R4
    selection_id: NO_OP
    responsibility: keep the detector stage explicit and preserve the deterministic no-extra-signal baseline when no typed selection or compatibility detector profile is supplied
    adrs: [ADR-001, ADR-002]
  ADP-DETECTOR-BAYES-001:
    name: BayesianSequentialRiskSignalDetectorAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    technology: Apache Commons Math 3.6.1
    implements: PRT-DETECTOR-001
    activation_ring: R4
    selection_id: BAYESIAN
    compatibility_profile_alias: bayesian-detector
    responsibility: derive deterministic synthetic-demo Beta-binomial review-elevation probability evidence without mutating source risk
    adrs: [ADR-001, ADR-002]
  ADP-DETECTOR-FUZZY-001:
    name: FuzzyRiskSignalDetectorAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    technology: project-owned minimal fuzzy inference
    implements: PRT-DETECTOR-001
    activation_ring: R4
    selection_id: FUZZY
    compatibility_profile_alias: fuzzy-detector
    responsibility: derive deterministic graded review-elevation evidence from bounded memberships and versioned rules without mutating source risk
    adrs: [ADR-001, ADR-002]
  ADP-MODEL-DET-001:
    name: DeterministicAnalysisAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-MODEL-001
    activation_ring: R0
    acceptance_ring: R3
    selected_by: [CMP-ANALYSIS-BACKEND-FACTORY-001, DETERMINISTIC]
    semantics: derives aggregate findings from complete totals without treating selected window sizes as totals
    adrs: [ADR-002]
  ADP-MODEL-AI-001:
    name: SpringAiAnalysisAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-MODEL-001
    activation_ring: R4
    selected_by: [CMP-ANALYSIS-BACKEND-FACTORY-001, OPENAI]
    conditional_materialization: only when specgraph.analysis.backend is openai
    provider_configuration: [OPENAI_API_KEY, OPENAI_MODEL]
    semantics: serializes only bounded selected details; provider redaction and token ceilings remain adapter-local
    adrs: [ADR-002, ADR-004]
  ADP-POL-STATIC-001:
    name: StaticPolicyAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-POLICY-001
    activation_ring: R0
    acceptance_ring: R3
    adrs: [ADR-002]
  ADP-POL-PGV-001:
    name: PgVectorPolicyAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    package: dev.specgraph.reference.analysis
    technology: Spring AI PgVectorStore with local transformer embeddings
    implements: PRT-POLICY-001
    activation_ring: R4
    profile: r4
    schema_authority: Flyway
    vector_dimensions: 384
    vector_distance: cosine
    vector_index: HNSW
    document_identity: deterministic RFC-variant UUIDv8 derived by SyntheticPolicyCorpusLoader from SHA-256 of source identity, chunk index and content
    corpus_replacement: Spring-managed transaction deletes only corpus=synthetic rows and inserts the complete new snapshot atomically
    returns: CTR-POLICY-EVIDENCE-001
    adapter_local_types: [Spring AI Document, VectorStore, SearchRequest]
    adrs: [ADR-002, ADR-003]
  ADP-HIST-JPA-001:
    name: JpaAnalysisHistoryAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    package: dev.specgraph.reference.analysis.persistence
    technology: Jakarta Persistence with Hibernate ORM
    implements: PRT-HISTORY-001
    implementation_status: selected target pending issue 164
    schema_authority: Flyway
    hibernate_schema_action: validate
    adapter_local_types: [JPA entities, EntityManager, Hibernate types]
    query_semantics: validated history persistence plus descending count and bounded database pagination
    activation_ring: R3
    adrs: [ADR-003, ADR-004, ADR-007]

infrastructure:
  INF-DB-001:
    name: PostgreSqlPgVector
    activation_ring: R2
    used_by: [ADP-ACT-JPA-001, ADP-HIST-JPA-001, ADP-POL-PGV-001]
    relational_schema_authority: Flyway
    relational_orm: Hibernate validates but never creates or updates the schema
    vector_adapter_separation: ADP-POL-PGV-001 remains outside Hibernate/JPA behind PRT-POLICY-001
    r4_vector_schema: policy_vector_store managed by dedicated Flyway R4 migration
    r4_extensions: [vector, hstore, uuid-ossp]
    r4_vector_table_shape: [UUID id, text content, JSONB metadata, vector(384) embedding]
    adrs: [ADR-003, ADR-007]
  INF-COMPOSE-001:
    name: ComposeCheckpointTopology
    activation_ring: R0
    responsibility: one prebuilt Spring Boot executable-JAR shape instantiated as concentric reviewer checkpoints and isolated R4 configuration variants, with PostgreSQL/pgvector backing persistence-bearing services, distributed as a Compose OCI artifact
    runtime_boundary: Java 21 JRE with embedded Tomcat serving built React assets and Spring MVC API from one origin
    canonical_operator_entrypoint: docker compose -f oci://ghcr.io/jdoe-dev-159753/specgraph-reference-app-compose:demo up -d --wait
    source_checkout_entrypoint: docker compose -p specgraph-r4-baseline -f compose.r4.yaml up -d --build --wait
    publication_semantics: demo is last-known-good and advances only after remote-pull verification
    distribution: GHCR Compose OCI artifact with published R0-R4 checkpoint images plus PostgreSQL and pgvector resolved to exact digests
    runtime_platforms: [linux/amd64, linux/arm64]
    published_j2_services: [r0, r1, postgres, r2, r3]
    published_reviewer_services: [r0, r1, postgres, r2, r3, r4-postgres-baseline, r4, r4-postgres-bayesian, r4-bayesian]
    published_unique_runtime_images: [r0, r1, r2, r3, r4, postgres, pgvector]
    r4_runtime_variants: ["baseline profile r4 on host 8084", "Bayesian profile r4,bayesian-detector on host 8085"]
    r4_state_isolation: baseline and Bayesian use separate pgvector/PostgreSQL services while resolving the same immutable R4 application image
    source_j2_services: [r0, r1, postgres, r2, r3]
    checkpoint_ports: [R0 host 8080 to container 8080, R1 host 8081 to container 8080, R2 host 8082 to container 8080, R3 host 8083 to container 8080, R4 baseline host 8084 to container 8080, R4 Bayesian host 8085 to container 8080]
    r4_auth_verification_profile: exact-head candidate container on Docker-assigned isolated host port to container 8080 with SPRING_PROFILES_ACTIVE=r4-auth; verification-only, not a published checkpoint
    r4_backend_variants: [baseline host 8084 backend deterministic, optional external host 8087 backend openai]
    r4_variant_isolation: distinct Compose project network and PostgreSQL state per variant
    r4_variant_scripts: [r4-variant-up.sh, r4-variant-down.sh, r4-variant-manifest.sh, r4-gallery-up.sh, r4-gallery-down.sh, r4-gallery-manifest.sh]
    operating_modes: [side_by_side_default, direct_checkpoint_debug, detached_persistent]
    adrs: [ADR-004, ADR-005, ADR-006]
  CMP-UI-001:
    name: OperatorDashboard
    technology: React TypeScript MUI TanStack Query
    activation_ring: R0
    connects_to: [ADP-SESSION-HTTP-001, ADP-CUST-HTTP-001, ADP-ANALYSIS-HTTP-001]
    runtime_session_types: [LEGACY, SECURED_AUTHENTICATED, SECURED_UNAUTHENTICATED]
    r4_auth_view: login, authenticated operator identity, logout, protected customer and analysis navigation
    r4_policy_provenance_view: source identity, content, adapter, corpus, revision, source document, chunk position, embedding identity and similarity score when present
    high_volume_review: bounded activity page with sticky table header, explicit filters/navigation and bounded analysis-history pages
    adrs: [ADR-004]

requirement_design:
  FR-CUST-001:
    elements: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, PRT-CUSTOMER-REVIEW-QUERY-001, CTR-CUSTOMER-REVIEW-QUERY-001, CTR-CUSTOMER-REVIEW-PAGE-001, ADP-ACT-SYN-001, ADP-ACT-JPA-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R1
  FR-ACT-001:
    elements: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, PRT-CUSTOMER-REVIEW-QUERY-001, CTR-CUSTOMER-REVIEW-QUERY-001, CTR-CUSTOMER-REVIEW-PAGE-001, ADP-ACT-SYN-001, ADP-ACT-JPA-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R1
  FR-ACT-002:
    elements: [CMP-UI-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JPA-001, CTR-CUSTOMER-SNAPSHOT-001]
    adrs: [ADR-001, ADR-003, ADR-007]
    first_acceptance_ring: R1
  FR-RISK-001:
    elements: [CMP-UI-001, MOD-RISK-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JPA-001, CTR-CUSTOMER-SNAPSHOT-001]
    adrs: [ADR-001, ADR-003, ADR-007]
    first_acceptance_ring: R1
