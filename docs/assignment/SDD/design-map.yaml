schema_version: 1
design_id: CAA-DESIGN-001
normative_requirements: ../SRS/requirements.yaml
current_design_document: SDD.md

adrs:
  ADR-001: ../ADR/ADR-001-modular-monolith-hexagonal.md
  ADR-002: ../ADR/ADR-002-provider-neutral-analysis.md
  ADR-003: ../ADR/ADR-003-postgresql-pgvector-persistence.md
  ADR-004: ../ADR/ADR-004-baseline-web-stack.md
  ADR-005: ../ADR/ADR-005-prebuilt-demo-container-packaging.md
  ADR-006: ../ADR/ADR-006-compose-oci-multi-platform-distribution.md
  ADR-007: ../ADR/ADR-007-spring-jdbc-relational-adapters.md

modules:
  MOD-IDENTITY-001:
    name: identity
    responsibility: authenticated operator context and access boundary
    package: dev.specgraph.reference.identity
    activation_ring: R4
    adrs: [ADR-001, ADR-004]
  MOD-RISK-001:
    name: risk
    responsibility: source-derived risk evidence contracts and later risk-signal interpretation
    package: dev.specgraph.reference.risk
    activation_ring: R1
    adrs: [ADR-001]
  MOD-CUSTOMER-001:
    name: customer
    responsibility: customer lookup and activity read use cases
    package: dev.specgraph.reference.customer
    depends_on: [MOD-RISK-001]
    activation_ring: R1
    adrs: [ADR-001]
  MOD-ANALYSIS-001:
    name: analysis
    responsibility: staged analysis orchestration, detector evidence, policy grounding, model synthesis and analysis history
    package: dev.specgraph.reference.analysis
    depends_on: [MOD-CUSTOMER-001]
    activation_ring: R3
    adrs: [ADR-001, ADR-002]

contracts:
  CTR-CUSTOMER-SNAPSHOT-001:
    name: CustomerSnapshot
    owner: MOD-CUSTOMER-001
    contains: [customer_identity, activities, risk_evidence]
    uses_contracts_from: [MOD-RISK-001]
    invariants: [INV-DATA-001, INV-DATA-002, INV-RISK-001]
  CTR-ANALYSIS-RESULT-001:
    name: AnalysisResult
    owner: MOD-ANALYSIS-001
    contains: [risk_level, findings_summary, recommendations]
    invariants: [INV-AI-001]
  CTR-ANALYSIS-PIPELINE-ARTIFACT-001:
    name: AnalysisPipelineArtifact
    owner: MOD-ANALYSIS-001
    java_shape: sealed_interface
    discriminant: concrete_record_type
    derived_kind_values: [DETECTOR_EVIDENCE, POLICY_RETRIEVAL_EVIDENCE, MODEL_BACKEND_PROVENANCE]
    common_projection: [kind, artifact_identity, metadata]
    sealed_permits: [CTR-RISK-SIGNAL-EVIDENCE-001, CTR-POLICY-EVIDENCE-001, CTR-ANALYSIS-MODEL-PROVENANCE-001]
    prohibited_shapes: [generic_nullable_payload_union, provider_or_library_dto]
    invariants: [INV-RISK-001, INV-RAG-001, INV-AI-001]
  CTR-POLICY-EVIDENCE-001:
    name: PolicyEvidence
    owner: MOD-ANALYSIS-001
    java_shape: record
    implements: CTR-ANALYSIS-PIPELINE-ARTIFACT-001
    artifact_kind: POLICY_RETRIEVAL_EVIDENCE
    contains: [source_identity, content, retrieval_metadata]
    invariants: [INV-RAG-001]
  CTR-RISK-SIGNAL-EVIDENCE-001:
    name: RiskSignalEvidence
    owner: MOD-ANALYSIS-001
    java_shape: record
    implements: CTR-ANALYSIS-PIPELINE-ARTIFACT-001
    artifact_kind: DETECTOR_EVIDENCE
    contains: [detector_identity, signal_identity, score, detector_provenance]
    invariants: [INV-RISK-001]
  CTR-ANALYSIS-EVIDENCE-ENVELOPE-001:
    name: AnalysisEvidenceEnvelope
    owner: MOD-ANALYSIS-001
    contains: [customer_snapshot, detector_evidence, policy_evidence]
    type_safety: retains stage-specific typed collections rather than one generic artifact list
    invariants: [INV-RISK-001, INV-RAG-001]
  CTR-ANALYSIS-MODEL-PROVENANCE-001:
    name: AnalysisModelProvenance
    owner: MOD-ANALYSIS-001
    java_shape: record
    implements: CTR-ANALYSIS-PIPELINE-ARTIFACT-001
    artifact_kind: MODEL_BACKEND_PROVENANCE
    contains: [backend_identity, model_identity, metadata]
    invariants: [INV-AI-001]
  CTR-ANALYSIS-MODEL-OUTPUT-001:
    name: AnalysisModelOutput
    owner: MOD-ANALYSIS-001
    contains: [analysis_result, model_provenance]
    invariants: [INV-AI-001]
  CTR-OPERATOR-ID-001:
    name: OperatorId
    owner: MOD-IDENTITY-001
    contains: [operator_identity]
    invariants: [INV-HIST-001]
  CTR-ANALYSIS-HISTORY-CREATE-001:
    name: AnalysisHistoryCreateCommand
    owner: MOD-ANALYSIS-001
    contains: [customer_identity, operator_identity, generated_at, result, evidence_provenance, detector_provenance, model_provenance]
    invariants: [INV-HIST-001]
  CTR-ANALYSIS-HISTORY-ENTRY-001:
    name: AnalysisHistoryEntry
    owner: MOD-ANALYSIS-001
    contains: [analysis_identity, customer_identity, operator_identity, generated_at, result, evidence_provenance, detector_provenance, model_provenance]
    invariants: [INV-HIST-001]

ports:
  PRT-ACTIVITY-001:
    name: CustomerActivityPort
    owner: MOD-CUSTOMER-001
    direction: outbound
    returns: CTR-CUSTOMER-SNAPSHOT-001
    activation_ring: R0
    adrs: [ADR-001, ADR-003, ADR-007]
  PRT-DETECTOR-001:
    name: RiskSignalDetectorPort
    owner: MOD-ANALYSIS-001
    direction: outbound
    accepts: CTR-CUSTOMER-SNAPSHOT-001
    returns: CTR-RISK-SIGNAL-EVIDENCE-001
    activation_ring: R4
    adrs: [ADR-001, ADR-002]
  PRT-MODEL-001:
    name: AnalysisModelPort
    owner: MOD-ANALYSIS-001
    direction: outbound
    accepts: CTR-ANALYSIS-EVIDENCE-ENVELOPE-001
    returns: CTR-ANALYSIS-MODEL-OUTPUT-001
    activation_ring: R0
    adrs: [ADR-002]
  PRT-POLICY-001:
    name: PolicyKnowledgePort
    owner: MOD-ANALYSIS-001
    direction: outbound
    returns: CTR-POLICY-EVIDENCE-001
    activation_ring: R0
    implementation_adapters: [ADP-POL-STATIC-001, ADP-POL-PGV-001]
    adrs: [ADR-002, ADR-003]
  PRT-HISTORY-001:
    name: AnalysisHistoryPort
    owner: MOD-ANALYSIS-001
    direction: outbound
    accepts: CTR-ANALYSIS-HISTORY-CREATE-001
    returns: CTR-ANALYSIS-HISTORY-ENTRY-001
    activation_ring: R0
    adrs: [ADR-001, ADR-003, ADR-007]

adapters:
  ADP-CUST-HTTP-001:
    name: CustomerReviewHttpAdapter
    kind: inbound
    owner: MOD-CUSTOMER-001
    package: dev.specgraph.reference.customer.web
    technology: Spring MVC
    activation_ring: R1
    connects_to: [MOD-CUSTOMER-001]
    adrs: [ADR-001, ADR-004]
  ADP-ANALYSIS-HTTP-001:
    name: AnalysisHttpAdapter
    kind: inbound
    owner: MOD-ANALYSIS-001
    package: dev.specgraph.reference.analysis.web
    technology: Spring MVC
    activation_ring: R3
    connects_to: [MOD-ANALYSIS-001]
    adrs: [ADR-001, ADR-004]
  ADP-AUTH-SPRING-001:
    name: SpringSecurityOperatorAdapter
    kind: inbound_boundary
    owner: MOD-IDENTITY-001
    technology: Spring Security
    activation_ring: R4
    connects_to: [MOD-IDENTITY-001, ADP-CUST-HTTP-001, ADP-ANALYSIS-HTTP-001]
    adrs: [ADR-004]
  ADP-ACT-SYN-001:
    name: SyntheticActivityAdapter
    kind: outbound
    owner: MOD-CUSTOMER-001
    implements: PRT-ACTIVITY-001
    activation_ring: R0
    adrs: [ADR-001]
  ADP-ACT-JDBC-001:
    name: JdbcCustomerActivityAdapter
    kind: outbound
    owner: MOD-CUSTOMER-001
    package: dev.specgraph.reference.customer.persistence
    technology: Spring JDBC JdbcClient
    implements: PRT-ACTIVITY-001
    activation_ring: R2
    adrs: [ADR-003, ADR-004, ADR-007]
  ADP-DETECTOR-NOOP-001:
    name: NoOpRiskSignalDetectorAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-DETECTOR-001
    activation_ring: R4
    responsibility: keep the detector stage explicit while preserving the deterministic no-extra-signal baseline until a real detector adapter is deliberately selected
    adrs: [ADR-001, ADR-002]
  ADP-MODEL-DET-001:
    name: DeterministicAnalysisAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-MODEL-001
    activation_ring: R0
    acceptance_ring: R3
    adrs: [ADR-002]
  ADP-MODEL-AI-001:
    name: SpringAiAnalysisAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-MODEL-001
    activation_ring: R4
    adrs: [ADR-002, ADR-004]
  ADP-POL-STATIC-001:
    name: StaticPolicyAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    implements: PRT-POLICY-001
    activation_ring: R0
    acceptance_ring: R3
    adrs: [ADR-002]
  ADP-POL-PGV-001:
    name: PgVectorPolicyAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    package: dev.specgraph.reference.analysis
    technology: Spring AI PgVectorStore with local transformer embeddings
    implements: PRT-POLICY-001
    activation_ring: R4
    profile: r4
    schema_authority: Flyway
    vector_dimensions: 384
    vector_distance: cosine
    vector_index: HNSW
    document_identity: deterministic RFC-variant UUIDv8 derived by SyntheticPolicyCorpusLoader from SHA-256 of source identity, chunk index and content
    corpus_replacement: Spring-managed transaction deletes only corpus=synthetic rows and inserts the complete new snapshot atomically
    returns: CTR-POLICY-EVIDENCE-001
    adapter_local_types: [Spring AI Document, VectorStore, SearchRequest]
    adrs: [ADR-002, ADR-003]
  ADP-HIST-JDBC-001:
    name: JdbcAnalysisHistoryAdapter
    kind: outbound
    owner: MOD-ANALYSIS-001
    package: dev.specgraph.reference.analysis.persistence
    technology: Spring JDBC JdbcClient
    implements: PRT-HISTORY-001
    activation_ring: R3
    adrs: [ADR-003, ADR-004, ADR-007]

infrastructure:
  INF-DB-001:
    name: PostgreSqlPgVector
    activation_ring: R2
    used_by: [ADP-ACT-JDBC-001, ADP-HIST-JDBC-001, ADP-POL-PGV-001]
    r4_vector_schema: policy_vector_store managed by dedicated Flyway R4 migration
    r4_extensions: [vector, hstore, uuid-ossp]
    r4_vector_table_shape: [UUID id, text content, JSONB metadata, vector(384) embedding]
    adrs: [ADR-003, ADR-007]
  INF-COMPOSE-001:
    name: ComposeCheckpointTopology
    activation_ring: R0
    responsibility: one prebuilt Spring Boot executable-JAR shape instantiated as concentric reviewer checkpoints, with PostgreSQL backing persistence-bearing rings, and distributed as a Compose OCI artifact
    runtime_boundary: Java 21 JRE with embedded Tomcat serving built React assets and Spring MVC API from one origin
    canonical_operator_entrypoint: docker compose -f oci://ghcr.io/jdoe-dev-159753/specgraph-reference-app-compose:demo up -d --wait
    source_checkout_entrypoint: docker compose up --build -d --wait r3
    publication_semantics: demo is last-known-good and advances only after remote-pull verification
    distribution: GHCR Compose OCI artifact with published checkpoint images and PostgreSQL resolved to exact digests
    runtime_platforms: [linux/amd64, linux/arm64]
    published_j2_services: [r0, r1, postgres, r2, r3]
    source_j2_services: [r0, r1, postgres, r2, r3]
    checkpoint_ports: [R0 host 8080 to container 8080, R1 host 8081 to container 8080, R2 host 8082 to container 8080, R3 host 8083 to container 8080]
    operating_modes: [side_by_side_default, direct_checkpoint_debug, detached_persistent]
    adrs: [ADR-004, ADR-005, ADR-006]
  CMP-UI-001:
    name: OperatorDashboard
    technology: React TypeScript MUI TanStack Query
    activation_ring: R0
    connects_to: [ADP-CUST-HTTP-001, ADP-ANALYSIS-HTTP-001]
    r4_policy_provenance_view: source identity, content, adapter, corpus, revision, source document, chunk position, embedding identity and similarity score when present
    adrs: [ADR-004]

requirement_design:
  FR-CUST-001:
    elements: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R1
  FR-ACT-001:
    elements: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R1
  FR-ACT-002:
    elements: [CMP-UI-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001, CTR-CUSTOMER-SNAPSHOT-001]
    adrs: [ADR-001, ADR-003, ADR-007]
    first_acceptance_ring: R1
  FR-RISK-001:
    elements: [CMP-UI-001, MOD-RISK-001, MOD-CUSTOMER-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001, ADP-ACT-JDBC-001, CTR-CUSTOMER-SNAPSHOT-001]
    adrs: [ADR-001, ADR-003, ADR-007]
    first_acceptance_ring: R1
  FR-AI-001:
    elements: [CMP-UI-001, ADP-ANALYSIS-HTTP-001, MOD-ANALYSIS-001, PRT-DETECTOR-001, ADP-DETECTOR-NOOP-001, PRT-POLICY-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, CTR-ANALYSIS-EVIDENCE-ENVELOPE-001, PRT-MODEL-001, ADP-MODEL-DET-001, ADP-MODEL-AI-001]
    adrs: [ADR-001, ADR-002, ADR-004]
    first_acceptance_ring: R3
  FR-AI-002:
    elements: [MOD-ANALYSIS-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, PRT-DETECTOR-001, CTR-RISK-SIGNAL-EVIDENCE-001, PRT-POLICY-001, CTR-POLICY-EVIDENCE-001, CTR-ANALYSIS-EVIDENCE-ENVELOPE-001, PRT-MODEL-001, CTR-ANALYSIS-MODEL-OUTPUT-001, CTR-ANALYSIS-RESULT-001, CTR-ANALYSIS-MODEL-PROVENANCE-001, ADP-MODEL-DET-001, ADP-MODEL-AI-001]
    adrs: [ADR-002]
    first_acceptance_ring: R3
  FR-AUTH-001:
    elements: [CMP-UI-001, ADP-AUTH-SPRING-001, MOD-IDENTITY-001, CTR-OPERATOR-ID-001, ADP-CUST-HTTP-001, ADP-ANALYSIS-HTTP-001]
    adrs: [ADR-001, ADR-004]
    first_acceptance_ring: R4
  FR-RAG-001:
    elements: [CMP-UI-001, MOD-ANALYSIS-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, PRT-POLICY-001, CTR-POLICY-EVIDENCE-001, CTR-ANALYSIS-EVIDENCE-ENVELOPE-001, ADP-POL-STATIC-001, ADP-POL-PGV-001, INF-DB-001]
    adrs: [ADR-002, ADR-003, ADR-004]
    first_acceptance_ring: R4
  FR-HIST-001:
    elements: [MOD-ANALYSIS-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, PRT-HISTORY-001, ADP-HIST-JDBC-001, INF-DB-001, CTR-ANALYSIS-HISTORY-CREATE-001, CTR-ANALYSIS-HISTORY-ENTRY-001, CTR-OPERATOR-ID-001, CTR-ANALYSIS-RESULT-001, CTR-RISK-SIGNAL-EVIDENCE-001, CTR-POLICY-EVIDENCE-001, CTR-ANALYSIS-MODEL-PROVENANCE-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R3
  FR-HIST-002:
    elements: [CMP-UI-001, ADP-ANALYSIS-HTTP-001, MOD-ANALYSIS-001, PRT-HISTORY-001, ADP-HIST-JDBC-001, CTR-ANALYSIS-HISTORY-ENTRY-001]
    adrs: [ADR-001, ADR-003, ADR-004, ADR-007]
    first_acceptance_ring: R3
  NFR-REP-001:
    elements: [INF-COMPOSE-001, ADP-ACT-SYN-001, ADP-DETECTOR-NOOP-001, ADP-MODEL-DET-001, ADP-POL-STATIC-001]
    adrs: [ADR-002, ADR-004, ADR-005, ADR-006]
    first_acceptance_ring: R3
  NFR-VER-001:
    elements: [CTR-ANALYSIS-PIPELINE-ARTIFACT-001, PRT-ACTIVITY-001, PRT-DETECTOR-001, PRT-MODEL-001, PRT-POLICY-001, ADP-ACT-SYN-001, ADP-DETECTOR-NOOP-001, ADP-MODEL-DET-001, ADP-POL-STATIC-001]
    adrs: [ADR-001, ADR-002, ADR-004, ADR-007]
    first_acceptance_ring: R3
  NFR-RES-001:
    elements: [MOD-ANALYSIS-001, PRT-DETECTOR-001, PRT-POLICY-001, PRT-MODEL-001, PRT-HISTORY-001, ADP-DETECTOR-NOOP-001, ADP-POL-STATIC-001, ADP-MODEL-DET-001, ADP-HIST-JDBC-001]
    adrs: [ADR-002, ADR-003, ADR-007]
    first_acceptance_ring: R3
  NFR-SEC-001:
    elements: [ADP-AUTH-SPRING-001, MOD-IDENTITY-001, ADP-CUST-HTTP-001, ADP-ANALYSIS-HTTP-001]
    adrs: [ADR-001, ADR-004]
    first_acceptance_ring: R4
  CON-AI-002:
    elements: [MOD-ANALYSIS-001, CTR-ANALYSIS-PIPELINE-ARTIFACT-001, CTR-ANALYSIS-EVIDENCE-ENVELOPE-001, PRT-MODEL-001, ADP-MODEL-DET-001, ADP-MODEL-AI-001]
    adrs: [ADR-002, ADR-004]
    first_acceptance_ring: R3

first_vertical_slice:
  rings: [R0, R1]
  requirements: [FR-CUST-001, FR-ACT-001, FR-ACT-002, FR-RISK-001]
  acceptance: [AC-CUST-001, AC-CUST-002, AC-ACT-001, AC-ACT-002, AC-RISK-001]
  path: [CMP-UI-001, ADP-CUST-HTTP-001, MOD-CUSTOMER-001, MOD-RISK-001, PRT-ACTIVITY-001, ADP-ACT-SYN-001]
  prohibited_shortcuts:
    - bypassing CustomerActivityPort from the customer HTTP adapter
    - leaking Spring or persistence types into CustomerSnapshot
    - inventing a runtime risk-rule evaluator
    - requiring PostgreSQL or an external LLM for R1 acceptance

design_gaps:
  GAP-AUTH-001:
    source_ambiguity: AMB-AUTH-001
    needed_by_ring: R4
    question: local demo credential storage and seeding mechanism
  GAP-RAG-001:
    source_ambiguity: AMB-RAG-001
    needed_by_ring: R4
    question: chunking embedding and ranking parameters for the synthetic policy corpus
  GAP-LLM-001:
    source_ambiguity: AMB-LLM-001
    needed_by_ring: R4
    question: optional live provider and model selection