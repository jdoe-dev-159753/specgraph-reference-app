name: specgraph-demo

services:
  r0:
    image: ghcr.io/jdoe-dev-159753/specgraph-reference-app:r0
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r1:
    image: ghcr.io/jdoe-dev-159753/specgraph-reference-app:r1
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
