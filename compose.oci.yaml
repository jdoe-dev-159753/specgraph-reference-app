name: specgraph-demo

services:
  r0:
    image: ${APP_R0_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r0}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r1:
    image: ${APP_R1_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r1}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r2:
    image: ${APP_R2_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r2}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r3:
    image: ${APP_R3_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r3}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: UTC
    depends_on:
      postgres:
        condition: service_healthy
      r2:
        condition: service_healthy
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r4-postgres-baseline:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r4:
    image: ${APP_R4_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r4}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: r4
      SERVER_SERVLET_SESSION_COOKIE_NAME: SPECGRAPH_R4_BASELINE_SESSION
      SPRING_DATASOURCE_URL: jdbc:postgresql://r4-postgres-baseline:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: UTC
      SPECGRAPH_EMBEDDING_CACHE: /tmp/specgraph-embedding-model
    depends_on:
      r4-postgres-baseline:
        condition: service_healthy
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s

  r4-postgres-bayesian:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r4-bayesian:
    image: ${APP_R4_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r4}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: r4,bayesian-detector
      SERVER_SERVLET_SESSION_COOKIE_NAME: SPECGRAPH_R4_BAYESIAN_SESSION
      SPRING_DATASOURCE_URL: jdbc:postgresql://r4-postgres-bayesian:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: UTC
      SPECGRAPH_EMBEDDING_CACHE: /tmp/specgraph-embedding-model
    depends_on:
      r4-postgres-bayesian:
        condition: service_healthy
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s
