name: specgraph-demo

services:
  r0:
    image: ghcr.io/jdoe-dev-159753/specgraph-reference-app:r0
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r1:
    image: ghcr.io/jdoe-dev-159753/specgraph-reference-app:r1
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r2:
    image: ghcr.io/jdoe-dev-159753/specgraph-reference-app:r2
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: "${SPECGRAPH_SOURCE_TIME_ZONE:-UTC}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
