services:
  r0:
    image: "${APP_R0_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r0}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R0_SOURCE_ROOT:-.}"
    ports:
      - "${R0_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r1:
    image: "${APP_R1_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r1}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R1_SOURCE_ROOT:-.}"
    ports:
      - "${R1_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r2:
    image: "${APP_R2_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r2}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R2_SOURCE_ROOT:-.}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: "${SPECGRAPH_SOURCE_TIME_ZONE:-UTC}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${R2_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r3:
    image: "${APP_R3_IMAGE:-specgraph-reference-app:r3}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R3_SOURCE_ROOT:-.}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: "${SPECGRAPH_SOURCE_TIME_ZONE:-UTC}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${R3_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
