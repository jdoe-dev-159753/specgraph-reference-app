services:
  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: mvn -B spring-boot:run
    user: "${CI_HOST_UID:-0}:${CI_HOST_GID:-0}"
    environment:
      MAVEN_CONFIG: /tmp/.m2
    volumes:
      - ./backend:/workspace
    ports:
      - "8080:8080"
  frontend:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8080
    volumes:
      - ./frontend:/workspace
      - frontend-modules:/workspace/node_modules
    ports:
      - "5173:5173"
volumes:
  frontend-modules:
