services:
  r0:
    image: "${APP_R0_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r0}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R0_SOURCE_ROOT:-.}"
    ports:
      - "${R0_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r1:
    image: "${APP_R1_IMAGE:-ghcr.io/jdoe-dev-159753/specgraph-reference-app:r1}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R1_SOURCE_ROOT:-.}"
    ports:
      - "${R1_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
