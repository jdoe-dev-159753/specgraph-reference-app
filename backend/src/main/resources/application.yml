spring:
  application:
    name: specgraph-reference-app
  ai:
    model:
      chat: ${specgraph.analysis.backend:deterministic}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 20s
      max-retries: 1
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/specgraph}
    username: ${SPRING_DATASOURCE_USERNAME:specgraph}
    password: ${SPRING_DATASOURCE_PASSWORD:specgraph}
  flyway:
    enabled: true
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
specgraph:
  source-time-zone: ${SPECGRAPH_SOURCE_TIME_ZONE:UTC}
  analysis:
    backend: ${SPECGRAPH_ANALYSIS_BACKEND:deterministic}
    local:
      base-url: ${SPECGRAPH_LOCAL_BASE_URL:}
      model: ${SPECGRAPH_LOCAL_MODEL:ministral-3-8b-instruct-2512}
      api-key: ${SPECGRAPH_LOCAL_API_KEY:}
      timeout: ${SPECGRAPH_LOCAL_TIMEOUT:60s}
      budget:
        context-window-tokens: ${SPECGRAPH_LOCAL_CONTEXT_WINDOW_TOKENS:4096}
        max-output-tokens: ${SPECGRAPH_LOCAL_MAX_OUTPUT_TOKENS:512}
        transport-margin-tokens: ${SPECGRAPH_LOCAL_TRANSPORT_MARGIN_TOKENS:256}
    context:
      max-activities: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_ACTIVITIES:25}
      max-source-risk-evidence: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_SOURCE_RISK_EVIDENCE:20}
      max-detector-evidence: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_DETECTOR_EVIDENCE:8}
      max-policy-evidence: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_POLICY_EVIDENCE:3}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
