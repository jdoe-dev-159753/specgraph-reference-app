spring:
  application:
    name: specgraph-reference-app
  ai:
    model:
      chat: ${specgraph.analysis.backend:deterministic}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 20s
      max-retries: 1
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/specgraph}
    username: ${SPRING_DATASOURCE_USERNAME:specgraph}
    password: ${SPRING_DATASOURCE_PASSWORD:specgraph}
  flyway:
    enabled: true
    validate-migration-naming: true
specgraph:
  source-time-zone: ${SPECGRAPH_SOURCE_TIME_ZONE:UTC}
  analysis:
    backend: ${SPECGRAPH_ANALYSIS_BACKEND:deterministic}
    context:
      max-activities: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_ACTIVITIES:25}
      max-source-risk-evidence: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_SOURCE_RISK_EVIDENCE:20}
      max-detector-evidence: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_DETECTOR_EVIDENCE:8}
      max-policy-evidence: ${SPECGRAPH_ANALYSIS_CONTEXT_MAX_POLICY_EVIDENCE:3}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
