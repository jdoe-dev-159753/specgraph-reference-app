openapi: 3.0.3
info:
  title: Customer Activity Analytics API
  version: r4-multi-operator
  description: Reviewer-facing R4 contract for authenticated customer review and the staged evidence-to-analysis pipeline. The deterministic offline model remains the default while retrieval, detector and model provenance stay separate.
paths:
  /api/session:
    get:
      operationId: getOperatorSession
      summary: Bootstrap the current operator session and CSRF token
      responses:
        '200':
          description: Current authenticated or unauthenticated session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/session/login:
    post:
      operationId: loginOperator
      summary: Authenticate a local demonstration operator
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Authentication succeeded and the HTTP session now carries the operator identity.
        '401':
          description: Credentials are invalid; no authenticated operator context is created.
        '403':
          description: CSRF token is missing or invalid.
  /api/session/logout:
    post:
      operationId: logoutOperator
      summary: End the authenticated operator session
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session authentication was cleared.
        '401':
          description: No authenticated operator session is available.
        '403':
          description: CSRF token is missing or invalid.
  /api/customers/{customerId}:
    get:
      operationId: getCustomerSnapshot
      summary: Read one customer activity and risk snapshot
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Existing customer snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSnapshot'
        '401':
          description: R4 requires an authenticated operator session.
        '404':
          description: Customer ID is unknown; no customer is fabricated.
  /api/customers/{customerId}/analyses:
    post:
      operationId: runCustomerAnalysis
      summary: Run the configured analysis chain and persist the completed result
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Validated analysis completed and persisted with authenticated operator attribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          description: R4 requires an authenticated operator session.
        '403':
          description: CSRF token is missing or invalid.
        '404':
          description: Customer ID is unknown.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalysisProblem'
        '422':
          description: Relevant policy grounding is unavailable; no completed analysis is created.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalysisProblem'
        '502':
          description: Detector, grounding, model execution, or structured-result validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalysisProblem'
        '503':
          description: A completed result could not be persisted and is not represented as retained.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AnalysisProblem'
    get:
      operationId: listCustomerAnalyses
      summary: List persisted prior analyses for one customer
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Persisted analysis history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Analysis'
        '401':
          description: R4 requires an authenticated operator session.
  /api/customers/{customerId}/analyses/{analysisId}:
    get:
      operationId: getCustomerAnalysis
      summary: Inspect one persisted analysis
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          description: R4 requires an authenticated operator session.
        '404':
          description: No matching persisted analysis exists for this customer.
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Spring Security HTTP session used by the R4 application boundary.
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token obtained from GET /api/session and required for R4 state-changing requests.
      schema:
        type: string
        minLength: 1
  schemas:
    CsrfView:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
          enum: [X-CSRF-TOKEN]
        parameterName:
          type: string
        token:
          type: string
          minLength: 1
    SessionResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthenticatedSession'
        - $ref: '#/components/schemas/UnauthenticatedSession'
      discriminator:
        propertyName: state
        mapping:
          AUTHENTICATED: '#/components/schemas/AuthenticatedSession'
          UNAUTHENTICATED: '#/components/schemas/UnauthenticatedSession'
    AuthenticatedSession:
      type: object
      required: [state, operatorId, csrf]
      properties:
        state:
          type: string
          enum: [AUTHENTICATED]
        operatorId:
          type: string
          minLength: 1
        csrf:
          $ref: '#/components/schemas/CsrfView'
    UnauthenticatedSession:
      type: object
      required: [state, csrf]
      properties:
        state:
          type: string
          enum: [UNAUTHENTICATED]
        csrf:
          $ref: '#/components/schemas/CsrfView'
    CustomerSnapshot:
      type: object
      required: [customerId, activities, riskEvidence]
      properties:
        customerId:
          type: string
          format: uuid
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        riskEvidence:
          type: array
          items:
            $ref: '#/components/schemas/RiskEvidence'
    Activity:
      oneOf:
        - $ref: '#/components/schemas/CardActivity'
        - $ref: '#/components/schemas/PaymentActivity'
        - $ref: '#/components/schemas/CryptoActivity'
      discriminator:
        propertyName: type
        mapping:
          CARD: '#/components/schemas/CardActivity'
          PAYMENT: '#/components/schemas/PaymentActivity'
          CRYPTO: '#/components/schemas/CryptoActivity'
    ActivityBase:
      type: object
      required: [transactionId, amount, currency, status, createdAt]
      properties:
        transactionId:
          type: string
          format: uuid
        amount:
          type: string
          pattern: '^-?\d+(?:\.\d+)?$'
          example: '248.50'
          description: Exact decimal monetary or asset amount serialized without binary floating-point loss. Currency/asset unit is carried separately.
        currency:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    CardActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          required: [type, details]
          properties:
            type:
              type: string
              enum: [CARD]
            details:
              $ref: '#/components/schemas/CardDetails'
    PaymentActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          required: [type, details]
          properties:
            type:
              type: string
              enum: [PAYMENT]
            details:
              $ref: '#/components/schemas/PaymentDetails'
    CryptoActivity:
      allOf:
        - $ref: '#/components/schemas/ActivityBase'
        - type: object
          required: [type, details]
          properties:
            type:
              type: string
              enum: [CRYPTO]
            details:
              $ref: '#/components/schemas/CryptoDetails'
    CardDetails:
      type: object
      additionalProperties: false
      required: [cardPan, cardType, merchantName, mccCode, cardPresent, authorizationCode]
      properties:
        cardPan: { type: string }
        cardType: { type: string }
        merchantName: { type: string }
        mccCode: { type: string }
        cardPresent: { type: boolean }
        authorizationCode: { type: string }
        declineReason: { type: string, nullable: true }
    PaymentDetails:
      type: object
      additionalProperties: false
      required: [paymentMethod, senderAccount, receiverAccount, receiverBankCountry]
      properties:
        paymentMethod: { type: string }
        senderAccount: { type: string }
        receiverAccount: { type: string }
        receiverBankCountry: { type: string }
    CryptoDetails:
      type: object
      additionalProperties: false
      required: [blockchain, walletAddressFrom, walletAddressTo, txHash]
      properties:
        blockchain: { type: string }
        walletAddressFrom: { type: string }
        walletAddressTo: { type: string }
        txHash: { type: string }
        exchangeName: { type: string, nullable: true }
    RiskEvidence:
      type: object
      required: [assessmentId, transactionId, ruleId, ruleName, triggeredAt, scoreContribution]
      properties:
        assessmentId:
          type: string
          format: uuid
          description: Stable identity of the persisted source risk assessment.
        transactionId:
          type: string
          format: uuid
        ruleId:
          type: string
        ruleName:
          type: string
        triggeredAt:
          type: string
          format: date-time
        scoreContribution:
          type: number
    PolicyEvidence:
      type: object
      required: [sourceIdentity, content, retrievalMetadata]
      properties:
        sourceIdentity:
          type: string
        content:
          type: string
        retrievalMetadata:
          type: object
          additionalProperties:
            type: string
    RiskSignalEvidence:
      type: object
      required: [detectorIdentity, signalIdentity, score, provenance]
      description: Derived detector evidence; never a source risk fact.
      properties:
        detectorIdentity:
          type: string
        signalIdentity:
          type: string
        score:
          type: number
        provenance:
          type: object
          additionalProperties:
            type: string
    AnalysisModelProvenance:
      type: object
      required: [backendIdentity, modelIdentity, metadata]
      properties:
        backendIdentity:
          type: string
        modelIdentity:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    Analysis:
      type: object
      required: [analysisId, customerId, operatorId, generatedAt, riskLevel, findingsSummary, recommendations, evidenceProvenance, detectorProvenance, modelProvenance]
      properties:
        analysisId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        operatorId:
          type: string
        generatedAt:
          type: string
          format: date-time
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        findingsSummary:
          type: string
          minLength: 1
        recommendations:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        evidenceProvenance:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PolicyEvidence'
        detectorProvenance:
          type: array
          items:
            $ref: '#/components/schemas/RiskSignalEvidence'
        modelProvenance:
          $ref: '#/components/schemas/AnalysisModelProvenance'
    AnalysisProblem:
      type: object
      required: [status, title, detail, reason]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        reason:
          type: string
          enum: [CUSTOMER_NOT_FOUND, DETECTOR_FAILURE, INSUFFICIENT_GROUNDING, GROUNDING_FAILURE, MODEL_FAILURE, INVALID_RESULT, PERSISTENCE_FAILURE]
