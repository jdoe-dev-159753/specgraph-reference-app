# CI overlay reuses only the content-addressed embedding cache created under an external host lock.
services:
  r4:
    volumes:
      - r4-embedding-cache:/tmp/specgraph-embedding-model

volumes:
  r4-embedding-cache:
    external: true
    name: "${R4_EMBEDDING_CACHE_VOLUME:?R4_EMBEDDING_CACHE_VOLUME must name the prepared embedding cache volume}"
