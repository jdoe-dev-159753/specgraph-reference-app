name: demo-images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
      - 'e2e/**'
      - 'scripts/**'
      - '.github/workflows/demo-images.yml'
  workflow_dispatch:

concurrency:
  group: demo-images-publication
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      APP_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app
      COMPOSE_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app-compose
      R0_PORT: '8080'
      R1_PORT: '8081'
      R2_PORT: '8082'
      R3_PORT: '8083'
      R4_PORT: '8084'
      R4_BAYESIAN_PORT: '8085'

    steps:
      - name: Reclaim stale publication state
        run: |
          echo 'Disk before publication cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

          docker ps -aq --filter 'name=specgraph-prepublish-' | xargs -r docker rm -f || true
          docker ps -aq --filter 'name=specgraph-remote-proof-' | xargs -r docker rm -f || true
          docker network ls --format '{{.Name}}' | grep -E '^specgraph-(prepublish|remote-proof)-' | xargs -r docker network rm || true
          docker buildx ls --format '{{.Name}}' 2>/dev/null | grep '^specgraph-multiarch-' | xargs -r -n1 docker buildx rm || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true
          docker buildx prune -af || true
          docker builder prune -af || true
          docker container prune -f || true
          docker network prune -f || true
          docker image prune -af || true

          echo 'Disk after publication cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

      - name: Checkout packaging authority
        uses: actions/checkout@v7
        with:
          path: packaging
          persist-credentials: false

      - name: Checkout R0 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r0
          path: packaging/checkpoints/r0
          persist-credentials: false

      - name: Checkout R1 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r1
          path: packaging/checkpoints/r1
          persist-credentials: false

      - name: Checkout R2 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r2
          path: packaging/checkpoints/r2
          persist-credentials: false

      - name: Checkout R3 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r3
          path: packaging/checkpoints/r3
          persist-credentials: false

      - name: Checkout R4 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r4
          path: packaging/checkpoints/r4
          persist-credentials: false

      - name: Confirm OCI-capable Docker tooling
        working-directory: packaging
        run: |
          docker version
          docker buildx version
          docker compose version
          docker compose -f compose.oci.yaml config --quiet

      - name: Resolve checkpoint identities
        working-directory: packaging
        run: |
          r0_sha="$(git -C checkpoints/r0 rev-parse HEAD)"
          r1_sha="$(git -C checkpoints/r1 rev-parse HEAD)"
          r2_sha="$(git -C checkpoints/r2 rev-parse HEAD)"
          r3_sha="$(git -C checkpoints/r3 rev-parse HEAD)"
          r4_sha="$(git -C checkpoints/r4 rev-parse HEAD)"
          packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          compose_packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-9)"

          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring}_sha\"")"
            ring_short="$(printf '%s' "$ring_sha" | cut -c1-12)"
            echo "${ring_upper}_SHA=$ring_sha" >> "$GITHUB_ENV"
            echo "${ring_upper}_IMMUTABLE=${ring}-${ring_short}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          done

          echo "COMPOSE_IDENTITY_PREFIX=demo-pkg-${compose_packaging_short}" >> "$GITHUB_ENV"
          echo "BUILDER_NAME=specgraph-multiarch-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build native checkpoint images for pre-publication verification
        working-directory: packaging
        run: |
          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring_upper}_SHA\"")"
            docker build -f docker/app.Dockerfile \
              --build-arg "SOURCE_ROOT=checkpoints/$ring" \
              --label "org.opencontainers.image.revision=$ring_sha" \
              --label "dev.specgraph.checkpoint.revision=$ring_sha" \
              --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
              -t "specgraph-reference-app:$ring" .
          done

      - name: Verify R0 through R4 side by side before publication
        working-directory: packaging
        env:
          APP_R0_IMAGE: specgraph-reference-app:r0
          APP_R1_IMAGE: specgraph-reference-app:r1
          APP_R2_IMAGE: specgraph-reference-app:r2
          APP_R3_IMAGE: specgraph-reference-app:r3
          APP_R4_IMAGE: specgraph-reference-app:r4
          COMPOSE_PROJECT_NAME: specgraph-prepublish-${{ github.run_id }}
        run: |
          docker pull postgres:17-alpine
          docker pull pgvector/pgvector:0.8.6-pg17
          docker compose -f compose.oci.yaml up -d --no-build --pull never \
            r0 r1 postgres r2 r3 \
            r4-postgres-baseline r4 r4-postgres-bayesian r4-bayesian

          for service in r0 r1 r2 r3 r4 r4-bayesian; do
            container_id="$(docker compose -f compose.oci.yaml ps -q "$service")"
            for attempt in $(seq 1 150); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || true)"
              [ "$health" = healthy ] && break
              if [ "$attempt" -eq 150 ]; then
                docker compose -f compose.oci.yaml ps
                docker compose -f compose.oci.yaml logs --no-color
                exit 1
              fi
              sleep 2
            done
          done

          for port in 8080 8081 8082 8083 8084 8085; do
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r1-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8082 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r2-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8083 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r3-analysis-history.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8084 \
            -e EVIDENCE_NAME=r4-baseline \
            -e EXPECT_DETECTOR=none \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8085 \
            -e EVIDENCE_NAME=r4-bayesian \
            -e EXPECT_DETECTOR=beta-binomial-review-elevation-v1 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

          docker compose -f compose.oci.yaml down -v --remove-orphans

      - name: Reclaim native pre-publication images
        run: |
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true
          docker builder prune -af || true
          df -h "$GITHUB_WORKSPACE" || true

      - name: Require publication headroom before registry mutation
        run: |
          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          minimum_kb=$((8 * 1024 * 1024))
          echo "Publication headroom after native-image reclamation: $((available_kb / 1024)) MiB"
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "Need at least 8 GiB free before the first registry mutation; only $((available_kb / 1024)) MiB is available." >&2
            exit 1
          fi

      - name: Require publication headroom before registry mutation
        run: |
          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          minimum_kb=$((8 * 1024 * 1024))
          echo "Publication headroom after native-image reclamation: $((available_kb / 1024)) MiB"
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "Need at least 8 GiB free before the first registry mutation; only $((available_kb / 1024)) MiB is available." >&2
            exit 1
          fi

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create Buildx multi-platform builder
        run: |
          docker buildx create --name "$BUILDER_NAME" --driver docker-container --use
          docker buildx inspect "$BUILDER_NAME" --bootstrap

      - name: Publish amd64 and arm64 checkpoint images
        working-directory: packaging
        run: |
          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring_upper}_SHA\"")"
            ring_immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            docker buildx build --builder "$BUILDER_NAME" \
              --platform linux/amd64,linux/arm64 \
              -f docker/app.Dockerfile \
              --build-arg "SOURCE_ROOT=checkpoints/$ring" \
              --label "org.opencontainers.image.revision=$ring_sha" \
              --label "dev.specgraph.checkpoint.revision=$ring_sha" \
              --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
              -t "$APP_PACKAGE:$ring" \
              -t "$APP_PACKAGE:$ring_immutable" \
              --push .
          done
          docker buildx prune -af --builder "$BUILDER_NAME" || true

      - name: Verify published manifests and pin runtime databases
        run: |
          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            inspect="$(docker buildx imagetools inspect "$APP_PACKAGE:$ring_immutable")"
            printf '%s\n' "$inspect"
            printf '%s\n' "$inspect" | grep -E 'Platform:[[:space:]]+linux/amd64'
            printf '%s\n' "$inspect" | grep -E 'Platform:[[:space:]]+linux/arm64'
            digest="$(printf '%s\n' "$inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            echo "${ring_upper}_DIGEST=$digest" >> "$GITHUB_ENV"
          done

          postgres_inspect="$(docker buildx imagetools inspect postgres:17-alpine)"
          postgres_digest="$(printf '%s\n' "$postgres_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          printf '%s\n' "$postgres_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "POSTGRES_DIGEST=$postgres_digest" >> "$GITHUB_ENV"

          pgvector_inspect="$(docker buildx imagetools inspect pgvector/pgvector:0.8.6-pg17)"
          pgvector_digest="$(printf '%s\n' "$pgvector_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          printf '%s\n' "$pgvector_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "PGVECTOR_DIGEST=$pgvector_digest" >> "$GITHUB_ENV"

      - name: Bind retained Compose identity to complete unique image set
        run: |
          image_set_hex="$(printf '%s\n' \
            "$R0_DIGEST" "$R1_DIGEST" "$R2_DIGEST" "$R3_DIGEST" "$R4_DIGEST" \
            "$POSTGRES_DIGEST" "$PGVECTOR_DIGEST" | sha256sum | awk '{print $1}')"
          compose_immutable="${COMPOSE_IDENTITY_PREFIX}-set-${image_set_hex}"
          test "${#compose_immutable}" -le 128
          echo "COMPOSE_IMMUTABLE=$compose_immutable" >> "$GITHUB_ENV"

      - name: Publish immutable runtime Compose candidate
        working-directory: packaging
        run: |
          export APP_R0_IMAGE="$APP_PACKAGE:$R0_IMMUTABLE"
          export APP_R1_IMAGE="$APP_PACKAGE:$R1_IMMUTABLE"
          export APP_R2_IMAGE="$APP_PACKAGE:$R2_IMMUTABLE"
          export APP_R3_IMAGE="$APP_PACKAGE:$R3_IMMUTABLE"
          export APP_R4_IMAGE="$APP_PACKAGE:$R4_IMMUTABLE"
          export POSTGRES_IMAGE="postgres:17-alpine@$POSTGRES_DIGEST"
          export PGVECTOR_IMAGE="pgvector/pgvector:0.8.6-pg17@$PGVECTOR_DIGEST"

          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"

      - name: Assert immutable Compose provenance resolves complete image set
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          rendered="$(docker compose -f "$compose_ref" config)"
          printf '%s\n' "$rendered"
          for expected in "$R0_DIGEST" "$R1_DIGEST" "$R2_DIGEST" "$R3_DIGEST" "$R4_DIGEST" "$POSTGRES_DIGEST" "$PGVECTOR_DIGEST"; do
            printf '%s\n' "$rendered" | grep -Fq "$expected"
          done

      - name: Prove immutable Compose artifact from registry
        env:
          COMPOSE_PROJECT_NAME: specgraph-remote-proof-${{ github.run_id }}
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          docker compose -f "$compose_ref" pull
          docker compose -f "$compose_ref" up -d --wait
          for port in 8080 8081 8082 8083 8084 8085; do
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done
          docker compose -f "$compose_ref" down -v --remove-orphans

      - name: Promote last-known-good Compose tag
        run: |
          docker buildx imagetools create \
            -t "$COMPOSE_PACKAGE:demo" \
            "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"

      - name: Verify promoted last-known-good tag
        run: |
          rendered="$(docker compose -f "oci://$COMPOSE_PACKAGE:demo" config)"
          for expected in "$R0_DIGEST" "$R1_DIGEST" "$R2_DIGEST" "$R3_DIGEST" "$R4_DIGEST" "$POSTGRES_DIGEST" "$PGVECTOR_DIGEST"; do
            printf '%s\n' "$rendered" | grep -Fq "$expected"
          done

      - name: Reclaim publication resources
        if: always()
        run: |
          docker ps -aq --filter 'name=specgraph-prepublish-' | xargs -r docker rm -f || true
          docker ps -aq --filter 'name=specgraph-remote-proof-' | xargs -r docker rm -f || true
          docker buildx rm "$BUILDER_NAME" 2>/dev/null || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true
          docker buildx prune -af || true
          docker builder prune -af || true
          docker logout ghcr.io || true
          df -h "$GITHUB_WORKSPACE" || true
