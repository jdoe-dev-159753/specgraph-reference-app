services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r4:
    image: "${APP_R4_IMAGE:-specgraph-reference-app:r4}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R4_SOURCE_ROOT:-.}"
    environment:
      # Transitional ring/demo composition until #163 replaces profile strings
      # with the typed process-level backend/detector selection contract.
      SPRING_PROFILES_ACTIVE: "${R4_PROFILES:-r4}"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      SPECGRAPH_SOURCE_TIME_ZONE: "${SPECGRAPH_SOURCE_TIME_ZONE:-UTC}"
      SPECGRAPH_EMBEDDING_CACHE: /tmp/specgraph-embedding-model
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${R4_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s
