# R4 topology keeps PostgreSQL/pgvector, the authenticated app, and backend selection behind one shell.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: specgraph
      POSTGRES_USER: specgraph
      POSTGRES_PASSWORD: specgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specgraph -d specgraph"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  r4:
    image: "${APP_R4_IMAGE:-specgraph-reference-app:r4}"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        SOURCE_ROOT: "${R4_SOURCE_ROOT:-.}"
    environment:
      # Detector selection remains profile-based in this stack. Stage-3 selection is
      # independently owned by the typed SPECGRAPH_ANALYSIS_BACKEND dimension.
      SPRING_PROFILES_ACTIVE: "${R4_PROFILES:-r4}"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/specgraph
      SPRING_DATASOURCE_USERNAME: specgraph
      SPRING_DATASOURCE_PASSWORD: specgraph
      # The variant launcher supplies a project-derived name so concurrently
      # published R4 variants never share the browser's default JSESSIONID.
      SERVER_SERVLET_SESSION_COOKIE_NAME: "${R4_SESSION_COOKIE_NAME:-specgraph-r4-default_session}"
      SPECGRAPH_SOURCE_TIME_ZONE: "${SPECGRAPH_SOURCE_TIME_ZONE:-UTC}"
      SPECGRAPH_ANALYSIS_BACKEND: "${SPECGRAPH_ANALYSIS_BACKEND:-deterministic}"
      SPECGRAPH_LOCAL_BASE_URL: "${SPECGRAPH_LOCAL_BASE_URL:-}"
      SPECGRAPH_LOCAL_MODEL: "${SPECGRAPH_LOCAL_MODEL:-ministral-3-8b-instruct-2512}"
      # Deliberately separate from the public launcher input so an ambient local
      # token cannot enter deterministic or OpenAI containers through raw Compose.
      SPECGRAPH_LOCAL_API_KEY: "${SPECGRAPH_PROJECTED_LOCAL_API_KEY:-}"
      SPECGRAPH_LOCAL_TIMEOUT: "${SPECGRAPH_LOCAL_TIMEOUT:-60s}"
      SPECGRAPH_LOCAL_CONTEXT_WINDOW_TOKENS: "${SPECGRAPH_LOCAL_CONTEXT_WINDOW_TOKENS:-4096}"
      SPECGRAPH_LOCAL_MAX_OUTPUT_TOKENS: "${SPECGRAPH_LOCAL_MAX_OUTPUT_TOKENS:-512}"
      SPECGRAPH_LOCAL_TRANSPORT_MARGIN_TOKENS: "${SPECGRAPH_LOCAL_TRANSPORT_MARGIN_TOKENS:-256}"
      SPECGRAPH_EMBEDDING_CACHE: /tmp/specgraph-embedding-model
      # Deliberately separate from the provider's conventional variable so an
      # ambient shell credential cannot enter a raw deterministic Compose run.
      OPENAI_API_KEY: "${SPECGRAPH_OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-mini}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${R4_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s
