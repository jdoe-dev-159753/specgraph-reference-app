name: codex-review-fan-in-tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'scripts/codex_review_fan_in.py'
      - 'scripts/test_codex_review_fan_in.py'
      - '.github/workflows/codex-review-fan-in.yml'
      - '.github/workflows/codex-review-fan-in-tests.yml'

permissions:
  contents: read

concurrency:
  group: codex-review-fan-in-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fan-in-tests:
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: .fan-in-tests
          persist-credentials: false
      - name: Assert exact tested source revision
        working-directory: .fan-in-tests
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify review fan-in semantics
        working-directory: .fan-in-tests
        run: python3 -m unittest scripts/test_codex_review_fan_in.py
