name: temp-render-srs-usecases

on:
  pull_request:
    paths:
      - '.github/workflows/temp-render-srs-usecases.yml'
      - 'docs/assignment/SRS/diagrams/*.puml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render SRS use-case views
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/SRS/diagrams/srs-customer-review-use-cases.puml \
                  docs/assignment/SRS/diagrams/srs-analysis-use-cases.puml \
                  docs/assignment/SRS/diagrams/srs-non-functional-use-cases.puml
      - name: Commit rendered SVGs
        run: |
          git add docs/assignment/SRS/diagrams/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: rerender boundary-level SRS constraints'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
