name: render-r2-diagrams-once

on:
  push:
    branches:
      - feat/r2-postgresql-persistence
    paths:
      - '.github/workflows/render-r2-diagrams-once.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/r2-postgresql-persistence
          fetch-depth: 0

      - name: Render changed controlled PlantUML views
        run: |
          diagrams="$GITHUB_WORKSPACE/docs/assignment/SDD/diagrams"
          docker run --rm -v "$diagrams:/data" plantuml/plantuml:1.2025.4 -tsvg \
            /data/activity-customer-review.puml \
            /data/component-topology.puml \
            /data/hexagonal-architecture.puml \
            /data/package-modules.puml \
            /data/sequence-analysis-adapters.puml \
            /data/sequence-analysis-history.puml \
            /data/sequence-customer-review.puml \
            /data/source-contract-mapping.puml

      - name: Commit rendered SVGs to the reviewed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assignment/SDD/diagrams/*.svg
          if git diff --cached --quiet; then
            echo "No rendered SVG changes"
            exit 0
          fi
          git commit -m "docs: regenerate R2 PlantUML views"
          git push origin HEAD:feat/r2-postgresql-persistence
