name: temp-render-functional-usecase

on:
  pull_request:
    paths:
      - 'docs/assignment/Inception/diagrams/inception-functional-use-cases.puml'
      - '.github/workflows/temp-render-functional-usecase.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Render authoritative PlantUML source
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/Inception/diagrams/inception-functional-use-cases.puml
      - name: Emit rendered SVG for branch update
        run: |
          echo 'SVG_BASE64_BEGIN'
          base64 -w0 docs/assignment/Inception/diagrams/inception-functional-use-cases.svg
          echo
          echo 'SVG_BASE64_END'
