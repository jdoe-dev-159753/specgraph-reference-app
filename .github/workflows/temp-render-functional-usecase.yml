name: temp-render-functional-usecase

on:
  pull_request:
    paths:
      - 'docs/assignment/Inception/diagrams/inception-functional-use-cases.puml'
      - '.github/workflows/temp-render-functional-usecase.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render authoritative PlantUML source
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/Inception/diagrams/inception-functional-use-cases.puml
      - name: Commit rendered SVG
        run: |
          if git diff --quiet -- docs/assignment/Inception/diagrams/inception-functional-use-cases.svg; then
            echo 'Rendered SVG is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assignment/Inception/diagrams/inception-functional-use-cases.svg
          git commit -m 'docs: render factored functional use-case view'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
