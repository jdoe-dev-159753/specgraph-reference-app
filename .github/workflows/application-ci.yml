name: application-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker/**'
      - 'scripts/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
      - '.dockerignore'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker/**'
      - 'scripts/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
      - '.dockerignore'
      - '.github/workflows/application-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      COMPOSE_PROJECT_NAME: specgraph-ci-${{ github.run_id }}
      R2_PORT: '8082'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clean container-owned outputs from previous runs
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results'
      - name: Recover malformed persistent workspace
        run: |
          if ! git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            echo "Restoring Git identity in persistent workspace: $GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" init
            git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Verify backend against Testcontainers PostgreSQL
        run: >-
          docker run --rm
          --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -e MAVEN_CONFIG=/tmp/.m2
          -v "$PWD/backend:/workspace"
          -w /workspace
          maven:3.9-eclipse-temurin-21
          mvn -B -q verify

      - name: Report backend test failures
        if: failure()
        run: |
          if [ -d backend/target/surefire-reports ]; then
            find backend/target/surefire-reports -maxdepth 1 -type f -name '*.txt' -print -exec cat {} \;
          else
            echo 'No Surefire report directory was produced.'
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build exact-head R2 application image
        run: |
          app_image="specgraph-reference-app:ci-${SOURCE_SHA}"
          docker build -f docker/app.Dockerfile --build-arg SOURCE_ROOT=. -t "$app_image" .
          echo "APP_R2_IMAGE=$app_image" >> "$GITHUB_ENV"

      - name: Validate source and published-checkpoint deployment topologies
        run: |
          docker compose config --quiet
          docker compose -f compose.oci.yaml config --quiet

      - name: Start exact-head R2 topology
        run: docker compose up -d --no-build r2

      - name: Wait for packaged R2 application health
        run: |
          app_id="$(docker compose ps -q r2)"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              echo "Packaged R2 application healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color r2 postgres
          exit 1

      - name: Verify Spring Boot serves the built React UI
        run: |
          curl -fsS http://127.0.0.1:8082/ | grep -F '<div id="root"></div>'
          curl -fsS http://127.0.0.1:8082/actuator/health | grep -F '"status":"UP"'

      - name: VFY-CUSTOMER-READ-001 — Verify deployed R2 with Playwright
        run: |
          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8082 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test'

      - name: Capture deployment evidence
        if: always()
        run: |
          mkdir -p e2e/test-results
          docker compose ps > e2e/test-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color r2 postgres > e2e/test-results/compose.log 2>&1 || true

      - name: Upload executable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-postgresql-executable-evidence-${{ env.SOURCE_SHA }}
          path: |
            backend/target/surefire-reports
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Stop deployment
        if: always()
        run: docker compose down --remove-orphans
