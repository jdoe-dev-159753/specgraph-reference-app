name: application-ci

on:
  workflow_dispatch:
    inputs:
      compatibility:
        description: 'Run the archived R1/R2/R3 compatibility proof instead of fast verification'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
      - 'compose.r4.yaml'
      - 'scripts/r4-*.sh'
      - 'scripts/test-r4-gallery.sh'
      - 'scripts/analyze_dataset_ceiling.py'
      - 'scripts/test_analyze_dataset_ceiling.py'
      - 'scripts/validate_design_map.py'
      - 'scripts/validate_verification_markers.py'
      - 'scripts/test_validate_verification_markers.py'
      - 'docs/analysis/dataset-ceiling.md'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
      - 'compose.r4.yaml'
      - 'scripts/r4-*.sh'
      - 'scripts/test-r4-gallery.sh'
      - 'scripts/analyze_dataset_ceiling.py'
      - 'scripts/test_analyze_dataset_ceiling.py'
      - 'scripts/validate_design_map.py'
      - 'scripts/validate_verification_markers.py'
      - 'scripts/test_validate_verification_markers.py'
      - 'docs/analysis/dataset-ceiling.md'
      - '.github/workflows/application-ci.yml'

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.compatibility != true }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints /workspace/generated-diagrams'

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Ratchet normative SRS to design-map coverage
        run: python3 scripts/validate_design_map.py

      - name: Verify executable V&V marker inventory
        run: |
          python3 -B -m unittest scripts/test_validate_verification_markers.py
          python3 -B scripts/validate_verification_markers.py

      - name: Verify synthetic dataset ceiling report
        run: |
          python3 -B -m unittest scripts/test_analyze_dataset_ceiling.py
          python3 -B scripts/analyze_dataset_ceiling.py --check

      - name: Verify backend against Testcontainers PostgreSQL
        run: >-
          docker run --rm
          --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/backend:/workspace"
          -w /workspace
          maven:3.9-eclipse-temurin-21
          mvn -B -q verify

      - name: Report backend test failures
        if: failure()
        run: |
          if [ -d backend/target/surefire-reports ]; then
            find backend/target/surefire-reports -maxdepth 1 -type f -name '*.txt' -print -exec cat {} \;
          else
            echo 'No Surefire report directory was produced.'
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm run build

      - name: Validate deployment topology syntax without starting runtime
        run: |
          docker compose config --quiet
          docker compose -f compose.oci.yaml config --quiet
          docker compose -f compose.r4.yaml config --quiet
          if OPENAI_API_KEY=must-not-enter-deterministic-r4 \
              docker compose -f compose.r4.yaml config | grep -Fq must-not-enter-deterministic-r4; then
            echo 'Raw deterministic R4 Compose configuration leaked the ambient OpenAI credential.' >&2
            exit 1
          fi

      - name: VFY-CONFIDENTIALITY-001 + VFY-FAILURE-PATHS-001 - Verify R4 gallery lifecycle scripts
        run: bash scripts/test-r4-gallery.sh

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compatibility == true }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      COMPOSE_PROJECT_NAME: specgraph-ci-${{ github.run_id }}
      R1_PORT: '8081'
      R2_PORT: '8082'
      R3_PORT: '8083'
      SOURCE_SHA: ${{ github.sha }}
      R1_CHECKPOINT_SHA: e2a41694290ef8b03e4485ca1a2fe2c5664d1941
      R2_CHECKPOINT_SHA: 587027b7c80339998ab49e879afefcc692e6d052
    steps:
      - name: Reclaim stale runtime state while preserving hot Docker caches
        run: |
          echo 'Disk before cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

          docker ps -aq --filter 'name=specgraph-ci-' | xargs -r docker rm -f || true
          docker network ls --format '{{.Name}}' | grep '^specgraph-ci-' | xargs -r docker network rm || true
          docker container prune -f --filter 'until=24h' || true
          docker network prune -f --filter 'until=24h' || true
          docker image prune -f --filter 'until=24h' || true

          docker image prune -af \
            --filter 'until=168h' \
            --filter 'label=io.specgraph.source-root' || true
          docker builder prune -f --filter 'until=168h' || true

          echo 'Disk after cache-preserving cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          minimum_kb=$((8 * 1024 * 1024))
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "Runner is below 8 GiB; reclaiming repository-owned images/cache older than 24h before failing." >&2
            docker image prune -af \
              --filter 'until=24h' \
              --filter 'label=io.specgraph.source-root' || true
            docker builder prune -f --filter 'until=24h' || true
            available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          fi
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "Need at least 8 GiB free for concentric Docker verification; only $((available_kb / 1024)) MiB is available." >&2
            exit 1
          fi

      - name: Clean container-owned outputs from previous runs
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints'

      - name: Recover malformed persistent workspace
        run: |
          if ! git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            echo "Restoring Git identity in persistent workspace: $GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" init
            git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Ratchet normative SRS to design-map coverage
        run: python3 scripts/validate_design_map.py

      - name: Checkout immutable R2 checkpoint for compatibility evidence
        uses: actions/checkout@v7
        with:
          ref: ${{ env.R2_CHECKPOINT_SHA }}
          path: .checkpoints/r2
          persist-credentials: false

      - name: Assert exact R2 checkpoint revision
        working-directory: .checkpoints/r2
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected R2 checkpoint SHA: $R2_CHECKPOINT_SHA"
          echo "Checked-out R2 SHA:         $checked_out_sha"
          test "$checked_out_sha" = "$R2_CHECKPOINT_SHA"

      - name: Checkout immutable R1 checkpoint for compatibility evidence
        uses: actions/checkout@v7
        with:
          ref: ${{ env.R1_CHECKPOINT_SHA }}
          path: .checkpoints/r1
          persist-credentials: false

      - name: Assert exact R1 checkpoint revision
        working-directory: .checkpoints/r1
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected R1 checkpoint SHA: $R1_CHECKPOINT_SHA"
          echo "Checked-out R1 SHA:         $checked_out_sha"
          test "$checked_out_sha" = "$R1_CHECKPOINT_SHA"

      - name: Verify backend against Testcontainers PostgreSQL with persistent Maven cache
        run: >-
          docker run --rm
          --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -v specgraph-maven-cache:/root/.m2
          -v "$PWD/backend:/workspace"
          -w /workspace
          maven:3.9-eclipse-temurin-21
          mvn -B -q verify

      - name: Report backend test failures
        if: failure()
        run: |
          if [ -d backend/target/surefire-reports ]; then
            find backend/target/surefire-reports -maxdepth 1 -type f -name '*.txt' -print -exec cat {} \;
          else
            echo 'No Surefire report directory was produced.'
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify frontend with persistent npm download cache
        working-directory: frontend
        run: |
          mkdir -p "$HOME/.cache/specgraph-npm"
          npm_config_cache="$HOME/.cache/specgraph-npm" npm install --prefer-offline --no-audit --no-fund
          npm run build

      - name: Reuse or build exact-head R3 and archived R2/R1 images
        run: |
          r3_image="$(bash scripts/ci/ensure-app-image.sh \
            "specgraph-reference-app:r3-ci-${SOURCE_SHA}" . "$SOURCE_SHA")"
          r2_image="$(bash scripts/ci/ensure-app-image.sh \
            "specgraph-reference-app:r2-compat-${R2_CHECKPOINT_SHA}" .checkpoints/r2 "$R2_CHECKPOINT_SHA")"
          r1_image="$(bash scripts/ci/ensure-app-image.sh \
            "specgraph-reference-app:r1-compat-${R1_CHECKPOINT_SHA}" .checkpoints/r1 "$R1_CHECKPOINT_SHA")"
          echo "APP_R3_IMAGE=$r3_image" >> "$GITHUB_ENV"
          echo "APP_R2_IMAGE=$r2_image" >> "$GITHUB_ENV"
          echo "APP_R1_IMAGE=$r1_image" >> "$GITHUB_ENV"

      - name: Reuse or build immutable Playwright dependency image
        run: |
          image="$(bash scripts/ci/ensure-e2e-image.sh)"
          echo "E2E_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Validate source and published-checkpoint deployment topologies
        run: |
          docker compose config --quiet
          docker compose -f compose.oci.yaml config --quiet
          docker compose -f compose.r4.yaml config --quiet
          if OPENAI_API_KEY=must-not-enter-deterministic-r4 \
              docker compose -f compose.r4.yaml config | grep -Fq must-not-enter-deterministic-r4; then
            echo 'Raw deterministic R4 Compose configuration leaked the ambient OpenAI credential.' >&2
            exit 1
          fi

      - name: Start archived R2 checkpoint for compatibility evidence
        run: docker compose up -d --no-build r2

      - name: Wait for archived R2 application health
        run: |
          app_id="$(docker compose ps -q r2)"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              echo "Archived R2 application healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color r2 postgres
          exit 1

      - name: Assert archived R2 PostgreSQL fixture contract
        run: |
          amount_currency="$(docker compose exec -T postgres psql -U specgraph -d specgraph -Atc \
            "SELECT amount::text || '|' || currency FROM transactions WHERE transaction_id = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1'")"
          test "$amount_currency" = '248.50|CHF'

      - name: Verify archived R2 checkpoint with its ring-specific Playwright contract
        env:
          BASE_URL: http://127.0.0.1:8082
          EVIDENCE_NAME: r2
        run: bash scripts/ci/run-playwright.sh r2-customer-review.spec.ts

      - name: Prove deterministic R2 reset and reseed
        run: |
          docker compose down --remove-orphans
          docker compose up -d --no-build r2
          app_id="$(docker compose ps -q r2)"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id" 2>/dev/null || true)"
            [ "$health" = healthy ] && break
            if [ "$attempt" -eq 90 ]; then
              docker compose ps
              docker compose logs --no-color r2 postgres
              exit 1
            fi
            sleep 2
          done
          amount_currency="$(docker compose exec -T postgres psql -U specgraph -d specgraph -Atc \
            "SELECT amount::text || '|' || currency FROM transactions WHERE transaction_id = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaa1'")"
          stable_risk_count="$(docker compose exec -T postgres psql -U specgraph -d specgraph -Atc \
            "SELECT count(*) FROM risk_assessments ra JOIN transactions t ON t.transaction_id = ra.transaction_id WHERE t.customer_id = '22222222-2222-2222-2222-222222222222'")"
          test "$amount_currency" = '248.50|CHF'
          test "$stable_risk_count" = '0'

      - name: Start exact-head R3 topology
        run: docker compose up -d --no-build r3

      - name: Wait for packaged R3 application health
        run: |
          app_id="$(docker compose ps -q r3)"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              echo "Packaged R3 application healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color r3 postgres
          exit 1

      - name: Assert deployed R3 analysis-history schema
        run: |
          analysis_table="$(docker compose exec -T postgres psql -U specgraph -d specgraph -Atc \
            "SELECT to_regclass('public.analysis_history')::text")"
          test "$analysis_table" = 'analysis_history'

      - name: Verify Spring Boot serves the built R3 React UI
        run: |
          curl -fsS http://127.0.0.1:8083/ | grep -F '<div id="root"></div>'
          curl -fsS http://127.0.0.1:8083/actuator/health | grep -F '"status":"UP"'

      - name: VFY-ANALYSIS-001 - Verify deployed R3 analysis and persistent-history path
        env:
          BASE_URL: http://127.0.0.1:8083
          EVIDENCE_NAME: r3
        run: bash scripts/ci/run-playwright.sh r3-analysis-history.spec.ts

      - name: Start archived R1 checkpoint for compatibility evidence
        run: docker compose up -d --no-build r1

      - name: Wait for archived R1 application health
        run: |
          app_id="$(docker compose ps -q r1)"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              echo "Archived R1 application healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color r1
          exit 1

      - name: Verify archived R1 checkpoint with its ring-specific Playwright contract
        env:
          BASE_URL: http://127.0.0.1:8081
          EVIDENCE_NAME: r1
        run: bash scripts/ci/run-playwright.sh r1-customer-review.spec.ts

      - name: Capture deployment evidence
        if: always()
        run: |
          mkdir -p e2e/test-results
          printf 'r3_source_sha=%s\nr2_checkpoint_sha=%s\nr1_checkpoint_sha=%s\n' "$SOURCE_SHA" "$R2_CHECKPOINT_SHA" "$R1_CHECKPOINT_SHA" > e2e/test-results/provenance.txt
          docker compose ps > e2e/test-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color r3 r2 postgres > e2e/test-results/r3-r2-compose.log 2>&1 || true
          docker compose logs --no-color r1 > e2e/test-results/r1-compose.log 2>&1 || true
          df -h "$GITHUB_WORKSPACE" > e2e/test-results/runner-disk.txt 2>&1 || true
          docker system df > e2e/test-results/docker-disk.txt 2>&1 || true

      - name: Upload executable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-${{ env.SOURCE_SHA }}-r2-${{ env.R2_CHECKPOINT_SHA }}-r1-${{ env.R1_CHECKPOINT_SHA }}-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Stop deployment while retaining immutable images and hot caches
        if: always()
        run: |
          docker compose down --remove-orphans || true
          docker image prune -f --filter 'until=24h' || true
          df -h "$GITHUB_WORKSPACE" || true
