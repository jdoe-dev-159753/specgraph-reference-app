name: application-ci
# Main application gate for the current portfolio system. Historical ring replay lives in submission-v1.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/app.Dockerfile'
      - 'compose.r5.yaml'
      - 'compose.r5.openai.yaml'
      - 'scripts/test_frontend_lock_contract.py'
      - 'scripts/analyze_dataset_ceiling.py'
      - 'scripts/test_analyze_dataset_ceiling.py'
      - 'scripts/validate_design_map.py'
      - 'scripts/validate_verification_markers.py'
      - 'scripts/test_validate_verification_markers.py'
      - 'docs/assignment/VV/verification.yaml'
      - 'docs/analysis/dataset-ceiling.md'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/app.Dockerfile'
      - 'compose.r5.yaml'
      - 'compose.r5.openai.yaml'
      - 'scripts/test_frontend_lock_contract.py'
      - 'scripts/analyze_dataset_ceiling.py'
      - 'scripts/test_analyze_dataset_ceiling.py'
      - 'scripts/validate_design_map.py'
      - 'scripts/validate_verification_markers.py'
      - 'scripts/test_validate_verification_markers.py'
      - 'docs/assignment/VV/verification.yaml'
      - 'docs/analysis/dataset-ceiling.md'
      - '.github/workflows/application-ci.yml'

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clean previous build outputs
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/build /workspace/scripts/__pycache__'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Assert exact validated source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Validate controlled design and verification maps
        run: |
          python3 scripts/validate_design_map.py
          python3 -B -m unittest scripts/test_validate_verification_markers.py
          python3 -B scripts/validate_verification_markers.py

      - name: Verify synthetic dataset ceiling report
        run: |
          python3 -B -m unittest scripts/test_analyze_dataset_ceiling.py
          python3 -B scripts/analyze_dataset_ceiling.py --check

      - name: Verify frontend dependency lock contract
        run: python3 -B -m unittest scripts/test_frontend_lock_contract.py

      - name: Verify backend against Testcontainers PostgreSQL
        run: >-
          docker run --rm
          --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/backend:/workspace"
          -w /workspace
          maven:3.9-eclipse-temurin-21@sha256:8f6ac126f7810bb5549c4cd122d2bf0e9cda5bdeb0838aa928f09e779fd8bef8
          mvn -B -q verify

      - name: Report backend test failures
        if: failure()
        run: |
          if [ -d backend/target/surefire-reports ]; then
            find backend/target/surefire-reports -maxdepth 1 -type f -name '*.txt' -print -exec cat {} \;
          else
            echo 'No Surefire report directory was produced.'
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify frontend type-check and production build
        working-directory: frontend
        env:
          npm_config_cache: ${{ runner.temp }}/specgraph-npm-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - name: Validate R5 local and OpenAI Compose contracts
        run: |
          set -euo pipefail

          local_config="$(SPECGRAPH_LOCAL_BASE_URL=http://192.0.2.10:1234/v1 \
            docker compose -f compose.r5.yaml config)"
          printf '%s\n' "$local_config" | grep -q 'SPECGRAPH_ANALYSIS_BACKEND: local'
          printf '%s\n' "$local_config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_0: BAYESIAN'
          printf '%s\n' "$local_config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_1: FUZZY'
          printf '%s\n' "$local_config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_2: RANDOM_FOREST'

          openai_config="$(SPECGRAPH_OPENAI_API_KEY=contract-test-key OPENAI_MODEL=contract-test-model \
            docker compose -f compose.r5.yaml -f compose.r5.openai.yaml config)"
          printf '%s\n' "$openai_config" | grep -q 'SPECGRAPH_ANALYSIS_BACKEND: openai'
          printf '%s\n' "$openai_config" | grep -q 'OPENAI_MODEL: contract-test-model'
          printf '%s\n' "$openai_config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_0: BAYESIAN'
          printf '%s\n' "$openai_config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_1: FUZZY'
          printf '%s\n' "$openai_config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_2: RANDOM_FOREST'

      - name: Reclaim build outputs
        if: always()
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/build /workspace/scripts/__pycache__'
          rm -rf "$RUNNER_TEMP/specgraph-npm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
