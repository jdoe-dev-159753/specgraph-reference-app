name: application-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'compose.yaml'
      - '.github/workflows/application-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'compose.yaml'
      - '.github/workflows/application-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - name: Clean container-owned outputs from previous runs
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results'
      - name: Recover malformed persistent workspace
        run: |
          if ! git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            echo "Restoring Git identity in persistent workspace: $GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" init
            git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          fi
      - uses: actions/checkout@v7
      - name: Verify backend
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e MAVEN_CONFIG=/tmp/.m2
          -v "$PWD/backend:/workspace"
          -w /workspace
          maven:3.9-eclipse-temurin-21
          mvn -B verify
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Validate deployment topology
        run: docker compose config --quiet
      - name: Start clean R1 deployment
        run: |
          CI_HOST_UID="$(id -u)" CI_HOST_GID="$(id -g)" docker compose up -d
      - name: Wait for deployed frontend and backend
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null \
              && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "R1 deployment healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify deployed R1 with Playwright
        run: |
          docker run --rm --network host --ipc=host \
            -e BASE_URL=http://127.0.0.1:5173 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test'
      - name: Capture deployment evidence
        if: always()
        run: |
          mkdir -p e2e/test-results
          docker compose ps > e2e/test-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > e2e/test-results/compose.log 2>&1 || true
      - name: Upload executable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-executable-evidence-${{ github.sha }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 30
      - name: Stop deployment
        if: always()
        run: docker compose down -v --remove-orphans
