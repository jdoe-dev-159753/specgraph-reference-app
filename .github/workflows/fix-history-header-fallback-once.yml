name: fix-history-header-fallback-once

on:
  push:
    branches: [feat/j4-bounded-customer-review]
    paths:
      - '.github/workflows/fix-history-header-fallback-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/j4-bounded-customer-review
      - name: Fix absent-header fallback semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text()
          old = """  const headerNumber = (name: string, fallback: number) => {\n    const value = Number(response.headers.get(name))\n    return Number.isFinite(value) ? value : fallback\n  }\n"""
          new = """  const headerNumber = (name: string, fallback: number) => {\n    const raw = response.headers.get(name)\n    if (raw === null || raw.trim() === '') return fallback\n    const value = Number(raw)\n    return Number.isFinite(value) ? value : fallback\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one history header fallback block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit correction and remove this workflow
        run: |
          rm .github/workflows/fix-history-header-fallback-once.yml
          git add frontend/src/App.tsx .github/workflows/fix-history-header-fallback-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve history pagination header fallbacks'
          git push origin HEAD:feat/j4-bounded-customer-review
