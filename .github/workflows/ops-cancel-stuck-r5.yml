name: ops-clear-reboot-interrupted-runs

on:
  push:
    branches:
      - ops/cancel-stuck-r5-34236806824

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel reboot-interrupted and unnecessary heavy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 34236806864 34236806935; do
            gh api --method POST "repos/${{ github.repository }}/actions/runs/${run}/cancel" || true
          done
