name: temp-render-sdd-semantics

on:
  workflow_dispatch:
  push:
    branches:
      - docs/sdd-readable-figures
    paths:
      - 'docs/assignment/SDD/diagrams/**.puml'
      - '.github/workflows/temp-render-sdd-semantics.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/sdd-readable-figures
          persist-credentials: true
      - name: Render SDD PlantUML to SVG
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/SDD/diagrams/*.puml
      - name: Commit rendered SVGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assignment/SDD/diagrams/*.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No rendered changes"
            exit 0
          fi
          git commit -m "docs: render UML-aligned SDD figures"
          git push
