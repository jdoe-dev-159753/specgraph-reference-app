name: temp-render-sdd-semantics

on:
  workflow_dispatch:
  push:
    branches:
      - docs/sdd-readable-figures
    paths:
      - 'docs/assignment/SDD/diagrams/**.puml'
      - '.github/workflows/temp-render-sdd-semantics.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/sdd-readable-figures
          persist-credentials: true
      - name: Reconcile authored-SVG documentation note
        shell: bash
        run: |
          perl -0pi -e 's|PlantUML files in \[`diagrams/`\]\(diagrams/\) are the semantic sources for UML and architecture figures, and their SVG files are generated views embedded below\.|PlantUML files in [`diagrams/`](diagrams/) are the semantic sources for UML and most architecture figures, with generated SVG views embedded below. Figure 11 is an authored SVG because its defining geometry is genuinely concentric rather than a graph layout.|g' docs/assignment/SDD/SDD.md
          perl -0pi -e 's|\[PlantUML source\]\(diagrams/delivery-rings\.puml\)|[Authored SVG source](diagrams/delivery-rings.svg)|g' docs/assignment/SDD/SDD.md
      - name: Render SDD PlantUML to SVG
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/SDD/diagrams/*.puml
      - name: Commit reconciled document and rendered SVGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assignment/SDD/SDD.md docs/assignment/SDD/diagrams/*.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No rendered changes"
            exit 0
          fi
          git commit -m "docs: render UML-aligned SDD figures"
          git push
