name: link-j2-j5-native-graph-once

on:
  push:
    branches: [ops/populate-j2-j5-workgraph-once]
    paths:
      - '.github/workflows/link-j2-j5-native-graph-once.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  link:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci]
    steps:
      - name: Link native graph and publish J1-to-J2 project status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const parents = new Map([
              [99,102], [100,102], [112,102], [114,112],
              [115,63], [116,63], [117,64],
              [119,118], [120,118], [121,118],
              [123,122], [124,122], [125,122], [126,122],
              [130,128], [131,128],
            ]);
            const dependencies = [
              [118,64],
              [122,118],
              [125,123],
              [127,122],
              [128,122],
              [129,122],
              [130,122],
              [131,122],
              [131,117],
            ];

            for (const [childNumber, parentNumber] of parents) {
              const { data: child } = await github.rest.issues.get({ owner, repo, issue_number: childNumber });
              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                  owner, repo, issue_number: parentNumber, sub_issue_id: child.id, replace_parent: true,
                  headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                });
                core.info(`parent #${parentNumber} -> child #${childNumber}`);
              } catch (error) {
                if (error.status !== 409 && error.status !== 422) throw error;
                core.info(`parent relation already satisfied: #${parentNumber} -> #${childNumber}`);
              }
            }

            for (const [blockedNumber, blockerNumber] of dependencies) {
              const { data: blocker } = await github.rest.issues.get({ owner, repo, issue_number: blockerNumber });
              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by', {
                  owner, repo, issue_number: blockedNumber, issue_id: blocker.id,
                  headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                });
                core.info(`#${blockedNumber} blocked by #${blockerNumber}`);
              } catch (error) {
                if (error.status !== 409 && error.status !== 422) throw error;
                core.info(`dependency already satisfied: #${blockedNumber} <- #${blockerNumber}`);
              }
            }

            let project = null;
            let cursor = null;
            do {
              const page = await github.graphql(`
                query($login: String!, $after: String) {
                  user(login: $login) {
                    projectsV2(first: 20, after: $after) {
                      nodes {
                        id
                        title
                        fields(first: 100) {
                          nodes {
                            __typename
                            ... on ProjectV2SingleSelectField { id name options { id name } }
                          }
                        }
                        statusUpdates(last: 20) {
                          nodes { id body status startDate targetDate createdAt }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              `, { login: owner, after: cursor });
              const conn = page.user.projectsV2;
              project = conn.nodes.find(p => p.title === 'SpecGraph Reference App') ?? null;
              if (project || !conn.pageInfo.hasNextPage) break;
              cursor = conn.pageInfo.endCursor;
            } while (true);
            if (!project) throw new Error('SpecGraph Reference App Project v2 not found');

            const priorityField = project.fields.nodes.find(
              f => f?.__typename === 'ProjectV2SingleSelectField' && f.name === 'Delivery priority'
            );
            if (!priorityField) throw new Error('Delivery priority field not found');
            const priorityOptions = Object.fromEntries(priorityField.options.map(o => [o.name, o.id]));

            const projectItems = [];
            cursor = null;
            do {
              const page = await github.graphql(`
                query($projectId: ID!, $after: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $after) {
                        nodes {
                          id
                          content {
                            __typename
                            ... on Issue { id number repository { nameWithOwner } }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, { projectId: project.id, after: cursor });
              projectItems.push(...page.node.items.nodes);
              if (!page.node.items.pageInfo.hasNextPage) break;
              cursor = page.node.items.pageInfo.endCursor;
            } while (true);

            const ensureProjectIssue = async issueNumber => {
              let item = projectItems.find(i =>
                i.content?.__typename === 'Issue' &&
                i.content.repository?.nameWithOwner === `${owner}/${repo}` &&
                i.content.number === issueNumber
              );
              if (item) return item;
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const added = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id content { ... on Issue { id number } } }
                  }
                }
              `, { projectId: project.id, contentId: issue.node_id });
              item = added.addProjectV2ItemById.item;
              projectItems.push(item);
              core.info(`Project item added for #${issueNumber}`);
              return item;
            };

            for (const issueNumber of [128,130,131]) await ensureProjectIssue(issueNumber);

            const rootPriority = new Map([[128, 'NICE_TO_HAVE']]);
            for (const [issueNumber, desired] of rootPriority) {
              const item = await ensureProjectIssue(issueNumber);
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, {
                projectId: project.id,
                itemId: item.id,
                fieldId: priorityField.id,
                optionId: priorityOptions[desired],
              });
              core.info(`root #${issueNumber}: Delivery priority -> ${desired}`);
            }

            const marker = 'J1 closed; J2 persistence and deterministic-analysis delivery active.';
            const existing = project.statusUpdates.nodes.find(update => update.body?.includes(marker));
            if (!existing) {
              const body = [
                marker,
                '',
                '- J1 closed with controlled SRS/SDD/V&V, executable R0/R1 checkpoints, Compose + Playwright evidence, and polished reviewer-facing R1 publication.',
                '- J2 now owns PostgreSQL/JPA adapter substitution, end-to-end amount/currency semantics, deterministic risk scenarios, and the SDD/ADR detection-versus-explanation trust boundary.',
                '- J3 completes grounded retrieval and multi-operator access; J4 hardens bounded high-volume UI/context and degraded paths; J5 freezes, audits, and rehearses the exact submission.',
                '- NICE_TO_HAVE differentiation is explicitly non-blocking: non-LLM detector benchmarking, model drift evidence, dataset-ceiling analysis, optional live provider, and reviewer telemetry.',
                '- Remaining Project UI auto-add/roadmap presentation audit stays independently tracked by #49 and does not reopen J1.',
              ].join('\n');
              const result = await github.graphql(`
                mutation($projectId: ID!, $body: String!, $startDate: Date!, $targetDate: Date!) {
                  createProjectV2StatusUpdate(input: {
                    projectId: $projectId,
                    body: $body,
                    status: ON_TRACK,
                    startDate: $startDate,
                    targetDate: $targetDate
                  }) {
                    statusUpdate { id status startDate targetDate }
                  }
                }
              `, {
                projectId: project.id,
                body,
                startDate: '2026-08-31',
                targetDate: '2026-09-04',
              });
              core.info(`Project status update created: ${result.createProjectV2StatusUpdate.statusUpdate.id}`);
            } else {
              core.info(`Project status update already present: ${existing.id}`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'project-v2-reconcile.yml',
              ref: 'main',
            });
            core.info('project-v2-reconcile.yml dispatched to project inherited child priorities/status');
