name: work-graph-guard

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  guard:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci]
    steps:
      - name: Prepare isolated trusted checkout
        run: |
          trusted="$GITHUB_WORKSPACE/.workgraph-trusted"
          if [ -e "$trusted" ] && ! git -C "$trusted" rev-parse --git-dir >/dev/null 2>&1; then
            rm -rf "$trusted"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workgraph-trusted
          persist-credentials: false
      - name: Reject competing prose work-state
        working-directory: .workgraph-trusted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/work_graph_guard.py
