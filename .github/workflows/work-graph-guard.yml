name: work-graph-guard

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: specgraph-repository-queue
  cancel-in-progress: false
  queue: max

jobs:
  guard:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'issue_comment' || github.event.comment.user.id == 199175422) }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workgraph-trusted
          persist-credentials: false
      - name: Verify guard semantics
        working-directory: .workgraph-trusted
        run: python3 -m unittest scripts/test_work_graph_guard.py
      - name: Reject competing prose work-state and publish exact-head review status
        working-directory: .workgraph-trusted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/work_graph_guard.py
