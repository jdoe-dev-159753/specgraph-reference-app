name: r4-acceptance-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker/**'
      - 'compose.r4.yaml'
      - '.dockerignore'
      - '.github/workflows/r4-acceptance-ci.yml'
  workflow_dispatch:

# compose.r4.yaml binds the candidate to fixed host port 8086 on the shared
# Docker runner. Serialize this workflow across PRs/runs so a second candidate
# cannot fail merely because another R4 acceptance proof owns that port.
concurrency:
  group: r4-acceptance-ci-shared-host-fixed-port
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-r4-acceptance:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R4_PORT: '8086'
      COMPOSE_PROJECT_NAME: r4-acceptance-${{ github.run_id }}
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints'

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Start exact-head R4 Compose topology
        env:
          APP_R4_IMAGE: specgraph-reference-app:r4-acceptance-${{ env.SOURCE_SHA }}
        run: |
          echo "APP_R4_IMAGE=$APP_R4_IMAGE" >> "$GITHUB_ENV"
          docker compose -f compose.r4.yaml up -d --build

          for attempt in $(seq 1 180); do
            if curl -fsS "http://127.0.0.1:${R4_PORT}/actuator/health" >/dev/null 2>&1; then
              echo "R4 acceptance topology healthy after ${attempt} attempts"
              docker compose -f compose.r4.yaml ps
              exit 0
            fi
            sleep 2
          done

          docker compose -f compose.r4.yaml ps
          docker compose -f compose.r4.yaml logs --no-color postgres r4
          exit 1

      - name: VFY-AUTH-001 + VFY-ANALYSIS-CONTRACT-001 + VFY-RAG-001 + VFY-HISTORY-001 + VFY-DETERMINISM-001 - Verify complete R4 browser flow
        run: |
          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e BASE_URL="http://127.0.0.1:${R4_PORT}" \
            -e EVIDENCE_NAME=r4-complete-flow \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

      - name: Upload complete R4 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-complete-flow-${{ env.SOURCE_SHA }}
          path: |
            e2e/test-results/r4-complete-flow.xml
            e2e/test-results/r4-complete-flow-artifacts/**
            e2e/playwright-report/r4-complete-flow/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Reclaim isolated R4 Compose topology
        if: always()
        run: |
          docker compose -f compose.r4.yaml down --volumes --remove-orphans 2>/dev/null || true
          if [ -n "${APP_R4_IMAGE:-}" ]; then
            docker image rm -f "$APP_R4_IMAGE" 2>/dev/null || true
          fi
