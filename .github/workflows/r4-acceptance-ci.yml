name: r4-acceptance-ci
# Runs the stable R4 browser acceptance suite and retains reviewer-readable evidence artifacts.

on:
  pull_request_target:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker/**'
      - 'scripts/ci/**'
      - 'compose.r4.yaml'
      - 'compose.r4.ci-cache.yaml'
      - 'compose.r4.degradation.yaml'
      - '.dockerignore'
      - '.github/workflows/r4-acceptance-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ (!(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' && (github.event_name != 'issue_comment' || github.event.comment.user.id == 199175422)) && 'specgraph-repository-queue' || format('specgraph-bypassed-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  verify-r4-acceptance:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: r4-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      R4_EMBEDDING_CACHE_VOLUME: specgraph-r4-ci-embedding-cache-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDX_BUILDER: specgraph-r4-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDKIT_CACHE_MOUNT_NS: specgraph-r4-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      R4_PORT: '0'
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints /workspace/build'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Reuse or build immutable exact-head application image
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for the OCI handoff}"
          bash scripts/ci/run-scoped-buildx.sh prepare
          app_oci_archive="$RUNNER_TEMP/r4-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.oci.tar"
          app_oci_layout="$RUNNER_TEMP/r4-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.oci"
          rm -rf "$app_oci_layout"
          mkdir -p "$app_oci_layout"
          image="$(APP_IMAGE_OCI_ARCHIVE="$app_oci_archive" bash scripts/ci/ensure-app-image.sh \
            "specgraph-reference-app:r4-${SOURCE_SHA}" . "$SOURCE_SHA")"
          tar -xf "$app_oci_archive" -C "$app_oci_layout"
          app_oci_digest="$(python3 - "$app_oci_layout/index.json" <<'PY'
          import json
          import pathlib
          import re
          import sys

          index = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          manifests = index.get("manifests")
          if not isinstance(manifests, list) or len(manifests) != 1:
              raise SystemExit("application OCI handoff must contain exactly one top-level descriptor")
          digest = manifests[0].get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("application OCI handoff has no valid sha256 descriptor")
          print(digest)
          PY
          )"
          echo "APP_R4_IMAGE=$image" >> "$GITHUB_ENV"
          echo "APP_R4_OCI_ARCHIVE=$app_oci_archive" >> "$GITHUB_ENV"
          echo "APP_R4_OCI_LAYOUT=$app_oci_layout" >> "$GITHUB_ENV"
          echo "APP_R4_OCI_DIGEST=$app_oci_digest" >> "$GITHUB_ENV"

      - name: Reuse or build immutable Playwright dependency image
        run: |
          image="$(bash scripts/ci/ensure-e2e-image.sh)"
          echo "E2E_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Prepare run-scoped R4 embedding model cache
        run: |
          docker volume rm -f "$R4_EMBEDDING_CACHE_VOLUME" >/dev/null 2>&1 || true
          docker volume create \
            --label io.specgraph.cache=r4-embedding \
            --label "io.specgraph.workflow-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$R4_EMBEDDING_CACHE_VOLUME" >/dev/null
          docker run --rm -v "${R4_EMBEDDING_CACHE_VOLUME}:/cache" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'test ! -e /cache/.specgraph-cache-ready && chown -R 10001:10001 /cache'
          echo "R4 run-scoped embedding cache volume: $R4_EMBEDDING_CACHE_VOLUME"

      - name: Start exact-head R4 topology and populate cold run cache
        run: |
          set -euo pipefail

          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml up -d --no-build

          application="$(docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml ps -q r4)"
          endpoint="$(docker port "$application" 8080/tcp | head -n 1)"
          R4_PORT="${endpoint##*:}"
          case "$R4_PORT" in
            ''|*[!0-9]*)
              echo "Docker did not return a numeric run-isolated acceptance port: $endpoint" >&2
              exit 1
              ;;
          esac
          echo "R4_PORT=$R4_PORT" >> "$GITHUB_ENV"
          printf 'Docker allocated R4 acceptance port %s for run %s\n' "$R4_PORT" "$GITHUB_RUN_ID"

          healthy=false
          for attempt in $(seq 1 180); do
            if curl -fsS "http://127.0.0.1:${R4_PORT}/actuator/health" >/dev/null 2>&1; then
              echo "R4 acceptance topology healthy after ${attempt} attempts"
              docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml ps
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml ps
            docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml logs --no-color postgres r4
            exit 1
          fi

          file_count="$(docker run --rm -v "${R4_EMBEDDING_CACHE_VOLUME}:/cache:ro" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'find /cache -type f | wc -l')"
          echo "Cold-start embedding cache files after healthy startup: $file_count"
          test "$file_count" -gt 0
          docker run --rm -v "${R4_EMBEDDING_CACHE_VOLUME}:/cache" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'touch /cache/.specgraph-cache-ready && chown 10001:10001 /cache/.specgraph-cache-ready'
          echo "R4 run cache populated and marked ready for same-run warm proof"

      - name: VFY-AUTH-001 + VFY-ANALYSIS-CONTRACT-001 + VFY-RAG-001 + VFY-HISTORY-001 + VFY-DETERMINISM-001 - Verify complete R4 browser flow
        env:
          BASE_URL: http://127.0.0.1:${{ env.R4_PORT }}
          EVIDENCE_NAME: r4-complete-flow
        run: bash scripts/ci/run-playwright.sh r4-complete-flow.spec.ts

      - name: Restart exact-head R4 with isolated degradation adapters
        run: |
          set -euo pipefail
          degradation_image="${APP_R4_IMAGE}-degradation"
          docker buildx build --builder "$BUILDX_BUILDER" --load \
            --build-arg "BUILDKIT_CACHE_MOUNT_NS=$BUILDKIT_CACHE_MOUNT_NS" \
            --build-context "exact-head-image=oci-layout://${APP_R4_OCI_LAYOUT}@${APP_R4_OCI_DIGEST}" \
            -f docker/r4-degradation.Dockerfile \
            -t "$degradation_image" \
            .
          echo "APP_R4_DEGRADATION_IMAGE=$degradation_image" >> "$GITHUB_ENV"

          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml stop r4
          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml rm -f r4
          APP_R4_DEGRADATION_IMAGE="$degradation_image" R4_PORT=0 docker compose \
            -f compose.r4.yaml \
            -f compose.r4.ci-cache.yaml \
            -f compose.r4.degradation.yaml \
            up -d --no-build r4

          application="$(APP_R4_DEGRADATION_IMAGE="$degradation_image" docker compose \
            -f compose.r4.yaml \
            -f compose.r4.ci-cache.yaml \
            -f compose.r4.degradation.yaml \
            ps -q r4)"
          endpoint="$(docker port "$application" 8080/tcp | head -n 1)"
          R4_PORT="${endpoint##*:}"
          case "$R4_PORT" in
            ''|*[!0-9]*)
              echo "Docker did not return a numeric degradation-test port: $endpoint" >&2
              exit 1
              ;;
          esac
          echo "R4_PORT=$R4_PORT" >> "$GITHUB_ENV"

          for attempt in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${R4_PORT}/actuator/health" >/dev/null 2>&1; then
              echo "R4 degradation topology healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml logs --no-color postgres r4
          exit 1

      - name: VFY-FAILURE-PATHS-001 - Verify recoverable R4 degradation matrix
        env:
          BASE_URL: http://127.0.0.1:${{ env.R4_PORT }}
          EVIDENCE_NAME: r4-degradation
        run: bash scripts/ci/run-playwright.sh r4-persistence-degradation.spec.ts

      - name: Assert transformer resources persisted outside disposable application container
        run: |
          docker run --rm -v "${R4_EMBEDDING_CACHE_VOLUME}:/cache:ro" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'test -f /cache/.specgraph-cache-ready'
          file_count="$(docker run --rm -v "${R4_EMBEDDING_CACHE_VOLUME}:/cache:ro" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'find /cache -type f ! -name .specgraph-cache-ready | wc -l')"
          echo "Persistent embedding resource files: $file_count"
          test "$file_count" -gt 0

      - name: Prove warm exact-head R4 startup consumes the retained cache
        run: |
          set -euo pipefail
          offline_override="$RUNNER_TEMP/r4-cache-origin-block.yaml"
          cat > "$offline_override" <<'YAML'
          services:
            r4:
              extra_hosts:
                - "raw.githubusercontent.com:127.0.0.1"
                - "media.githubusercontent.com:127.0.0.1"
          YAML

          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml stop r4
          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml rm -f r4
          R4_PORT=0 docker compose \
            -f compose.r4.yaml \
            -f compose.r4.ci-cache.yaml \
            -f "$offline_override" \
            up -d --no-build r4

          application="$(docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml -f "$offline_override" ps -q r4)"
          endpoint="$(docker port "$application" 8080/tcp | head -n 1)"
          R4_PORT="${endpoint##*:}"
          case "$R4_PORT" in
            ''|*[!0-9]*)
              echo "Docker did not return a numeric warm-start acceptance port: $endpoint" >&2
              exit 1
              ;;
          esac
          printf 'Docker allocated warm-start R4 acceptance port %s for run %s\n' "$R4_PORT" "$GITHUB_RUN_ID"

          healthy=false
          for attempt in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${R4_PORT}/actuator/health" >/dev/null 2>&1; then
              healthy=true
              echo "Warm-cache R4 restart succeeded with embedding resource origins blocked"
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker compose \
              -f compose.r4.yaml \
              -f compose.r4.ci-cache.yaml \
              -f "$offline_override" \
              logs --no-color postgres r4
            exit 1
          fi

      - name: Upload complete R4 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r4-complete-flow-${{ env.SOURCE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            e2e/test-results/r4-complete-flow.xml
            e2e/test-results/r4-complete-flow-artifacts/**
            e2e/playwright-report/r4-complete-flow/**
            e2e/test-results/r4-degradation.xml
            e2e/test-results/r4-degradation-artifacts/**
            e2e/playwright-report/r4-degradation/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Reclaim isolated R4 Compose topology and run cache
        if: always()
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for OCI cleanup}"
          app_oci_archive="$RUNNER_TEMP/r4-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.oci.tar"
          app_oci_layout="$RUNNER_TEMP/r4-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.oci"
          docker compose -f compose.r4.yaml -f compose.r4.ci-cache.yaml down --volumes --remove-orphans 2>/dev/null || true
          docker volume rm -f "$R4_EMBEDDING_CACHE_VOLUME" 2>/dev/null || true
          bash scripts/ci/run-scoped-buildx.sh cleanup
          rm -f "$app_oci_archive"
          rm -rf "$app_oci_layout"
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/build'
