name: r4-acceptance-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker/**'
      - 'scripts/ci/**'
      - 'compose.r4.yaml'
      - '.dockerignore'
      - '.github/workflows/r4-acceptance-ci.yml'
  workflow_dispatch:

concurrency:
  group: r4-acceptance-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-r4-acceptance:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: r4-acceptance-${{ github.run_id }}
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints'

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Allocate run-isolated acceptance port
        run: |
          port=$((56000 + (GITHUB_RUN_ID % 9000)))
          if [ "$port" -lt 56000 ] || [ "$port" -gt 64999 ]; then
            echo "Calculated R4 acceptance port is outside the reserved CI range: $port" >&2
            exit 1
          fi
          echo "R4_PORT=$port" >> "$GITHUB_ENV"
          printf 'Allocated R4 acceptance port %s for run %s\n' "$port" "$GITHUB_RUN_ID"

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Reuse or build immutable exact-head application image
        run: |
          image="$(bash scripts/ci/ensure-app-image.sh \
            "specgraph-reference-app:r4-${SOURCE_SHA}" . "$SOURCE_SHA")"
          echo "APP_R4_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Reuse or build immutable Playwright dependency image
        run: |
          image="$(bash scripts/ci/ensure-e2e-image.sh)"
          echo "E2E_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Start exact-head R4 Compose topology without rebuilding image
        run: |
          docker compose -f compose.r4.yaml up -d --no-build

          for attempt in $(seq 1 180); do
            if curl -fsS "http://127.0.0.1:${R4_PORT}/actuator/health" >/dev/null 2>&1; then
              echo "R4 acceptance topology healthy after ${attempt} attempts"
              docker compose -f compose.r4.yaml ps
              exit 0
            fi
            sleep 2
          done

          docker compose -f compose.r4.yaml ps
          docker compose -f compose.r4.yaml logs --no-color postgres r4
          exit 1

      - name: VFY-AUTH-001 + VFY-ANALYSIS-CONTRACT-001 + VFY-RAG-001 + VFY-HISTORY-001 + VFY-DETERMINISM-001 - Verify complete R4 browser flow
        env:
          BASE_URL: http://127.0.0.1:${{ env.R4_PORT }}
          EVIDENCE_NAME: r4-complete-flow
        run: bash scripts/ci/run-playwright.sh r4-complete-flow.spec.ts

      - name: Upload complete R4 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-complete-flow-${{ env.SOURCE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            e2e/test-results/r4-complete-flow.xml
            e2e/test-results/r4-complete-flow-artifacts/**
            e2e/playwright-report/r4-complete-flow/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Reclaim isolated R4 Compose topology
        if: always()
        run: |
          docker compose -f compose.r4.yaml down --volumes --remove-orphans 2>/dev/null || true
