name: temp-restore-project-30

on:
  push:
    branches: [ci/project-v2-reconcile]
    paths:
      - '.github/workflows/temp-restore-project-30.yml'

jobs:
  restore:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci]
    steps:
      - name: Restore issue 30 disposition
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repoFull = `${owner}/${context.repo.repo}`;
            const data = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  projectsV2(first: 20) {
                    nodes {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          __typename
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              number
                              repository { nameWithOwner }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { login: owner });

            const project = data.user.projectsV2.nodes.find(p => p.title === 'SpecGraph Reference App');
            if (!project) throw new Error('Project not visible');
            const field = project.fields.nodes.find(
              f => f?.__typename === 'ProjectV2SingleSelectField' && f.name === 'Discovery disposition'
            );
            const option = field.options.find(o => o.name === 'IN_SCOPE');
            const item = project.items.nodes.find(
              i => i.content?.number === 30 && i.content.repository.nameWithOwner === repoFull
            );
            if (!field || !option || !item) throw new Error('Required Project item/field/option missing');

            await github.graphql(`
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project,
                  itemId: $item,
                  fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }
            `, { project: project.id, item: item.id, field: field.id, option: option.id });
            core.info('#30: Discovery disposition restored to IN_SCOPE');
