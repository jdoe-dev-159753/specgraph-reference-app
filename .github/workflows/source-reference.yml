name: source-reference
# Builds one exact-head, navigable artifact from maintained intent comments and contracts.

on:
  pull_request:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - 'backend/pom.xml'
      - 'backend/src/main/java/**'
      - 'backend/src/test/java/**'
      - 'backend/src/test/resources/**'
      - 'backend/src/main/resources/db/**/*.sql'
      - 'backend/src/main/resources/**/*.properties'
      - 'backend/src/main/resources/static/openapi.yaml'
      - 'docs/reviewer/frontend-source-inventory.json'
      - 'docs/tooling/frontend-reference/**'
      - 'e2e/**'
      - 'frontend/**'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'scripts/ci/*.tsv'
      - 'scripts/ci/*.txt'
  push:
    branches: [main]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - 'backend/pom.xml'
      - 'backend/src/main/java/**'
      - 'backend/src/test/java/**'
      - 'backend/src/test/resources/**'
      - 'backend/src/main/resources/db/**/*.sql'
      - 'backend/src/main/resources/**/*.properties'
      - 'backend/src/main/resources/static/openapi.yaml'
      - 'docs/reviewer/frontend-source-inventory.json'
      - 'docs/tooling/frontend-reference/**'
      - 'e2e/**'
      - 'frontend/**'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'scripts/ci/*.tsv'
      - 'scripts/ci/*.txt'
  workflow_dispatch:

concurrency:
  group: source-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clean generated source reference before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/build'

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify immutable container image supply chain
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/workspace:ro" -w /workspace \
            python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a \
            sh -c 'python -m unittest scripts.test_verify_container_images && python scripts/verify_container_images.py'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate implementation and HTTP API reference
        run: bash scripts/generate-source-reference.sh

      - name: Record artifact provenance
        run: |
          printf 'sourceSha=%s\nworkflowRun=%s\nworkflowAttempt=%s\n' \
            "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > backend/target/source-reference/provenance.txt

      - name: Upload navigable source reference
        uses: actions/upload-artifact@v4
        with:
          name: source-reference-${{ env.SOURCE_SHA }}
          path: backend/target/source-reference/
          if-no-files-found: error
          retention-days: 30

      - name: Reclaim container-owned source-reference outputs
        if: always()
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/build'
