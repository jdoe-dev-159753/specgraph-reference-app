name: one-shot-stage-demo-shared-host-safety

on:
  pull_request:
    paths:
      - 'scripts/one_shot_stage_demo_shared_host_safety.py'
      - '.github/workflows/one-shot-stage-demo-shared-host-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: github.event_name != 'pull_request' || github.head_ref == 'demo/publish-r4-reviewer-oci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: demo/publish-r4-reviewer-oci
          fetch-depth: 0
      - name: Stage shared-host-safe publication workflow
        run: python3 scripts/one_shot_stage_demo_shared_host_safety.py
      - name: Commit staged workflow blob
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/demo-images-shared-host-safe.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore: stage shared-host-safe demo workflow blob'
          git push origin HEAD:demo/publish-r4-reviewer-oci
