name: coverage
# Measures backend executable coverage on main and publishes a repository-owned badge.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/jacoco_badge.py'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ (!(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' && (github.event_name != 'issue_comment' || github.event.comment.user.id == 199175422)) && 'specgraph-repository-queue' || format('specgraph-bypassed-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  coverage:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.sha }}
      COVERAGE_OUTPUT_DIR: coverage-output
    steps:
      - name: Clean previous coverage outputs
        run: |
          rm -rf "$COVERAGE_OUTPUT_DIR"
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/scripts/__pycache__'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Assert exact coverage source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Verify backend and generate JaCoCo report
        run: >-
          docker run --rm
          --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/backend:/workspace"
          -w /workspace
          maven:3.9-eclipse-temurin-21@sha256:8f6ac126f7810bb5549c4cd122d2bf0e9cda5bdeb0838aa928f09e779fd8bef8
          mvn -B -q verify

      - name: Render coverage summary and badge
        run: |
          test -s backend/target/site/jacoco/jacoco.xml
          rm -rf "$COVERAGE_OUTPUT_DIR"
          mkdir -p "$COVERAGE_OUTPUT_DIR"
          python3 scripts/jacoco_badge.py \
            --xml backend/target/site/jacoco/jacoco.xml \
            --json "$COVERAGE_OUTPUT_DIR/coverage-summary.json" \
            --svg "$COVERAGE_OUTPUT_DIR/backend-coverage.svg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/target/site/jacoco/
            coverage-output/coverage-summary.json
            coverage-output/backend-coverage.svg
          if-no-files-found: error
          retention-days: 30

      - name: Publish main coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          publish_dir="$RUNNER_TEMP/specgraph-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp "$COVERAGE_OUTPUT_DIR/backend-coverage.svg" "$publish_dir/backend-coverage.svg"
          cp "$COVERAGE_OUTPUT_DIR/coverage-summary.json" "$publish_dir/coverage-summary.json"
          printf '%s\n' "$SOURCE_SHA" > "$publish_dir/source-sha.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan coverage-badge-publish
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$publish_dir/backend-coverage.svg" .
          cp "$publish_dir/coverage-summary.json" .
          cp "$publish_dir/source-sha.txt" .
          git add backend-coverage.svg coverage-summary.json source-sha.txt
          git commit -m "coverage: publish ${SOURCE_SHA}"
          git push --force origin HEAD:coverage-badge

      - name: Reclaim coverage outputs
        if: always()
        run: |
          rm -rf "$COVERAGE_OUTPUT_DIR"
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/scripts/__pycache__'
