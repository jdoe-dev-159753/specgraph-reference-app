name: temp-rerender-srs

on:
  pull_request:
    paths:
      - '.github/workflows/temp-rerender-srs.yml'
      - 'docs/assignment/SRS/diagrams/srs-analysis-use-cases.puml'
      - 'docs/assignment/SRS/diagrams/srs-analysis-activity.puml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render corrected SRS views
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 \
            -tsvg \
            docs/assignment/SRS/diagrams/srs-analysis-use-cases.puml \
            docs/assignment/SRS/diagrams/srs-analysis-activity.puml
      - name: Commit corrected SVGs
        run: |
          git add docs/assignment/SRS/diagrams/srs-analysis-use-cases.svg docs/assignment/SRS/diagrams/srs-analysis-activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: rerender corrected SRS analysis views'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
