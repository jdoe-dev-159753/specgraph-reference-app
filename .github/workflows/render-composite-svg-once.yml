name: render-composite-svg-once

on:
  push:
    branches: [feat/r5-detector-composite]
    paths:
      - '.github/workflows/render-composite-svg-once.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Render through permanent repository renderer
        run: bash scripts/render_plantuml.sh
      - name: Commit generated view and remove one-shot executor
        run: |
          git add docs/assignment/SDD/diagrams/component-topology.svg
          git rm .github/workflows/render-composite-svg-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate Composite component topology view'
          git push origin HEAD:feat/r5-detector-composite
