name: r5-provider-contracts

on:
  pull_request:
    paths:
      - 'compose.r5.yaml'
      - 'compose.r5.openai.yaml'
      - '.github/workflows/r5-provider-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'compose.r5.yaml'
      - 'compose.r5.openai.yaml'
      - '.github/workflows/r5-provider-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-contracts:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate full R5 local-model topology
        env:
          SPECGRAPH_LOCAL_BASE_URL: http://192.0.2.10:1234/v1
        run: |
          set -euo pipefail
          docker compose -f compose.r5.yaml config --quiet
          config="$(docker compose -f compose.r5.yaml config)"
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_BACKEND: local'
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_0: BAYESIAN'
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_1: FUZZY'
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_2: RANDOM_FOREST'

      - name: Validate full R5 OpenAI topology
        env:
          SPECGRAPH_OPENAI_API_KEY: contract-test-key
          OPENAI_MODEL: contract-test-model
        run: |
          set -euo pipefail
          docker compose -f compose.r5.yaml -f compose.r5.openai.yaml config --quiet
          config="$(docker compose -f compose.r5.yaml -f compose.r5.openai.yaml config)"
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_BACKEND: openai'
          printf '%s\n' "$config" | grep -q 'OPENAI_MODEL: contract-test-model'
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_0: BAYESIAN'
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_1: FUZZY'
          printf '%s\n' "$config" | grep -q 'SPECGRAPH_ANALYSIS_DETECTORS_2: RANDOM_FOREST'
