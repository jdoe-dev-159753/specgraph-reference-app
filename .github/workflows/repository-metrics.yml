name: repository-metrics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-metrics:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Measure authored repository lines
        run: |
          set -euo pipefail
          metrics_dir="$RUNNER_TEMP/specgraph-repository-metrics"
          rm -rf "$metrics_dir"
          mkdir -p "$metrics_dir"
          docker run --rm --network none \
            --read-only \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            aldanial/cloc:2.08@sha256:f4159515ece7b8d7c3729db25ef613b2f9c3e8c368f772ae5348bd6452bd57b3 \
            --json --quiet --hide-rate --unix \
            --exclude-dir=.git,node_modules,target,dist,build,playwright-report,test-results,.checkpoints \
            . > "$metrics_dir/cloc.json"
          python3 - "$metrics_dir/cloc.json" "$metrics_dir" <<'PY'
          import json
          import os
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          data = json.loads(source.read_text(encoding="utf-8"))
          total = data["SUM"]
          languages = []
          for name, values in data.items():
              if name in {"header", "SUM"} or not isinstance(values, dict) or "code" not in values:
                  continue
              languages.append((name, values))
          languages.sort(key=lambda item: (-item[1]["code"], item[0].lower()))

          lines = [
              "# Repository line metrics",
              "",
              f"Generated by the `repository-metrics` workflow for `{os.environ.get('GITHUB_SHA', 'main')}`.",
              "",
              "Generated/vendor/build outputs are excluded. Counts include maintained source, tests, configuration and controlled engineering documents recognized by cloc.",
              "",
              f"**Authored LOC: {total['code']:,}** across **{total['nFiles']:,} files**.",
              "",
              "| Language | Files | Code | Comment | Blank |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          for name, values in languages:
              lines.append(
                  f"| {name} | {values['nFiles']:,} | {values['code']:,} | {values['comment']:,} | {values['blank']:,} |"
              )
          lines.append("")
          (out / "repository-metrics.md").write_text("\n".join(lines), encoding="utf-8")
          (out / "loc.json").write_text(json.dumps({
              "schemaVersion": 1,
              "label": "Authored LOC",
              "message": f"{total['code']:,}",
              "color": "informational",
          }), encoding="utf-8")
          PY

      - name: Publish metrics branch
        run: |
          set -euo pipefail
          metrics_dir="$RUNNER_TEMP/specgraph-repository-metrics"
          publish_dir="$RUNNER_TEMP/specgraph-repository-metrics-publish"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp "$metrics_dir/repository-metrics.md" "$publish_dir/"
          cp "$metrics_dir/loc.json" "$publish_dir/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan repository-metrics-publish
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$publish_dir/repository-metrics.md" .
          cp "$publish_dir/loc.json" .
          git add repository-metrics.md loc.json
          git commit -m "metrics: repository line counts for ${GITHUB_SHA}"
          git push --force origin HEAD:repository-metrics
