name: finalize-issue367

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-issue367.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Apply and verify bounded reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/application-ci.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          indexes = [i for i, line in enumerate(lines) if line == '  verify:']
          assert len(indexes) == 1, indexes
          i = indexes[0]
          assert lines[i + 1].startswith('    if: $'), lines[i + 1]
          lines.insert(i + 1, '    needs: fast-verify')
          condition_index = i + 2
          old = (
              "github.event_name != 'issues' && "
              "(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && "
              "github.event_name == 'workflow_dispatch'"
          )
          new = "github.event_name != 'issues' && always() && github.event_name == 'workflow_dispatch'"
          assert lines[condition_index].count(old) == 1, lines[condition_index]
          lines[condition_index] = lines[condition_index].replace(old, new, 1)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          path = Path('.github/workflows/plantuml-diagrams.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          indexes = [i for i, line in enumerate(lines) if line == '  regenerate:']
          assert len(indexes) == 1, indexes
          i = indexes[0]
          assert lines[i + 1].startswith('    if: $'), lines[i + 1]
          lines.insert(i + 1, '    needs: verify')
          condition_index = i + 2
          old = (
              "github.event_name != 'issues' && "
              "(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && "
              "github.event_name == 'workflow_dispatch'"
          )
          new = "github.event_name != 'issues' && always() && github.event_name == 'workflow_dispatch'"
          assert lines[condition_index].count(old) == 1, lines[condition_index]
          lines[condition_index] = lines[condition_index].replace(old, new, 1)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          path = Path('scripts/work_graph_guard.py')
          text = path.read_text(encoding='utf-8')
          retired = '            "22fe48af6a8ee4418643ea1f68dad53c8d5c589af0e1dedbe7573ae88e91f30c",\n'
          assert text.count(retired) == 1
          path.write_text(text.replace(retired, '', 1), encoding='utf-8', newline='\n')
          PY

          git diff --check
          python3 -B -m unittest scripts/test_work_graph_guard.py

          mkdir -p issue367-final/.github/workflows issue367-final/scripts
          cp .github/workflows/application-ci.yml issue367-final/.github/workflows/
          cp .github/workflows/plantuml-diagrams.yml issue367-final/.github/workflows/
          cp scripts/work_graph_guard.py issue367-final/scripts/
          sha256sum \
            issue367-final/.github/workflows/application-ci.yml \
            issue367-final/.github/workflows/plantuml-diagrams.yml \
            issue367-final/scripts/work_graph_guard.py \
            > issue367-final/SHA256SUMS

      - name: Upload exact final files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue367-final-${{ github.sha }}
          path: issue367-final/
          if-no-files-found: error
          retention-days: 7
