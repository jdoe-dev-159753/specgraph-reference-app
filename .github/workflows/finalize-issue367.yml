name: finalize-issue367

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-issue367.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Apply and verify bounded reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/application-ci.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          indexes = [i for i, line in enumerate(lines) if line == '  verify:']
          assert len(indexes) == 1, indexes
          i = indexes[0]
          assert lines[i + 1].startswith('    if: $'), lines[i + 1]
          lines.insert(i + 1, '    needs: fast-verify')
          condition_index = i + 2
          old = (
              "github.event_name != 'issues' && "
              "(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && "
              "github.event_name == 'workflow_dispatch'"
          )
          new = "github.event_name != 'issues' && always() && github.event_name == 'workflow_dispatch'"
          assert lines[condition_index].count(old) == 1, lines[condition_index]
          lines[condition_index] = lines[condition_index].replace(old, new, 1)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          path = Path('.github/workflows/plantuml-diagrams.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          indexes = [i for i, line in enumerate(lines) if line == '  regenerate:']
          assert len(indexes) == 1, indexes
          i = indexes[0]
          assert lines[i + 1].startswith('    if: $'), lines[i + 1]
          lines.insert(i + 1, '    needs: verify')
          condition_index = i + 2
          old = (
              "github.event_name != 'issues' && "
              "(github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && "
              "github.event_name == 'workflow_dispatch'"
          )
          new = "github.event_name != 'issues' && always() && github.event_name == 'workflow_dispatch'"
          assert lines[condition_index].count(old) == 1, lines[condition_index]
          lines[condition_index] = lines[condition_index].replace(old, new, 1)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          path = Path('scripts/work_graph_guard.py')
          text = path.read_text(encoding='utf-8')
          retired = '            "22fe48af6a8ee4418643ea1f68dad53c8d5c589af0e1dedbe7573ae88e91f30c",\n'
          assert text.count(retired) == 1
          path.write_text(text.replace(retired, '', 1), encoding='utf-8', newline='\n')
          PY

          git diff --check
          python3 -B -m unittest scripts/test_work_graph_guard.py

      - name: Upload validated bytes as unattached Git blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          paths = [
              '.github/workflows/application-ci.yml',
              '.github/workflows/plantuml-diagrams.yml',
              'scripts/work_graph_guard.py',
          ]
          output = []
          for path in paths:
              raw = Path(path).read_bytes()
              payload = json.dumps({
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              req = request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with request.urlopen(req, timeout=30) as response:
                  blob = json.loads(response.read())
              output.append({'path': path, 'blob_sha': blob['sha'], 'size': len(raw)})
              print(f"BLOB {path} {blob['sha']} {len(raw)}")
          Path('issue367-git-blobs.json').write_text(json.dumps(output, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload blob manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue367-git-blobs-${{ github.sha }}
          path: issue367-git-blobs.json
          if-no-files-found: error
          retention-days: 7
