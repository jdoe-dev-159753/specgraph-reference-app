name: project-v2-reconcile

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, closed]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci]
    steps:
      - name: Recover malformed persistent workspace
        run: |
          if ! git -C "$GITHUB_WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
            echo "Restoring Git identity in persistent workspace: $GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" init
            git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile Project v2 and native work metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project-v2-reconcile.cjs`);
            await run({ github, context, core });
