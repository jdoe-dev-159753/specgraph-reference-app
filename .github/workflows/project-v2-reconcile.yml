name: project-v2-reconcile
# Projects native issue/PR lifecycle and ownership facts into the repository's GitHub Project fields.

on:
  issues:
    types: [opened, labeled, unlabeled, reopened, closed]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: project-v2-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workgraph-trusted
          persist-credentials: false
      - name: Reconcile Project v2 and native work metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.workgraph-trusted/.github/scripts/project-v2-reconcile.cjs`);
            await run({ github, context, core });
