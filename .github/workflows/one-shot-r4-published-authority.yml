name: one-shot-r4-published-authority

on:
  pull_request:
    paths:
      - 'scripts/one_shot_r4_published_authority.py'
      - '.github/workflows/one-shot-r4-published-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name != 'pull_request' || github.head_ref == 'demo/publish-r4-reviewer-oci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: demo/publish-r4-reviewer-oci
          fetch-depth: 0
      - name: Reconcile controlled published-demo authority
        run: python3 scripts/one_shot_r4_published_authority.py
      - name: Commit durable documentation only
        run: |
          rm -f scripts/one_shot_r4_published_authority.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/assignment/SDD/SDD.md docs/assignment/SDD/design-map.yaml scripts/one_shot_r4_published_authority.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs: reconcile published R4 reviewer authority'
          git push origin HEAD:demo/publish-r4-reviewer-oci
