name: temp-render-analysis-sequence

on:
  pull_request:
    paths:
      - '.github/workflows/temp-render-analysis-sequence.yml'
      - 'docs/assignment/SDD/diagrams/sequence-analysis.puml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render analysis sequence
        run: docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 -tsvg docs/assignment/SDD/diagrams/sequence-analysis.puml
      - name: Commit rendered SVG
        run: |
          git add docs/assignment/SDD/diagrams/sequence-analysis.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: rerender analysis sequence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
