name: work-graph-guard-tests

on:
  pull_request:
    paths:
      - 'scripts/work_graph_guard.py'
      - 'scripts/test_work_graph_guard.py'
      - 'scripts/ci/durable-workflows.txt'
      - '.github/workflows/work-graph-guard.yml'
      - '.github/workflows/work-graph-guard-tests.yml'

permissions:
  contents: read

concurrency:
  group: work-graph-guard-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-tests:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Assert exact tested source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify proposed work-graph guard semantics
        run: python3 -m unittest scripts/test_work_graph_guard.py
