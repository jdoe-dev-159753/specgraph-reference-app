name: temp-final-sdd-contract-fix

on:
  pull_request:
    paths:
      - '.github/workflows/temp-final-sdd-contract-fix.yml'
      - 'docs/assignment/SDD/diagrams/*.puml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Render all SDD PlantUML views
        run: docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 -tsvg docs/assignment/SDD/diagrams/*.puml
      - name: Commit rendered SVGs
        run: |
          git add docs/assignment/SDD/diagrams/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: rerender finalized SDD views'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
