name: bootstrap-controlled-diagrams-once

on:
  push:
    paths:
      - '.github/workflows/bootstrap-controlled-diagrams-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/plantuml-render-freshness
          fetch-depth: 1
      - name: Regenerate through permanent renderer
        run: bash scripts/render_plantuml.sh
      - name: Commit regenerated views and remove bootstrap
        run: |
          git add -- 'docs/assignment/**/*.svg'
          git rm -- '.github/workflows/bootstrap-controlled-diagrams-once.yml'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: baseline pinned controlled diagram rendering'
          git push origin HEAD:ci/plantuml-render-freshness
