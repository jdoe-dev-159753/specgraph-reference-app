name: finalize-deck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-deck.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Reframe measured delivery scale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/presentation/build-deck.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Five-day, production-shaped demonstrator for a Swissquote interview exercise':
                  'Five-day build target; R5 reached at J+7, followed by submission hardening',
              'Replaying the observed workflow would require about 155 human workdays':
                  'R5 reached J+7; final hardening delivered 32,281 authored LOC',
              'central replay compression':
                  'R5 replay compression at J+7',
              '155 workdays ÷ 7 calendar days = 22.1':
                  '155 ÷ 7 = 22.1 · historical R5 milestone',
              'SELECTED METHOD · REPLAY THE OBSERVED EXECUTION':
                  'HISTORICAL R5 MILESTONE · REPLAY THE OBSERVED EXECUTION',
              '7 calendar days observed':
                  '7 calendar days to R5',
              'Parametric replay estimate, not a controlled productivity experiment':
                  'R5 @ J+7: 22× replay · final: 32,281 authored LOC / 15 languages',
              'The selected comparison replays the observed PR, CI, review, correction and documentation workflow as human work.':
                  'The 22× comparison is the historical R5-at-J+7 replay; the hardened final submission is measured separately at 32,281 authored LOC across 15 languages.',
              'The earlier 115-day estimate answered a narrower counterfactual: how long one senior generalist might need to reproduce the final delivered scope after the architecture and solution path are already known. It removes discarded paths, repeated reviews, failed-CI recovery and coordination. The replay estimate retains those observed execution costs and therefore uses 140 to 170 human workdays, with 155 as the midpoint. Dividing 155 by seven gives 22.1, presented as 22 times.':
                  'R5 reached the complete interview path in seven calendar days. Replaying the observed PR, CI, review, correction and documentation work as human effort gives 140 to 170 workdays, midpoint 155, hence 22 times for that milestone. The later hardening tail brought the final submission to 32,281 authored LOC across 15 languages. That is a separate delivery-scale measure, not a reason to inflate the 22-times figure. The acceleration came from the control system around the agents: graph-bounded context, typed work state, deterministic ratchets, independent evidence and review, and retained execution history.',
              'Do not claim a universally proven twenty-two-times productivity gain. There was no controlled human-only baseline, and the comparison mixes human workdays with seven calendar days of multi-agent execution and long operating hours.':
                  'Do not present 22 times as the elapsed-time compression of the final hardened submission or as a controlled productivity experiment. It is a parametric replay estimate for the R5-at-J+7 milestone.',
              'Why use 155 rather than 115 human workdays?':
                  'How do 22 times and 32,281 authored LOC relate?',
              'One hundred fifteen days estimates an optimized reproduction of the final scope. The selected 155-day midpoint instead prices the workflow that actually happened, including PR handling, CI and review cycles, corrections, documentation and delivery evidence. That matches the replay question more closely.':
                  'They measure different things. Twenty-two times is the historical R5-at-J+7 replay estimate. 32,281 authored LOC across 15 languages is the final delivery-scale measure after the hardening and freeze tail.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Rebuild frozen deck
        shell: bash
        working-directory: docs/presentation
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          test -s output/SpecGraph_presentation_working_v0.8.pptx

      - name: Commit deck source and generated candidate
        shell: bash
        run: |
          git diff --check -- docs/presentation/build-deck.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/presentation/build-deck.mjs docs/presentation/output/SpecGraph_presentation_working_v0.8.pptx
          git commit -m 'docs: align final deck with measured delivery scale'
          git push origin HEAD:main
