name: render-component-topology-once

on:
  push:
    branches: [feat/r5-fuzzy-risk-detector]
    paths:
      - 'docs/assignment/SDD/diagrams/component-topology.puml'
      - '.github/workflows/render-component-topology-once.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feat/r5-fuzzy-risk-detector
          fetch-depth: 1

      - name: Render component topology with canonical PlantUML version
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/SDD/diagrams/component-topology.puml
          grep -q 'RiskSignalDetectorPort' docs/assignment/SDD/diagrams/component-topology.svg
          grep -q 'ADP-DETECTOR-NOOP-001' docs/assignment/SDD/diagrams/component-topology.svg
          grep -q 'ADP-DETECTOR-BAYES-001' docs/assignment/SDD/diagrams/component-topology.svg
          grep -q 'ADP-DETECTOR-FUZZY-001' docs/assignment/SDD/diagrams/component-topology.svg

      - name: Commit generated component view only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add docs/assignment/SDD/diagrams/component-topology.svg
          if git diff --cached --quiet; then
            echo 'Generated SVG already matches the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'docs: regenerate detector component topology view'
          git push origin HEAD:feat/r5-fuzzy-risk-detector
