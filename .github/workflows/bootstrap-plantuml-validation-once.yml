name: bootstrap-plantuml-validation-once

on:
  push:
    paths:
      - '.github/workflows/bootstrap-plantuml-validation-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/plantuml-render-freshness
          fetch-depth: 1
      - name: Regenerate and validate with permanent renderer
        run: bash scripts/render_plantuml.sh
      - name: Commit validated generated views
        run: |
          git add -- 'docs/assignment/**/*.svg'
          if git diff --cached --quiet; then
            echo 'All generated SVGs are already valid and current.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sanitize and validate generated PlantUML SVG views'
          git push origin HEAD:ci/plantuml-render-freshness
