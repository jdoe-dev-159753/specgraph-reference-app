name: demo-images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
  workflow_dispatch:

concurrency:
  group: demo-images-publication
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      APP_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app
      COMPOSE_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app-compose
      R0_PORT: '8080'
      R1_PORT: '8081'
      R2_PORT: '8082'
      R3_PORT: '8083'

    steps:
      - name: Reclaim stale publication state
        run: |
          echo 'Disk before publication cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

          docker ps -aq --filter 'name=specgraph-prepublish-' | xargs -r docker rm -f || true
          docker network ls --format '{{.Name}}' | grep '^specgraph-prepublish-' | xargs -r docker network rm || true
          docker buildx ls --format '{{.Name}}' 2>/dev/null | grep '^specgraph-multiarch-' | xargs -r -n1 docker buildx rm || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 2>/dev/null || true
          docker buildx prune -af || true
          docker builder prune -af || true
          docker container prune -f || true
          docker network prune -f || true
          docker image prune -af || true

          echo 'Disk after publication cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

      - name: Checkout packaging authority
        uses: actions/checkout@v7
        with:
          path: packaging
          persist-credentials: false

      - name: Checkout R0 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r0
          path: packaging/checkpoints/r0
          persist-credentials: false

      - name: Checkout R1 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r1
          path: packaging/checkpoints/r1
          persist-credentials: false

      - name: Checkout R2 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r2
          path: packaging/checkpoints/r2
          persist-credentials: false

      - name: Checkout R3 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r3
          path: packaging/checkpoints/r3
          persist-credentials: false

      - name: Confirm OCI-capable Docker tooling
        working-directory: packaging
        run: |
          docker version
          docker buildx version
          docker compose version
          docker compose -f compose.oci.yaml config --quiet

      - name: Resolve checkpoint identities
        working-directory: packaging
        run: |
          r0_sha="$(git -C checkpoints/r0 rev-parse HEAD)"
          r1_sha="$(git -C checkpoints/r1 rev-parse HEAD)"
          r2_sha="$(git -C checkpoints/r2 rev-parse HEAD)"
          r3_sha="$(git -C checkpoints/r3 rev-parse HEAD)"
          packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          compose_packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-9)"

          for ring in r0 r1 r2 r3; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring}_sha\"")"
            ring_short="$(printf '%s' "$ring_sha" | cut -c1-12)"
            echo "${ring_upper}_SHA=$ring_sha" >> "$GITHUB_ENV"
            echo "${ring_upper}_IMMUTABLE=${ring}-${ring_short}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          done

          # Full checkpoint identities remain in environment/labels/evidence. The complete
          # five-manifest set hash below is the compact immutable binding for the Compose tag.
          echo "COMPOSE_IDENTITY_PREFIX=demo-pkg-${compose_packaging_short}" >> "$GITHUB_ENV"
          echo "BUILDER_NAME=specgraph-multiarch-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build native checkpoint images for pre-publication verification
        working-directory: packaging
        run: |
          for ring in r0 r1 r2 r3; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring_upper}_SHA\"")"
            docker build -f docker/app.Dockerfile \
              --build-arg "SOURCE_ROOT=checkpoints/$ring" \
              --label "org.opencontainers.image.revision=$ring_sha" \
              --label "dev.specgraph.checkpoint.revision=$ring_sha" \
              --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
              -t "specgraph-reference-app:$ring" .
          done

      - name: Verify R0 through R3 side by side before publication
        working-directory: packaging
        env:
          APP_R0_IMAGE: specgraph-reference-app:r0
          APP_R1_IMAGE: specgraph-reference-app:r1
          APP_R2_IMAGE: specgraph-reference-app:r2
          APP_R3_IMAGE: specgraph-reference-app:r3
          COMPOSE_PROJECT_NAME: specgraph-prepublish-${{ github.run_id }}
        run: |
          # The application checkpoints must come from the native builds above. PostgreSQL is
          # an upstream runtime dependency, so provision it explicitly before forbidding pulls.
          docker pull postgres:17-alpine
          docker compose -f compose.oci.yaml up -d --no-build --pull never r0 r1 postgres r2 r3

          for service in r0 r1 r2 r3; do
            container_id="$(docker compose -f compose.oci.yaml ps -q "$service")"
            for attempt in $(seq 1 90); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || true)"
              [ "$health" = healthy ] && break
              if [ "$attempt" -eq 90 ]; then
                docker compose -f compose.oci.yaml ps
                docker compose -f compose.oci.yaml logs --no-color
                exit 1
              fi
              sleep 2
            done
          done

          for port in 8080 8081 8082 8083; do
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r1-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8082 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r2-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8083 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r3-analysis-history.spec.ts'

          docker compose -f compose.oci.yaml down --remove-orphans

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create Buildx multi-platform builder
        run: |
          docker buildx create --name "$BUILDER_NAME" --driver docker-container --use
          docker buildx inspect "$BUILDER_NAME" --bootstrap

      - name: Publish amd64 and arm64 checkpoint images
        working-directory: packaging
        run: |
          for ring in r0 r1 r2 r3; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring_upper}_SHA\"")"
            ring_immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            docker buildx build --builder "$BUILDER_NAME" \
              --platform linux/amd64,linux/arm64 \
              -f docker/app.Dockerfile \
              --build-arg "SOURCE_ROOT=checkpoints/$ring" \
              --label "org.opencontainers.image.revision=$ring_sha" \
              --label "dev.specgraph.checkpoint.revision=$ring_sha" \
              --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
              -t "$APP_PACKAGE:$ring" \
              -t "$APP_PACKAGE:$ring_immutable" \
              --push .
          done

      - name: Verify published multi-platform manifests and pin PostgreSQL
        run: |
          for ring in r0 r1 r2 r3; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            inspect="$(docker buildx imagetools inspect "$APP_PACKAGE:$ring_immutable")"
            printf '%s\n' "$inspect"
            printf '%s\n' "$inspect" | grep -E 'Platform:[[:space:]]+linux/amd64'
            printf '%s\n' "$inspect" | grep -E 'Platform:[[:space:]]+linux/arm64'
            digest="$(printf '%s\n' "$inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            echo "${ring_upper}_DIGEST=$digest" >> "$GITHUB_ENV"
          done

          postgres_inspect="$(docker buildx imagetools inspect postgres:17-alpine)"
          postgres_digest="$(printf '%s\n' "$postgres_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          printf '%s\n' "$postgres_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "POSTGRES_DIGEST=$postgres_digest" >> "$GITHUB_ENV"

      - name: Bind retained Compose identity to complete image set
        run: |
          image_set_hex="$(printf '%s\n' "$R0_DIGEST" "$R1_DIGEST" "$R2_DIGEST" "$R3_DIGEST" "$POSTGRES_DIGEST" | sha256sum | awk '{print $1}')"
          compose_immutable="${COMPOSE_IDENTITY_PREFIX}-set-${image_set_hex}"
          test "${#compose_immutable}" -le 128
          echo "COMPOSE_IMMUTABLE=$compose_immutable" >> "$GITHUB_ENV"

      - name: Publish immutable runtime Compose candidate
        working-directory: packaging
        run: |
          export APP_R0_IMAGE="$APP_PACKAGE:$R0_IMMUTABLE"
          export APP_R1_IMAGE="$APP_PACKAGE:$R1_IMMUTABLE"
          export APP_R2_IMAGE="$APP_PACKAGE:$R2_IMMUTABLE"
          export APP_R3_IMAGE="$APP_PACKAGE:$R3_IMMUTABLE"
          export POSTGRES_IMAGE="postgres:17-alpine@$POSTGRES_DIGEST"

          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          docker buildx imagetools inspect "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"

      - name: Assert immutable Compose provenance resolves this run's complete image set
        working-directory: packaging
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          images="$(docker compose -f "$compose_ref" config --images)"
          printf 'Resolved images for %s:\n%s\n' "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" "$images"
          image_count="$(printf '%s\n' "$images" | sed '/^[[:space:]]*$/d' | wc -l | tr -d '[:space:]')"
          if [ "$image_count" -ne 5 ]; then
            printf 'Compose provenance image-cardinality mismatch\nexpected count: 5\nactual count: %s\nactual images:\n%s\n' \
              "$image_count" "$images" >&2
            exit 1
          fi
          printf 'Compose provenance image cardinality OK: expected=5 actual=%s\n' "$image_count"

          assert_app_identity() {
            service="$1"
            expected_digest="$2"
            actual_images="$(docker compose -f "$compose_ref" config --images "$service")"
            printf '%s provenance dependency closure:\n%s\n' "$service" "$actual_images"

            matched=false
            while IFS= read -r actual; do
              case "$actual" in
                "$APP_PACKAGE@$expected_digest"|"$APP_PACKAGE":*"@$expected_digest")
                  matched=true
                  printf '%s provenance match: %s\n' "$service" "$actual"
                  break
                  ;;
              esac
            done <<< "$actual_images"

            if [ "$matched" != true ]; then
              printf 'Compose provenance mismatch for %s\nexpected repository: %s\nexpected digest: %s\nactual dependency closure:\n%s\n' \
                "$service" "$APP_PACKAGE" "$expected_digest" "$actual_images" >&2
              exit 1
            fi
          }

          assert_app_identity r0 "$R0_DIGEST"
          assert_app_identity r1 "$R1_DIGEST"
          assert_app_identity r2 "$R2_DIGEST"
          assert_app_identity r3 "$R3_DIGEST"

          postgres_actual="$(docker compose -f "$compose_ref" config --images postgres)"
          case "$postgres_actual" in
            *"@$POSTGRES_DIGEST")
              printf 'postgres provenance OK: %s\n' "$postgres_actual"
              ;;
            *)
              printf 'Compose provenance mismatch for postgres\nexpected digest: %s\nactual image: %s\n' \
                "$POSTGRES_DIGEST" "$postgres_actual" >&2
              exit 1
              ;;
          esac

      - name: Prove immutable remote Compose deployment pulls from registry
        working-directory: packaging
        env:
          COMPOSE_PROJECT_NAME: specgraph-remote-proof-${{ github.run_id }}
        run: |
          docker compose -f "oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" down --remove-orphans || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 || true

          docker compose -f "oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" up -d --wait

          for port in 8080 8081 8082 8083; do
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r1-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8082 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r2-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8083 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r3-analysis-history.spec.ts'

          docker compose -f "oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" ps
          docker compose -f "oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" down --remove-orphans

      - name: Promote proven Compose application to reviewer demo tag
        working-directory: packaging
        run: |
          export APP_R0_IMAGE="$APP_PACKAGE:$R0_IMMUTABLE"
          export APP_R1_IMAGE="$APP_PACKAGE:$R1_IMMUTABLE"
          export APP_R2_IMAGE="$APP_PACKAGE:$R2_IMMUTABLE"
          export APP_R3_IMAGE="$APP_PACKAGE:$R3_IMMUTABLE"
          export POSTGRES_IMAGE="postgres:17-alpine@$POSTGRES_DIGEST"

          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:demo"
          docker buildx imagetools inspect "$COMPOSE_PACKAGE:demo"

      - name: Assert promoted demo resolves the proven complete image set
        working-directory: packaging
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:demo"
          images="$(docker compose -f "$compose_ref" config --images)"
          printf 'Resolved images for %s:\n%s\n' "$COMPOSE_PACKAGE:demo" "$images"
          image_count="$(printf '%s\n' "$images" | sed '/^[[:space:]]*$/d' | wc -l | tr -d '[:space:]')"
          if [ "$image_count" -ne 5 ]; then
            printf 'Promoted demo provenance image-cardinality mismatch\nexpected count: 5\nactual count: %s\nactual images:\n%s\n' \
              "$image_count" "$images" >&2
            exit 1
          fi
          printf 'Promoted demo provenance image cardinality OK: expected=5 actual=%s\n' "$image_count"

          assert_app_identity() {
            service="$1"
            expected_digest="$2"
            actual_images="$(docker compose -f "$compose_ref" config --images "$service")"
            printf '%s promoted provenance dependency closure:\n%s\n' "$service" "$actual_images"

            matched=false
            while IFS= read -r actual; do
              case "$actual" in
                "$APP_PACKAGE@$expected_digest"|"$APP_PACKAGE":*"@$expected_digest")
                  matched=true
                  printf '%s promoted provenance match: %s\n' "$service" "$actual"
                  break
                  ;;
              esac
            done <<< "$actual_images"

            if [ "$matched" != true ]; then
              printf 'Promoted demo provenance mismatch for %s\nexpected repository: %s\nexpected digest: %s\nactual dependency closure:\n%s\n' \
                "$service" "$APP_PACKAGE" "$expected_digest" "$actual_images" >&2
              exit 1
            fi
          }

          assert_app_identity r0 "$R0_DIGEST"
          assert_app_identity r1 "$R1_DIGEST"
          assert_app_identity r2 "$R2_DIGEST"
          assert_app_identity r3 "$R3_DIGEST"

          postgres_actual="$(docker compose -f "$compose_ref" config --images postgres)"
          case "$postgres_actual" in
            *"@$POSTGRES_DIGEST")
              printf 'postgres provenance OK: %s\n' "$postgres_actual"
              ;;
            *)
              printf 'Promoted demo provenance mismatch for postgres\nexpected digest: %s\nactual image: %s\n' \
                "$POSTGRES_DIGEST" "$postgres_actual" >&2
              exit 1
              ;;
          esac

      - name: Summarize published reviewer deployment
        working-directory: packaging
        run: |
          {
            echo '## Published reviewer deployment'
            echo
            echo '| Artifact | Checkpoint source | Packaging source | Multi-platform digest |'
            echo '| --- | --- | --- | --- |'
            printf '| R0 image | `%s` | `%s` | `%s` |\n' "$R0_SHA" "$GITHUB_SHA" "$R0_DIGEST"
            printf '| R1 image | `%s` | `%s` | `%s` |\n' "$R1_SHA" "$GITHUB_SHA" "$R1_DIGEST"
            printf '| R2 image | `%s` | `%s` | `%s` |\n' "$R2_SHA" "$GITHUB_SHA" "$R2_DIGEST"
            printf '| R3 image | `%s` | `%s` | `%s` |\n' "$R3_SHA" "$GITHUB_SHA" "$R3_DIGEST"
            printf '| PostgreSQL 17 | upstream | `%s` | `%s` |\n' "$GITHUB_SHA" "$POSTGRES_DIGEST"
            printf '| Compose OCI | R0 + R1 + R2 + R3 + PostgreSQL | `%s` | `%s:%s` |\n' "$GITHUB_SHA" "$COMPOSE_PACKAGE" "$COMPOSE_IMMUTABLE"
            echo
            echo "Published application image manifests contain both \`linux/amd64\` and \`linux/arm64\`. The immutable Compose candidate passed the remote browser proof before \`:demo\` was promoted, and the promoted tag resolves the same complete five-image set."
            echo
            printf 'Reviewer command: `docker compose -f oci://%s:demo up -d --wait`\n' "$COMPOSE_PACKAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup checkpoint test deployments and build cache
        if: always()
        working-directory: packaging
        run: |
          COMPOSE_PROJECT_NAME="specgraph-prepublish-${GITHUB_RUN_ID}" docker compose -f compose.oci.yaml down --remove-orphans || true
          if [ -n "${COMPOSE_IMMUTABLE:-}" ]; then
            COMPOSE_PROJECT_NAME="specgraph-remote-proof-${GITHUB_RUN_ID}" docker compose -f "oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" down --remove-orphans || true
          fi
          docker compose -f "oci://$COMPOSE_PACKAGE:demo" down --remove-orphans || true
          [ -z "${BUILDER_NAME:-}" ] || docker buildx rm "$BUILDER_NAME" || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 2>/dev/null || true
          docker buildx prune -af || true
          docker builder prune -af || true
          docker logout ghcr.io || true
          df -h "$GITHUB_WORKSPACE" || true
