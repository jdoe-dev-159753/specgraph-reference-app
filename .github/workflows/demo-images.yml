name: demo-images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
      - 'e2e/**'
      - 'scripts/**'
      - '.github/workflows/demo-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      APP_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app
      COMPOSE_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app-compose
      R0_PORT: '8080'
      R1_PORT: '8081'
    steps:
      - name: Checkout packaging authority
        uses: actions/checkout@v7
        with:
          path: packaging
          persist-credentials: false

      - name: Checkout R0 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r0
          path: packaging/checkpoints/r0
          persist-credentials: false

      - name: Checkout R1 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r1
          path: packaging/checkpoints/r1
          persist-credentials: false

      - name: Confirm OCI-capable Docker tooling
        working-directory: packaging
        run: |
          docker version
          docker buildx version
          docker compose version
          docker compose -f compose.oci.yaml config --quiet

      - name: Build native checkpoint images for pre-publication verification
        working-directory: packaging
        run: |
          r0_sha="$(git -C checkpoints/r0 rev-parse HEAD)"
          r1_sha="$(git -C checkpoints/r1 rev-parse HEAD)"
          packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          r0_short="$(printf '%s' "$r0_sha" | cut -c1-12)"
          r1_short="$(printf '%s' "$r1_sha" | cut -c1-12)"

          echo "R0_SHA=$r0_sha" >> "$GITHUB_ENV"
          echo "R1_SHA=$r1_sha" >> "$GITHUB_ENV"
          echo "R0_IMMUTABLE=r0-${r0_short}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          echo "R1_IMMUTABLE=r1-${r1_short}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          echo "COMPOSE_IMMUTABLE=demo-r0-${r0_short}-r1-${r1_short}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          echo "BUILDER_NAME=specgraph-multiarch-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

          docker build -f docker/app.Dockerfile \
            --build-arg SOURCE_ROOT=checkpoints/r0 \
            --label "org.opencontainers.image.revision=$r0_sha" \
            --label "dev.specgraph.checkpoint.revision=$r0_sha" \
            --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
            -t specgraph-reference-app:r0 .
          docker build -f docker/app.Dockerfile \
            --build-arg SOURCE_ROOT=checkpoints/r1 \
            --label "org.opencontainers.image.revision=$r1_sha" \
            --label "dev.specgraph.checkpoint.revision=$r1_sha" \
            --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
            -t specgraph-reference-app:r1 .

      - name: Verify R0 and R1 side by side before publication
        working-directory: packaging
        env:
          APP_R0_IMAGE: specgraph-reference-app:r0
          APP_R1_IMAGE: specgraph-reference-app:r1
          COMPOSE_PROJECT_NAME: specgraph-prepublish-${{ github.run_id }}
        run: |
          docker compose up -d --no-build r0 r1

          r0_id="$(docker compose ps -q r0)"
          r1_id="$(docker compose ps -q r1)"
          for attempt in $(seq 1 90); do
            r0_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$r0_id" 2>/dev/null || true)"
            r1_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$r1_id" 2>/dev/null || true)"
            if [ "$r0_health" = healthy ] && [ "$r1_health" = healthy ]; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8081/ >/dev/null

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r1-customer-review.spec.ts'

          docker compose down --remove-orphans

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create Buildx multi-platform builder
        run: |
          docker buildx create --name "$BUILDER_NAME" --driver docker-container --use
          docker buildx inspect "$BUILDER_NAME" --bootstrap

      - name: Publish amd64 and arm64 checkpoint images
        working-directory: packaging
        run: |
          docker buildx build --builder "$BUILDER_NAME" \
            --platform linux/amd64,linux/arm64 \
            -f docker/app.Dockerfile \
            --build-arg SOURCE_ROOT=checkpoints/r0 \
            --label "org.opencontainers.image.revision=$R0_SHA" \
            --label "dev.specgraph.checkpoint.revision=$R0_SHA" \
            --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
            -t "$APP_PACKAGE:r0" \
            -t "$APP_PACKAGE:$R0_IMMUTABLE" \
            --push .

          docker buildx build --builder "$BUILDER_NAME" \
            --platform linux/amd64,linux/arm64 \
            -f docker/app.Dockerfile \
            --build-arg SOURCE_ROOT=checkpoints/r1 \
            --label "org.opencontainers.image.revision=$R1_SHA" \
            --label "dev.specgraph.checkpoint.revision=$R1_SHA" \
            --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
            -t "$APP_PACKAGE:r1" \
            -t "$APP_PACKAGE:$R1_IMMUTABLE" \
            --push .

      - name: Verify published multi-platform manifests
        run: |
          r0_inspect="$(docker buildx imagetools inspect "$APP_PACKAGE:$R0_IMMUTABLE")"
          r1_inspect="$(docker buildx imagetools inspect "$APP_PACKAGE:$R1_IMMUTABLE")"
          printf '%s\n' "$r0_inspect"
          printf '%s\n' "$r1_inspect"

          printf '%s\n' "$r0_inspect" | grep -E 'Platform:[[:space:]]+linux/amd64'
          printf '%s\n' "$r0_inspect" | grep -E 'Platform:[[:space:]]+linux/arm64'
          printf '%s\n' "$r1_inspect" | grep -E 'Platform:[[:space:]]+linux/amd64'
          printf '%s\n' "$r1_inspect" | grep -E 'Platform:[[:space:]]+linux/arm64'

          r0_digest="$(printf '%s\n' "$r0_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          r1_digest="$(printf '%s\n' "$r1_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          test -n "$r0_digest"
          test -n "$r1_digest"
          echo "R0_DIGEST=$r0_digest" >> "$GITHUB_ENV"
          echo "R1_DIGEST=$r1_digest" >> "$GITHUB_ENV"

      - name: Publish runtime Compose application as OCI artifact
        working-directory: packaging
        run: |
          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:demo"
          docker buildx imagetools inspect "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"

      - name: Prove remote Compose OCI deployment pulls from registry
        working-directory: packaging
        run: |
          COMPOSE_PROJECT_NAME="specgraph-prepublish-${GITHUB_RUN_ID}" docker compose down --remove-orphans || true
          docker image rm -f specgraph-reference-app:r0 specgraph-reference-app:r1 || true

          docker compose -f "oci://$COMPOSE_PACKAGE:demo" up -d --wait

          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8081/ >/dev/null

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r1-customer-review.spec.ts'

          docker compose -f "oci://$COMPOSE_PACKAGE:demo" ps

          {
            echo '## Published reviewer deployment'
            echo
            echo '| Artifact | Checkpoint source | Packaging source | Multi-platform digest |'
            echo '| --- | --- | --- | --- |'
            printf '| R0 image | `%s` | `%s` | `%s` |\n' "$R0_SHA" "$GITHUB_SHA" "$R0_DIGEST"
            printf '| R1 image | `%s` | `%s` | `%s` |\n' "$R1_SHA" "$GITHUB_SHA" "$R1_DIGEST"
            printf '| Compose OCI | R0 + R1 | `%s` | `%s:%s` |\n' "$GITHUB_SHA" "$COMPOSE_PACKAGE" "$COMPOSE_IMMUTABLE"
            echo
            echo 'Published image manifests contain both `linux/amd64` and `linux/arm64`.'
            echo
            printf 'Reviewer command: `docker compose -f oci://%s:demo up -d --wait`\n' "$COMPOSE_PACKAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup checkpoint test deployments
        if: always()
        working-directory: packaging
        run: |
          COMPOSE_PROJECT_NAME="specgraph-prepublish-${GITHUB_RUN_ID}" docker compose down --remove-orphans || true
          docker compose -f "oci://$COMPOSE_PACKAGE:demo" down --remove-orphans || true
          docker buildx rm "$BUILDER_NAME" || true
          docker logout ghcr.io || true
