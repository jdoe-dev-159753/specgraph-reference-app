name: demo-images
# Publishes immutable and stable OCI demo images only after runtime and provenance verification.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.oci.yaml'
  workflow_dispatch:

concurrency:
  group: demo-images-publication
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      APP_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app
      COMPOSE_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app-compose
      R0_PORT: '8080'
      R1_PORT: '8081'
      R2_PORT: '8082'
      R3_PORT: '8083'
      R4_PORT: '8084'
      R4_BAYESIAN_PORT: '8085'
      # Retain a small hot cache between rings without allowing five builds to fill a 36 GiB runner.
      BUILDER_CACHE_MAX: '2gb'

    steps:
      - name: Refuse non-main publication dispatch
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
          fi

      - name: Reclaim stale publication state
        run: |
          echo 'Disk before publication cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

          docker ps -aq --filter 'name=specgraph-prepublish-' | xargs -r docker rm -f || true
          docker ps -aq --filter 'name=specgraph-remote-proof-' | xargs -r docker rm -f || true
          docker network ls --format '{{.Name}}' | grep -E '^specgraph-(prepublish|remote-proof)-' | xargs -r docker network rm || true
          docker buildx ls --format '{{.Name}}' 2>/dev/null | grep -E '^specgraph-demo-[0-9]+-[0-9]+$' | xargs -r -n1 docker buildx rm || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true
          # The runner is shared with other exact-head jobs. Reclaim only publication-owned
          # resources here; the capacity gate below fails safely rather than deleting another
          # job's freshly built image or stopped diagnostic container.
          docker image prune -f --filter 'until=24h' || true

          echo 'Disk after publication cleanup:'
          df -h "$GITHUB_WORKSPACE" || df -h /
          docker system df || true

      - name: Checkout packaging authority
        uses: actions/checkout@v7
        with:
          path: packaging
          persist-credentials: false

      - name: Assert exact packaging authority
        working-directory: packaging
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout R0 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r0
          path: packaging/checkpoints/r0
          persist-credentials: false

      - name: Checkout R1 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r1
          path: packaging/checkpoints/r1
          persist-credentials: false

      - name: Checkout R2 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r2
          path: packaging/checkpoints/r2
          persist-credentials: false

      - name: Checkout R3 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r3
          path: packaging/checkpoints/r3
          persist-credentials: false

      - name: Checkout R4 source checkpoint
        uses: actions/checkout@v7
        with:
          ref: demo/r4
          path: packaging/checkpoints/r4
          persist-credentials: false

      - name: Confirm OCI-capable Docker tooling
        working-directory: packaging
        run: |
          docker version
          docker buildx version
          docker compose version
          docker compose -f compose.oci.yaml config --quiet

      - name: Resolve checkpoint identities
        working-directory: packaging
        run: |
          r0_sha="$(git -C checkpoints/r0 rev-parse HEAD)"
          r1_sha="$(git -C checkpoints/r1 rev-parse HEAD)"
          r2_sha="$(git -C checkpoints/r2 rev-parse HEAD)"
          r3_sha="$(git -C checkpoints/r3 rev-parse HEAD)"
          r4_sha="$(git -C checkpoints/r4 rev-parse HEAD)"
          packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          compose_packaging_short="$(printf '%s' "$GITHUB_SHA" | cut -c1-9)"

          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring}_sha\"")"
            ring_short="$(printf '%s' "$ring_sha" | cut -c1-12)"
            echo "${ring_upper}_SHA=$ring_sha" >> "$GITHUB_ENV"
            echo "${ring_upper}_IMMUTABLE=${ring}-${ring_short}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          done

          # R4 baseline and Bayesian are two configured processes of one immutable R4 image.
          # The compact Compose identity binds five application manifests plus PostgreSQL and pgvector.
          echo "COMPOSE_IDENTITY_PREFIX=demo-pkg-${compose_packaging_short}" >> "$GITHUB_ENV"
          echo "BUILDER_NAME=specgraph-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Create run-scoped Buildx builder
        run: |
          # One exact builder owns both native and multi-platform cache, so every prune is scoped.
          docker buildx create --name "$BUILDER_NAME" --driver docker-container
          docker buildx inspect "$BUILDER_NAME" --bootstrap

      - name: Build native checkpoint images for pre-publication verification
        working-directory: packaging
        run: |
          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring_upper}_SHA\"")"
            docker buildx build --builder "$BUILDER_NAME" \
              --platform linux/amd64 \
              --load \
              -f docker/app.Dockerfile \
              --build-arg "SOURCE_ROOT=checkpoints/$ring" \
              --label "org.opencontainers.image.revision=$ring_sha" \
              --label "dev.specgraph.checkpoint.revision=$ring_sha" \
              --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
              -t "specgraph-reference-app:$ring" .
            # --load keeps the final image in the daemon while the builder cache is bounded.
            docker image inspect "specgraph-reference-app:$ring" >/dev/null
            docker buildx prune --builder "$BUILDER_NAME" --force --all \
              --max-used-space "$BUILDER_CACHE_MAX"
            docker buildx du --builder "$BUILDER_NAME"
            df -h "$GITHUB_WORKSPACE"
          done

      - name: Reclaim native build cache before side-by-side proof
        run: |
          # The loaded R0-R4 images retain the proof payload; BuildKit intermediates do not.
          docker buildx prune --builder "$BUILDER_NAME" --force --all
          docker buildx du --builder "$BUILDER_NAME"
          df -h "$GITHUB_WORKSPACE"

      - name: Verify R0 through R4 side by side before publication
        working-directory: packaging
        env:
          APP_R0_IMAGE: specgraph-reference-app:r0
          APP_R1_IMAGE: specgraph-reference-app:r1
          APP_R2_IMAGE: specgraph-reference-app:r2
          APP_R3_IMAGE: specgraph-reference-app:r3
          APP_R4_IMAGE: specgraph-reference-app:r4
          COMPOSE_PROJECT_NAME: specgraph-prepublish-${{ github.run_id }}
        run: |
          # App checkpoints come from the native builds above. Runtime databases are upstream
          # dependencies, so provision them explicitly before forbidding pulls.
          docker pull postgres:17-alpine
          docker pull pgvector/pgvector:0.8.6-pg17
          docker compose -f compose.oci.yaml up -d --no-build --pull never \
            r0 r1 postgres r2 r3 \
            r4-postgres-baseline r4 r4-postgres-bayesian r4-bayesian

          for service in r0 r1 r2 r3 r4 r4-bayesian; do
            container_id="$(docker compose -f compose.oci.yaml ps -q "$service")"
            for attempt in $(seq 1 150); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || true)"
              [ "$health" = healthy ] && break
              if [ "$attempt" -eq 150 ]; then
                docker compose -f compose.oci.yaml ps
                docker compose -f compose.oci.yaml logs --no-color
                exit 1
              fi
              sleep 2
            done
          done

          for port in 8080 8081 8082 8083 8084 8085; do
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/checkpoints/r1/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8082 \
            -v "$PWD/checkpoints/r2/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r2-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8083 \
            -v "$PWD/checkpoints/r3/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r3-analysis-history.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8084 \
            -e EVIDENCE_NAME=r4-baseline \
            -e EXPECT_DETECTOR=none \
            -v "$PWD/checkpoints/r4/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8085 \
            -e EVIDENCE_NAME=r4-bayesian \
            -e EXPECT_DETECTOR=beta-binomial-review-elevation-v1 \
            -v "$PWD/checkpoints/r4/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e R4_BASELINE_URL=http://127.0.0.1:8084 \
            -e R4_BAYESIAN_URL=http://127.0.0.1:8085 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-side-by-side-session-isolation.spec.ts'

          docker compose -f compose.oci.yaml down -v --remove-orphans

      - name: Reclaim native pre-publication images
        run: |
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true
          # The remote proof pulls these immutable upstream dependencies again after
          # publication. Do not retain the large local-proof images across both rings.
          docker image rm -f \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            postgres:17-alpine \
            pgvector/pgvector:0.8.6-pg17 2>/dev/null || true
          docker buildx du --builder "$BUILDER_NAME"
          df -h "$GITHUB_WORKSPACE"

      - name: Require publication headroom before registry mutation
        run: |
          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          minimum_kb=$((8 * 1024 * 1024))
          echo "Publication headroom after local-proof image reclamation: $((available_kb / 1024)) MiB"
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "Need at least 8 GiB free before the first registry mutation; only $((available_kb / 1024)) MiB is available." >&2
            exit 1
          fi

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Confirm run-scoped Buildx publication builder
        run: docker buildx inspect "$BUILDER_NAME"

      - name: Publish amd64 and arm64 checkpoint images
        working-directory: packaging
        run: |
          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_sha="$(eval "printf '%s' \"\$${ring_upper}_SHA\"")"
            ring_immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            docker buildx build --builder "$BUILDER_NAME" \
              --platform linux/amd64,linux/arm64 \
              -f docker/app.Dockerfile \
              --build-arg "SOURCE_ROOT=checkpoints/$ring" \
              --label "org.opencontainers.image.revision=$ring_sha" \
              --label "dev.specgraph.checkpoint.revision=$ring_sha" \
              --label "dev.specgraph.packaging.revision=$GITHUB_SHA" \
              -t "$APP_PACKAGE:$ring" \
              -t "$APP_PACKAGE:$ring_immutable" \
              --push .
            docker buildx prune --builder "$BUILDER_NAME" --force --all \
              --max-used-space "$BUILDER_CACHE_MAX"
            docker buildx du --builder "$BUILDER_NAME"
            df -h "$GITHUB_WORKSPACE"
          done
          docker buildx prune --builder "$BUILDER_NAME" --force --all
          docker buildx du --builder "$BUILDER_NAME"
          df -h "$GITHUB_WORKSPACE"

      - name: Verify published manifests and pin runtime databases
        run: |
          for ring in r0 r1 r2 r3 r4; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            ring_immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            inspect="$(docker buildx imagetools inspect "$APP_PACKAGE:$ring_immutable")"
            printf '%s\n' "$inspect"
            printf '%s\n' "$inspect" | grep -E 'Platform:[[:space:]]+linux/amd64'
            printf '%s\n' "$inspect" | grep -E 'Platform:[[:space:]]+linux/arm64'
            digest="$(printf '%s\n' "$inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            echo "${ring_upper}_DIGEST=$digest" >> "$GITHUB_ENV"
          done

          postgres_inspect="$(docker buildx imagetools inspect postgres:17-alpine)"
          postgres_digest="$(printf '%s\n' "$postgres_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          printf '%s\n' "$postgres_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "POSTGRES_DIGEST=$postgres_digest" >> "$GITHUB_ENV"

          pgvector_inspect="$(docker buildx imagetools inspect pgvector/pgvector:0.8.6-pg17)"
          pgvector_digest="$(printf '%s\n' "$pgvector_inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          printf '%s\n' "$pgvector_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "PGVECTOR_DIGEST=$pgvector_digest" >> "$GITHUB_ENV"

      - name: Bind retained Compose identity to complete unique image set
        run: |
          image_set_hex="$(printf '%s\n' \
            "$R0_DIGEST" "$R1_DIGEST" "$R2_DIGEST" "$R3_DIGEST" "$R4_DIGEST" \
            "$POSTGRES_DIGEST" "$PGVECTOR_DIGEST" | sha256sum | awk '{print $1}')"
          compose_immutable="${COMPOSE_IDENTITY_PREFIX}-set-${image_set_hex}"
          test "${#compose_immutable}" -le 128
          echo "COMPOSE_IMMUTABLE=$compose_immutable" >> "$GITHUB_ENV"

      - name: Publish immutable runtime Compose candidate
        working-directory: packaging
        run: |
          export APP_R0_IMAGE="$APP_PACKAGE:$R0_IMMUTABLE"
          export APP_R1_IMAGE="$APP_PACKAGE:$R1_IMMUTABLE"
          export APP_R2_IMAGE="$APP_PACKAGE:$R2_IMMUTABLE"
          export APP_R3_IMAGE="$APP_PACKAGE:$R3_IMMUTABLE"
          export APP_R4_IMAGE="$APP_PACKAGE:$R4_IMMUTABLE"
          export POSTGRES_IMAGE="postgres:17-alpine@$POSTGRES_DIGEST"
          export PGVECTOR_IMAGE="pgvector/pgvector:0.8.6-pg17@$PGVECTOR_DIGEST"

          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          docker buildx imagetools inspect "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"

      - name: Assert immutable Compose provenance resolves complete reviewer topology
        working-directory: packaging
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          images="$(docker compose -f "$compose_ref" config --images)"
          printf 'Resolved images for %s:\n%s\n' "$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" "$images"
          image_count="$(printf '%s\n' "$images" | sed '/^[[:space:]]*$/d' | wc -l | tr -d '[:space:]')"
          if [ "$image_count" -ne 9 ]; then
            printf 'Compose provenance image-cardinality mismatch\nexpected services/images: 9\nactual: %s\nactual images:\n%s\n' \
              "$image_count" "$images" >&2
            exit 1
          fi

          assert_image_identity() {
            service="$1"
            expected_repository="$2"
            expected_digest="$3"
            actual_images="$(docker compose -f "$compose_ref" config --images "$service")"
            printf '%s provenance dependency closure:\n%s\n' "$service" "$actual_images"
            matched=false
            while IFS= read -r actual; do
              case "$actual" in
                "$expected_repository@$expected_digest"|"$expected_repository":*"@$expected_digest")
                  matched=true
                  printf '%s provenance match: %s\n' "$service" "$actual"
                  break
                  ;;
              esac
            done <<< "$actual_images"
            if [ "$matched" != true ]; then
              printf 'Compose provenance mismatch for %s\nexpected repository: %s\nexpected digest: %s\nactual dependency closure:\n%s\n' \
                "$service" "$expected_repository" "$expected_digest" "$actual_images" >&2
              exit 1
            fi
          }

          assert_image_identity r0 "$APP_PACKAGE" "$R0_DIGEST"
          assert_image_identity r1 "$APP_PACKAGE" "$R1_DIGEST"
          assert_image_identity r2 "$APP_PACKAGE" "$R2_DIGEST"
          assert_image_identity r3 "$APP_PACKAGE" "$R3_DIGEST"
          assert_image_identity r4 "$APP_PACKAGE" "$R4_DIGEST"
          assert_image_identity r4-bayesian "$APP_PACKAGE" "$R4_DIGEST"
          assert_image_identity postgres docker.io/library/postgres "$POSTGRES_DIGEST"
          assert_image_identity r4-postgres-baseline docker.io/pgvector/pgvector "$PGVECTOR_DIGEST"
          assert_image_identity r4-postgres-bayesian docker.io/pgvector/pgvector "$PGVECTOR_DIGEST"

      - name: Prove immutable remote Compose deployment pulls from registry
        working-directory: packaging
        env:
          COMPOSE_PROJECT_NAME: specgraph-remote-proof-${{ github.run_id }}
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE"
          docker compose -f "$compose_ref" down -v --remove-orphans || true
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true

          docker compose -f "$compose_ref" up -d --wait

          for port in 8080 8081 8082 8083 8084 8085; do
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8081 \
            -v "$PWD/checkpoints/r1/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8082 \
            -v "$PWD/checkpoints/r2/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r2-customer-review.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8083 \
            -v "$PWD/checkpoints/r3/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r3-analysis-history.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8084 \
            -e EVIDENCE_NAME=r4-baseline-remote \
            -e EXPECT_DETECTOR=none \
            -v "$PWD/checkpoints/r4/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e BASE_URL=http://127.0.0.1:8085 \
            -e EVIDENCE_NAME=r4-bayesian-remote \
            -e EXPECT_DETECTOR=beta-binomial-review-elevation-v1 \
            -v "$PWD/checkpoints/r4/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-complete-flow.spec.ts'

          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e R4_BASELINE_URL=http://127.0.0.1:8084 \
            -e R4_BAYESIAN_URL=http://127.0.0.1:8085 \
            -v "$PWD/e2e:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-package-lock --ignore-scripts && npx playwright test r4-side-by-side-session-isolation.spec.ts'

          docker compose -f "$compose_ref" ps
          docker compose -f "$compose_ref" down -v --remove-orphans

      - name: Promote proven Compose application to reviewer demo tag
        working-directory: packaging
        run: |
          export APP_R0_IMAGE="$APP_PACKAGE@$R0_DIGEST"
          export APP_R1_IMAGE="$APP_PACKAGE@$R1_DIGEST"
          export APP_R2_IMAGE="$APP_PACKAGE@$R2_DIGEST"
          export APP_R3_IMAGE="$APP_PACKAGE@$R3_DIGEST"
          export APP_R4_IMAGE="$APP_PACKAGE@$R4_DIGEST"
          export POSTGRES_IMAGE="postgres:17-alpine@$POSTGRES_DIGEST"
          export PGVECTOR_IMAGE="pgvector/pgvector:0.8.6-pg17@$PGVECTOR_DIGEST"

          docker compose -f compose.oci.yaml publish -y --resolve-image-digests "$COMPOSE_PACKAGE:demo"
          docker buildx imagetools inspect "$COMPOSE_PACKAGE:demo"

      - name: Assert promoted demo resolves the proven complete image set
        working-directory: packaging
        run: |
          compose_ref="oci://$COMPOSE_PACKAGE:demo"
          images="$(docker compose -f "$compose_ref" config --images)"
          printf 'Resolved images for %s:\n%s\n' "$COMPOSE_PACKAGE:demo" "$images"
          image_count="$(printf '%s\n' "$images" | sed '/^[[:space:]]*$/d' | wc -l | tr -d '[:space:]')"
          if [ "$image_count" -ne 9 ]; then
            printf 'Promoted demo provenance image-cardinality mismatch\nexpected services/images: 9\nactual: %s\nactual images:\n%s\n' \
              "$image_count" "$images" >&2
            exit 1
          fi

          assert_image_identity() {
            service="$1"
            expected_repository="$2"
            expected_digest="$3"
            actual_images="$(docker compose -f "$compose_ref" config --images "$service")"
            matched=false
            while IFS= read -r actual; do
              case "$actual" in
                "$expected_repository@$expected_digest"|"$expected_repository":*"@$expected_digest")
                  matched=true
                  break
                  ;;
              esac
            done <<< "$actual_images"
            if [ "$matched" != true ]; then
              printf 'Promoted demo provenance mismatch for %s\nexpected repository: %s\nexpected digest: %s\nactual dependency closure:\n%s\n' \
                "$service" "$expected_repository" "$expected_digest" "$actual_images" >&2
              exit 1
            fi
          }

          assert_image_identity r0 "$APP_PACKAGE" "$R0_DIGEST"
          assert_image_identity r1 "$APP_PACKAGE" "$R1_DIGEST"
          assert_image_identity r2 "$APP_PACKAGE" "$R2_DIGEST"
          assert_image_identity r3 "$APP_PACKAGE" "$R3_DIGEST"
          assert_image_identity r4 "$APP_PACKAGE" "$R4_DIGEST"
          assert_image_identity r4-bayesian "$APP_PACKAGE" "$R4_DIGEST"
          assert_image_identity postgres docker.io/library/postgres "$POSTGRES_DIGEST"
          assert_image_identity r4-postgres-baseline docker.io/pgvector/pgvector "$PGVECTOR_DIGEST"
          assert_image_identity r4-postgres-bayesian docker.io/pgvector/pgvector "$PGVECTOR_DIGEST"

      - name: Summarize published reviewer deployment
        working-directory: packaging
        run: |
          {
            echo '## Published reviewer deployment'
            echo
            echo '| Artifact | Checkpoint source | Packaging source | Multi-platform digest |'
            echo '| --- | --- | --- | --- |'
            printf '| R0 image | `%s` | `%s` | `%s` |\n' "$R0_SHA" "$GITHUB_SHA" "$R0_DIGEST"
            printf '| R1 image | `%s` | `%s` | `%s` |\n' "$R1_SHA" "$GITHUB_SHA" "$R1_DIGEST"
            printf '| R2 image | `%s` | `%s` | `%s` |\n' "$R2_SHA" "$GITHUB_SHA" "$R2_DIGEST"
            printf '| R3 image | `%s` | `%s` | `%s` |\n' "$R3_SHA" "$GITHUB_SHA" "$R3_DIGEST"
            printf '| R4 image | `%s` | `%s` | `%s` |\n' "$R4_SHA" "$GITHUB_SHA" "$R4_DIGEST"
            printf '| PostgreSQL 17 | upstream | `%s` | `%s` |\n' "$GITHUB_SHA" "$POSTGRES_DIGEST"
            printf '| pgvector 0.8.6-pg17 | upstream | `%s` | `%s` |\n' "$GITHUB_SHA" "$PGVECTOR_DIGEST"
            printf '| Compose OCI | R0-R4 + PostgreSQL + pgvector | `%s` | `%s:%s` |\n' "$GITHUB_SHA" "$COMPOSE_PACKAGE" "$COMPOSE_IMMUTABLE"
            echo
            echo "The immutable Compose candidate passed remote browser proof on ports 8080-8085 before \`:demo\` was promoted. R4 baseline and Bayesian are isolated processes of the same immutable R4 image, each with independent pgvector state."
            echo
            printf 'Reviewer command: `docker compose -f oci://%s:demo up -d --wait`\n' "$COMPOSE_PACKAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup checkpoint test deployments and build cache
        if: always()
        working-directory: packaging
        run: |
          COMPOSE_PROJECT_NAME="specgraph-prepublish-${GITHUB_RUN_ID}" docker compose -f compose.oci.yaml down -v --remove-orphans || true
          if [ -n "${COMPOSE_IMMUTABLE:-}" ]; then
            COMPOSE_PROJECT_NAME="specgraph-remote-proof-${GITHUB_RUN_ID}" docker compose -f "oci://$COMPOSE_PACKAGE:$COMPOSE_IMMUTABLE" down -v --remove-orphans || true
          fi
          if [ -n "${BUILDER_NAME:-}" ]; then
            # A failed ring must not strand its run-owned BuildKit container or cache.
            docker buildx du --builder "$BUILDER_NAME" || true
            docker buildx rm "$BUILDER_NAME" || true
          fi
          docker image rm -f \
            specgraph-reference-app:r0 \
            specgraph-reference-app:r1 \
            specgraph-reference-app:r2 \
            specgraph-reference-app:r3 \
            specgraph-reference-app:r4 2>/dev/null || true
          docker logout ghcr.io || true
          df -h "$GITHUB_WORKSPACE" || true
