name: temp-rerender-sdd-review

on:
  pull_request:
    paths:
      - '.github/workflows/temp-rerender-sdd-review.yml'
      - 'docs/assignment/SDD/diagrams/*.puml'
      - 'docs/assignment/SDD/SDD.md'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Point machine design map at canonical SDD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/assignment/SDD/design-map.yaml')
          text = path.read_text()
          text = text.replace('current_design_readme: README.md', 'current_design_document: SDD.md')
          if 'current_design_document: SDD.md' not in text:
            raise SystemExit('canonical SDD pointer not established')
          path.write_text(text)
          PY
      - name: Render all SDD views
        run: docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 -tsvg docs/assignment/SDD/diagrams/*.puml
      - name: Commit canonical SDD corrections
        run: |
          git add docs/assignment/SDD/SDD.md docs/assignment/SDD/design-map.yaml docs/assignment/SDD/diagrams/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize canonical SDD and rendered views'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
