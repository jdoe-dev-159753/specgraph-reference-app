name: temp-rerender-sdd-review

on:
  pull_request:
    paths:
      - '.github/workflows/temp-rerender-sdd-review.yml'
      - 'docs/assignment/SDD/diagrams/*.puml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Align history terminology in README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/assignment/SDD/README.md')
          text = path.read_text()
          old = '`AnalysisHistoryEntry` is the project-owned history read/write projection: analysis/customer identity, generating operator, generation time, structured result, and reviewable evidence provenance. JPA rows never cross `AnalysisHistoryPort`.'
          new = '`AnalysisHistoryCreateCommand` is the project-owned write input and deliberately has no generated analysis identity. `AnalysisHistoryEntry` is the persisted/read projection: analysis/customer identity, generating operator, generation time, structured result, and reviewable evidence provenance. JPA rows never cross `AnalysisHistoryPort`.'
          if old not in text:
            raise SystemExit('expected history terminology not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Render all SDD views
        run: docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 -tsvg docs/assignment/SDD/diagrams/*.puml
      - name: Commit reviewed SDD corrections
        run: |
          git add docs/assignment/SDD/README.md docs/assignment/SDD/diagrams/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize reviewed SDD failure and dependency views'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
