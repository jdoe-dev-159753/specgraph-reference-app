name: r4-auth-ci
# Exercises the authenticated reviewer shell and its security boundary on the private Docker runner.

on:
  workflow_dispatch:

concurrency:
  group: r4-auth-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-r4-auth:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22 \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints /workspace/build'

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact validated source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Expected source SHA: $SOURCE_SHA"
          echo "Checked-out SHA:     $checked_out_sha"
          test "$checked_out_sha" = "$SOURCE_SHA"

      - name: Reuse or build immutable exact-head application image
        run: |
          image="$(bash scripts/ci/ensure-app-image.sh \
            "specgraph-reference-app:r4-${SOURCE_SHA}" . "$SOURCE_SHA")"
          echo "R4_AUTH_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Reuse or build immutable Playwright dependency image
        run: |
          image="$(bash scripts/ci/ensure-e2e-image.sh)"
          echo "E2E_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Start isolated PostgreSQL and r4-auth application
        run: |
          network="specgraph-r4-auth-${GITHUB_RUN_ID}"
          database="specgraph-r4-auth-db-${GITHUB_RUN_ID}"
          application="specgraph-r4-auth-app-${GITHUB_RUN_ID}"
          echo "R4_AUTH_NETWORK=$network" >> "$GITHUB_ENV"
          echo "R4_AUTH_DATABASE=$database" >> "$GITHUB_ENV"
          echo "R4_AUTH_APPLICATION=$application" >> "$GITHUB_ENV"

          docker network create "$network"
          docker run -d --name "$database" --network "$network" --network-alias postgres \
            -e POSTGRES_DB=specgraph \
            -e POSTGRES_USER=specgraph \
            -e POSTGRES_PASSWORD=specgraph \
            postgres:17-alpine

          for attempt in $(seq 1 60); do
            if docker exec "$database" pg_isready -U specgraph -d specgraph >/dev/null 2>&1; then
              echo "PostgreSQL ready after ${attempt} attempts"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$database"
              exit 1
            fi
            sleep 2
          done

          docker run -d --name "$application" --network "$network" \
            -p "127.0.0.1::8080" \
            -e SPRING_PROFILES_ACTIVE=r4-auth \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/specgraph \
            -e SPRING_DATASOURCE_USERNAME=specgraph \
            -e SPRING_DATASOURCE_PASSWORD=specgraph \
            -e SPECGRAPH_SOURCE_TIME_ZONE=UTC \
            "$R4_AUTH_IMAGE"

          endpoint="$(docker port "$application" 8080/tcp | head -n 1)"
          AUTH_PORT="${endpoint##*:}"
          case "$AUTH_PORT" in
            ''|*[!0-9]*)
              echo "Docker did not return a numeric run-isolated auth port: $endpoint" >&2
              exit 1
              ;;
          esac
          echo "AUTH_PORT=$AUTH_PORT" >> "$GITHUB_ENV"
          printf 'Docker allocated R4 auth port %s for run %s\n' "$AUTH_PORT" "$GITHUB_RUN_ID"

          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${AUTH_PORT}/actuator/health" >/dev/null 2>&1; then
              echo "r4-auth application healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          docker logs "$application"
          exit 1

      - name: VFY-AUTH-001 - Verify multi-operator browser boundary
        env:
          BASE_URL: http://127.0.0.1:${{ env.AUTH_PORT }}
          EVIDENCE_NAME: r4-auth
        run: bash scripts/ci/run-playwright.sh r4-auth.spec.ts

      - name: Upload R4 auth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-auth-${{ env.SOURCE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            e2e/test-results/r4-auth.xml
            e2e/test-results/r4-auth-artifacts/**
            e2e/playwright-report/r4-auth/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Reclaim isolated R4 auth runtime
        if: always()
        run: |
          docker rm -f "${R4_AUTH_APPLICATION:-missing}" "${R4_AUTH_DATABASE:-missing}" 2>/dev/null || true
          docker network rm "${R4_AUTH_NETWORK:-missing}" 2>/dev/null || true
