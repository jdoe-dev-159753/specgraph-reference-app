name: plantuml-diagrams
# Rejects drift between controlled diagram sources and their generated reviewer-facing views.

on:
  pull_request_target:
    paths:
      - 'docs/assignment/**/*.puml'
      - 'docs/assignment/**/*.dot'
      - 'docs/assignment/**/*.svg'
      - 'scripts/render_plantuml.sh'
      - '.github/workflows/plantuml-diagrams.yml'
  push:
    branches: [main]
    paths:
      - 'docs/assignment/**/*.puml'
      - 'docs/assignment/**/*.dot'
      - 'docs/assignment/**/*.svg'
      - 'scripts/render_plantuml.sh'
      - '.github/workflows/plantuml-diagrams.yml'
  workflow_dispatch:
    inputs:
      regenerate_artifact:
        description: 'Regenerate controlled SVGs and upload an apply-ready artifact without modifying the repository'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ (!(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' && (github.event_name != 'issue_comment' || github.event.comment.user.id == 199175422)) && 'specgraph-repository-queue' || format('specgraph-bypassed-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || inputs.regenerate_artifact != true) }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints /workspace/generated-diagrams /workspace/build'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Render controlled diagram sources
        run: bash scripts/render_plantuml.sh
      - name: Reject stale or missing generated SVGs
        run: |
          if [[ -n "$(git status --porcelain -- docs/assignment)" ]]; then
            echo 'Committed controlled diagram SVGs are stale or missing:' >&2
            git status --short -- docs/assignment >&2
            git diff -- docs/assignment >&2 || true
            exit 1
          fi

      - name: Reclaim rendered verification outputs
        if: always()
        run: git restore --worktree docs/assignment && rm -rf generated-diagrams

  regenerate:
    needs: verify
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'pull_request_review' || github.event.review.user.id == 199175422) && github.event_name != 'issues' && always() && github.event_name == 'workflow_dispatch' && inputs.regenerate_artifact == true }}
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    permissions:
      contents: read
    steps:
      - name: Clean container-owned outputs before checkout
        run: |
          docker run --rm -v "$PWD:/workspace" alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'rm -rf /workspace/backend/target /workspace/frontend/node_modules /workspace/frontend/dist /workspace/e2e/node_modules /workspace/e2e/playwright-report /workspace/e2e/test-results /workspace/.checkpoints /workspace/generated-diagrams /workspace/build'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert immutable dispatch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Render controlled diagram sources
        run: bash scripts/render_plantuml.sh
      - name: Package regenerated SVGs and apply-ready patch
        run: |
          mkdir -p generated-diagrams
          find docs/assignment -type f -path '*/diagrams/*.svg' -print0 \
            | xargs -0 -r git add -N --
          git diff --check -- docs/assignment
          git diff --binary -- docs/assignment > generated-diagrams/regenerated-diagrams.patch
          git status --short -- docs/assignment > generated-diagrams/status.txt
          printf 'sourceRef=%s\nsourceSha=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            > generated-diagrams/source.txt
          while IFS= read -r -d '' svg; do
            mkdir -p "generated-diagrams/$(dirname "$svg")"
            cp "$svg" "generated-diagrams/$svg"
          done < <(find docs/assignment -type f -path '*/diagrams/*.svg' -print0)
          echo 'Regeneration is intentionally non-writing.'
          echo 'Apply regenerated changes on a normal feature branch, then commit/push so ordinary PR checks run on that exact head.'
      - name: Upload regenerated diagram bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-diagrams-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: generated-diagrams/
          if-no-files-found: error
          retention-days: 7

      - name: Reclaim regenerated workspace outputs
        if: always()
        run: git restore --worktree docs/assignment && rm -rf generated-diagrams
