name: plantuml-diagrams

on:
  pull_request:
    paths:
      - 'docs/assignment/**/*.puml'
      - 'docs/assignment/**/*.svg'
      - 'scripts/render_plantuml.sh'
      - '.github/workflows/plantuml-diagrams.yml'
  push:
    branches: [main]
    paths:
      - 'docs/assignment/**/*.puml'
      - 'docs/assignment/**/*.svg'
      - 'scripts/render_plantuml.sh'
      - '.github/workflows/plantuml-diagrams.yml'
  workflow_dispatch:
    inputs:
      commit_generated:
        description: 'Regenerate all controlled SVGs and commit changes to the selected branch'
        required: true
        default: false
        type: boolean

concurrency:
  group: plantuml-diagrams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_generated != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Render controlled PlantUML sources
        run: bash scripts/render_plantuml.sh
      - name: Reject stale or missing generated SVGs
        run: |
          if [[ -n "$(git status --porcelain -- docs/assignment)" ]]; then
            echo 'Committed PlantUML SVGs are stale or missing:' >&2
            git status --short -- docs/assignment >&2
            git diff -- docs/assignment >&2 || true
            exit 1
          fi

  regenerate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_generated == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Render controlled PlantUML sources
        run: bash scripts/render_plantuml.sh
      - name: Commit regenerated SVGs when needed
        run: |
          if [[ -z "$(git status --porcelain -- docs/assignment)" ]]; then
            echo 'All committed SVGs are already current.'
            exit 0
          fi
          git add 'docs/assignment/**/*.svg'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate PlantUML SVG views'
          git push origin "HEAD:${GITHUB_REF_NAME}"
