name: diagnose-compose-provenance

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-compose-provenance.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-compose-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    env:
      APP_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app
      COMPOSE_PACKAGE: ghcr.io/${{ github.repository_owner }}/specgraph-reference-app-compose
      TARGET_PACKAGING_SHA: 34f2f67a489209c3fbe48ef1907558dec1d5e6b0
      R0_SHA: 1c479c2d225bcfc5dbd88959f349d6dfbf6bb1ed
      R1_SHA: e2a41694290ef8b03e4485ca1a2fe2c5664d1941
      R2_SHA: 587027b7c80339998ab49e879afefcc692e6d052
      R3_SHA: f790b64808ac058b8cf981dddbc0c0795668ab9c

    steps:
      - name: Confirm diagnostic tooling
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker compose version
          python3 --version

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Locate retained run 8 artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          packaging_short="${TARGET_PACKAGING_SHA:0:12}"
          compose_short="${TARGET_PACKAGING_SHA:0:9}"

          echo "R0_IMMUTABLE=r0-${R0_SHA:0:12}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          echo "R1_IMMUTABLE=r1-${R1_SHA:0:12}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          echo "R2_IMMUTABLE=r2-${R2_SHA:0:12}-pkg-${packaging_short}" >> "$GITHUB_ENV"
          echo "R3_IMMUTABLE=r3-${R3_SHA:0:12}-pkg-${packaging_short}" >> "$GITHUB_ENV"

          python3 - "$compose_short" "$RUNNER_TEMP/compose-tags.txt" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          prefix = f"demo-pkg-{sys.argv[1]}-set-"
          output = sys.argv[2]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          token = os.environ["GITHUB_TOKEN"]
          package = "specgraph-reference-app-compose"
          matches = []

          for page in range(1, 11):
              url = (
                  f"https://api.github.com/users/{owner}/packages/container/"
                  f"{package}/versions?per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  versions = json.load(response)
              for version in versions:
                  tags = version.get("metadata", {}).get("container", {}).get("tags", [])
                  matches.extend(tag for tag in tags if tag.startswith(prefix))
              if len(versions) < 100:
                  break

          matches = sorted(set(matches))
          with open(output, "w", encoding="utf-8") as handle:
              for tag in matches:
                  handle.write(tag + "\n")

          print(f"Compose tag prefix: {prefix}")
          print(f"Matching retained tags: {len(matches)}")
          for tag in matches:
              print(f"  {tag}")
          PY

          if [ ! -s "$RUNNER_TEMP/compose-tags.txt" ]; then
            printf 'ASSERTION FAILED [compose-tag-discovery]: no retained Compose tag starts with demo-pkg-%s-set- for packaging SHA %s\n' \
              "$compose_short" "$TARGET_PACKAGING_SHA" >&2
            exit 1
          fi

      - name: Resolve expected application manifest digests
        run: |
          set -euo pipefail
          for ring in r0 r1 r2 r3; do
            ring_upper="$(printf '%s' "$ring" | tr '[:lower:]' '[:upper:]')"
            immutable="$(eval "printf '%s' \"\$${ring_upper}_IMMUTABLE\"")"
            ref="$APP_PACKAGE:$immutable"
            printf '\n===== EXPECTED %s MANIFEST =====\nref=%s\n' "$ring_upper" "$ref"
            inspect="$(docker buildx imagetools inspect "$ref")"
            printf '%s\n' "$inspect"
            digest="$(printf '%s\n' "$inspect" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
            if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              printf 'ASSERTION FAILED [%s-manifest-digest]: expected sha256 digest for %s; actual=[%s]\n' \
                "$ring" "$ref" "$digest" >&2
              exit 1
            fi
            echo "${ring_upper}_DIGEST=$digest" >> "$GITHUB_ENV"
            printf 'resolved_expected_digest=%s\n' "$digest"
          done

      - name: Diagnose retained Compose provenance without short-circuiting
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/compose-provenance-report.md"
          : > "$report"

          {
            echo '## Compose provenance diagnostic for #203'
            echo
            echo "Source failing run: \`demo-images #8\`, packaging \`$TARGET_PACKAGING_SHA\`."
            echo
            echo '| Service | Expected manifest digest | Actual retained Compose image | Assertion |'
            echo '| --- | --- | --- | --- |'
          } >> "$report"

          total_failures=0
          compose_count=0

          while IFS= read -r compose_tag; do
            [ -n "$compose_tag" ] || continue
            compose_count=$((compose_count + 1))
            compose_ref="oci://$COMPOSE_PACKAGE:$compose_tag"
            tag_set_hex="${compose_tag##*-set-}"

            printf '\n############################################################\n'
            printf 'COMPOSE CANDIDATE %d\ntag=%s\nref=%s\nencoded_set_sha256=%s\n' \
              "$compose_count" "$compose_tag" "$compose_ref" "$tag_set_hex"
            printf '############################################################\n'

            printf '\n===== OCI MANIFEST =====\n'
            docker buildx imagetools inspect "$COMPOSE_PACKAGE:$compose_tag"

            printf '\n===== MATERIALIZED COMPOSE CONFIG =====\n'
            docker compose -f "$compose_ref" config

            printf '\n===== MATERIALIZED IMAGE LIST =====\n'
            images="$(docker compose -f "$compose_ref" config --images)"
            printf '%s\n' "$images" | nl -ba
            image_count="$(printf '%s\n' "$images" | sed '/^[[:space:]]*$/d' | wc -l | tr -d '[:space:]')"
            if [ "$image_count" -eq 5 ]; then
              printf 'ASSERTION OK [image-cardinality]: expected=5 actual=%s\n' "$image_count"
            else
              printf 'ASSERTION FAILED [image-cardinality]: expected=5 actual=%s images=[%s]\n' \
                "$image_count" "$images" >&2
              total_failures=$((total_failures + 1))
            fi

            postgres_actual=''

            for service in r0 r1 r2 r3 postgres; do
              actual="$(docker compose -f "$compose_ref" config --images "$service" 2>&1)" || {
                status=$?
                printf 'ASSERTION FAILED [%s-config-images]: command_status=%s output=[%s]\n' \
                  "$service" "$status" "$actual" >&2
                printf '| `%s` | command failed | `%s` | FAIL |\n' "$service" "${actual//|/\\|}" >> "$report"
                total_failures=$((total_failures + 1))
                continue
              }

              printf '\nSERVICE %s\nactual=[%s]\n' "$service" "$actual"

              if [ "$service" = postgres ]; then
                postgres_actual="$actual"
                if printf '%s\n' "$actual" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
                  printf 'ASSERTION OK [postgres-digest-shape]: actual=[%s]\n' "$actual"
                  printf '| `postgres` | digest-pinned upstream | `%s` | OK |\n' "${actual//|/\\|}" >> "$report"
                else
                  printf 'ASSERTION FAILED [postgres-digest-shape]: expected suffix=@sha256:<64 hex> actual=[%s]\n' \
                    "$actual" >&2
                  printf '| `postgres` | suffix `@sha256:<64 hex>` | `%s` | FAIL |\n' "${actual//|/\\|}" >> "$report"
                  total_failures=$((total_failures + 1))
                fi
                continue
              fi

              service_upper="$(printf '%s' "$service" | tr '[:lower:]' '[:upper:]')"
              expected_digest="$(eval "printf '%s' \"\$${service_upper}_DIGEST\"")"
              case "$actual" in
                "$APP_PACKAGE@$expected_digest"|"$APP_PACKAGE":*"@$expected_digest")
                  printf 'ASSERTION OK [%s-provenance]: expected_repo=%s expected_digest=%s actual=[%s]\n' \
                    "$service" "$APP_PACKAGE" "$expected_digest" "$actual"
                  printf '| `%s` | `%s` | `%s` | OK |\n' \
                    "$service" "$expected_digest" "${actual//|/\\|}" >> "$report"
                  ;;
                *)
                  printf 'ASSERTION FAILED [%s-provenance]: expected_repo=%s expected_digest=%s actual=[%s]\n' \
                    "$service" "$APP_PACKAGE" "$expected_digest" "$actual" >&2
                  printf '| `%s` | `%s` | `%s` | **FAIL** |\n' \
                    "$service" "$expected_digest" "${actual//|/\\|}" >> "$report"
                  total_failures=$((total_failures + 1))
                  ;;
              esac
            done

            if printf '%s\n' "$postgres_actual" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
              postgres_digest="${postgres_actual##*@}"
              actual_set_hex="$(printf '%s\n' \
                "$R0_DIGEST" "$R1_DIGEST" "$R2_DIGEST" "$R3_DIGEST" "$postgres_digest" \
                | sha256sum | awk '{print $1}')"
              printf '\nSET HASH\nencoded=[%s]\nrecomputed_from_materialized_services=[%s]\n' \
                "$tag_set_hex" "$actual_set_hex"
              if [ "$actual_set_hex" = "$tag_set_hex" ]; then
                printf 'ASSERTION OK [complete-set-binding]: encoded=%s recomputed=%s\n' \
                  "$tag_set_hex" "$actual_set_hex"
              else
                printf 'ASSERTION FAILED [complete-set-binding]: encoded=%s recomputed=%s postgres_actual=[%s]\n' \
                  "$tag_set_hex" "$actual_set_hex" "$postgres_actual" >&2
                total_failures=$((total_failures + 1))
              fi
              {
                echo
                echo "Candidate \`$compose_tag\`: encoded set \`$tag_set_hex\`, recomputed set \`$actual_set_hex\`."
              } >> "$report"
            else
              {
                echo
                echo "Candidate \`$compose_tag\`: complete-set hash could not be recomputed because PostgreSQL did not expose a digest-pinned image."
              } >> "$report"
            fi
          done < "$RUNNER_TEMP/compose-tags.txt"

          {
            echo
            echo "Diagnostic assertion failures: **$total_failures**."
            echo
            echo "Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$report"

          printf '\n===== FINAL DIAGNOSTIC REPORT =====\n'
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "DIAGNOSTIC_FAILURES=$total_failures" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_REPORT=$report" >> "$GITHUB_ENV"

          # Intentionally do not fail this forensic workflow: all failed assertions are
          # printed with their complete expected/actual strings and persisted to #203 below.
          printf '\nDiagnostic completed with %s failed assertion(s); evidence collection continues.\n' "$total_failures"

      - name: Persist diagnostic evidence on discovery issue 203
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f "${DIAGNOSTIC_REPORT:-}" ]; then
            printf 'Diagnostic report was not produced; see Actions run %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            exit 0
          fi

          python3 - "$DIAGNOSTIC_REPORT" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          with open(sys.argv[1], encoding="utf-8") as handle:
              body = handle.read()

          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/203/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          print(f"Persisted diagnostic evidence: {payload['html_url']}")
          PY

      - name: Cleanup registry session
        if: always()
        run: docker logout ghcr.io || true
