name: reconcile-native-work-graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-native-work-graph.yml
      - scripts/reconcile_native_work_graph.py

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile native issue relations before prose cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/reconcile_native_work_graph.py
