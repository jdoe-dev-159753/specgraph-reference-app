name: temp-finalize-sdd-history

on:
  pull_request:
    paths:
      - '.github/workflows/temp-finalize-sdd-history.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Align history contract in the SDD
        run: |
          python3 - <<'PY'
          from pathlib import Path

          design = Path('docs/assignment/SDD/design-map.yaml')
          text = design.read_text()
          anchor = '''  CTR-OPERATOR-ID-001:\n    name: OperatorId\n    owner: MOD-IDENTITY-001\n    contains: [operator_identity]\n    invariants: [INV-HIST-001]\n'''
          replacement = anchor + '''  CTR-ANALYSIS-HISTORY-ENTRY-001:\n    name: AnalysisHistoryEntry\n    owner: MOD-ANALYSIS-001\n    contains: [analysis_identity, customer_identity, operator_identity, generated_at, result, evidence_provenance]\n    invariants: [INV-HIST-001]\n'''
          if 'CTR-ANALYSIS-HISTORY-ENTRY-001:' not in text:
              text = text.replace(anchor, replacement)
          text = text.replace('''  PRT-HISTORY-001:\n    name: AnalysisHistoryPort\n    owner: MOD-ANALYSIS-001\n    direction: outbound\n    stores: CTR-ANALYSIS-RESULT-001\n''', '''  PRT-HISTORY-001:\n    name: AnalysisHistoryPort\n    owner: MOD-ANALYSIS-001\n    direction: outbound\n    stores: CTR-ANALYSIS-HISTORY-ENTRY-001\n    returns: CTR-ANALYSIS-HISTORY-ENTRY-001\n''')
          text = text.replace('''  FR-HIST-001:\n    elements: [MOD-ANALYSIS-001, PRT-HISTORY-001, ADP-HIST-JPA-001, INF-DB-001, CTR-OPERATOR-ID-001, CTR-ANALYSIS-RESULT-001]\n''', '''  FR-HIST-001:\n    elements: [MOD-ANALYSIS-001, PRT-HISTORY-001, ADP-HIST-JPA-001, INF-DB-001, CTR-ANALYSIS-HISTORY-ENTRY-001, CTR-OPERATOR-ID-001, CTR-ANALYSIS-RESULT-001]\n''')
          text = text.replace('''  FR-HIST-002:\n    elements: [CMP-UI-001, ADP-HTTP-001, MOD-ANALYSIS-001, PRT-HISTORY-001, ADP-HIST-JPA-001]\n''', '''  FR-HIST-002:\n    elements: [CMP-UI-001, ADP-HTTP-001, MOD-ANALYSIS-001, PRT-HISTORY-001, ADP-HIST-JPA-001, CTR-ANALYSIS-HISTORY-ENTRY-001]\n''')
          design.write_text(text)

          seq = Path('docs/assignment/SDD/diagrams/sequence-analysis-history.puml')
          text = seq.read_text()
          text = text.replace('Jpa --> History : project-owned history projections', 'Jpa --> History : AnalysisHistoryEntry[]')
          text = text.replace('History --> Analysis : prior analysis summaries/details', 'History --> Analysis : AnalysisHistoryEntry[]')
          seq.write_text(text)

          readme = Path('docs/assignment/SDD/README.md')
          text = readme.read_text()
          text = text.replace('The stable application contracts are `CustomerSnapshot`, `AnalysisResult`, `PolicyEvidence`, and `OperatorId`.', 'The stable application contracts are `CustomerSnapshot`, `AnalysisResult`, `PolicyEvidence`, `OperatorId`, and `AnalysisHistoryEntry`.')
          needle = '[PlantUML source](diagrams/domain-contracts.puml)\n'
          addition = '\n`AnalysisHistoryEntry` is the project-owned history read/write projection: analysis/customer identity, generating operator, generation time, structured result, and reviewable evidence provenance. JPA rows never cross `AnalysisHistoryPort`.\n'
          if '`AnalysisHistoryEntry` is the project-owned history read/write projection' not in text:
              text = text.replace(needle, needle + addition)
          readme.write_text(text)
          PY
      - name: Render authoritative SDD PlantUML views
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace plantuml/plantuml:1.2026.6 \
            -tsvg docs/assignment/SDD/diagrams/*.puml
      - name: Commit final SDD alignment
        run: |
          git add docs/assignment/SDD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: align history contract and final SDD views'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
