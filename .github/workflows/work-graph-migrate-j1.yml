name: work-graph-migrate-j1

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/work-graph-migrate-j1.cjs'
      - '.github/workflows/work-graph-migrate-j1.yml'

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, specgraph-reference-app, ci]
    steps:
      - uses: actions/checkout@v7
        with:
          path: .workgraph-migration
          persist-credentials: false
      - name: Apply one-shot native WorkGraph migration
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.workgraph-migration/.github/scripts/work-graph-migrate-j1.cjs`);
            await run({ github, context, core });
