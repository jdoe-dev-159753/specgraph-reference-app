# CI overlay binds R5 to run-owned network/cache resources so the proof remains hermetic.
networks:
  default:
    external: true
    name: "${R5_NETWORK_NAME:?R5_NETWORK_NAME must identify this run attempt}"

volumes:
  r5-embedding-cache:
    external: true
    name: "${R5_EMBEDDING_CACHE_VOLUME:?R5_EMBEDDING_CACHE_VOLUME must identify this run attempt}"
